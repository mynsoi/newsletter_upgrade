# 백로그 claim 추출 — 수동 실행 전용(workflow_dispatch)
#
# 일일 정상 운영분(enrich_daily_limit, 기본 500건)은 collect.yml(daily-collect)의
# "claim 추출(make enrich)" 단계가 **최신 수집분부터** 매일 처리한다. 이 워크플로는 그
# 바깥의 대량 백로그(추출 대기 누적분)를 티어별 라운드로빈 + 비용 상한으로 처리한다.
# 즉 분업은 방향으로 갈린다 — 일일은 큐의 최신 끝, 백로그는 티어를 고르게 훑는다.
#
# 재개 가능: 문서 1건씩 커밋되므로 타임아웃·중단 후 재실행해도 처리된 분은 남고
# 나머지(status='new')만 이어서 처리된다.
# 비밀값: ANTHROPIC_API_KEY, DATABASE_URL 은 GitHub Secrets 로만 주입한다.
#
# 계층 실행(2026-09-04 확정): 백로그를 한 번에 다 돌리지 않고 밀도 높은 순서로 나눠 돈다.
#   계층1  exclude_sources=arxiv-*                    922건   arXiv 제외 전부
#   계층2  published_after=2026-03-01               7,414건   arXiv 최근 6개월
#          (계층1이 끝난 뒤 실행하면 잔여가 arXiv뿐이라 이 인자만으로 계층2가 된다)
#   보류   (실행하지 않음)                         13,699건   arXiv 12개월 이전분
# 보류분은 삭제하지 않는다 — 문서는 그대로 두고 status='new'로 남겨, 필요해지면 필터만
# 풀어 이어서 처리한다. arXiv를 뒤로 미루는 근거는 게이트 차단율로, arXiv 66~76% 대
# 나머지 소스 0~6%(2026-09-04 실측)라 같은 비용으로 건지는 claim이 훨씬 적다.
# 계층 필터는 연쇄 회차마다 그대로 이어진다 — 잔여 건수도 같은 필터로 세므로, 보류 계층이
# 남아 있어도 현재 계층이 끝나면 연쇄가 멈춘다.
#
# 연쇄 실행(2026-09-04 추가): 한 실행은 최대 BACKLOG_BATCH_LIMIT(2,500)건만 처리하고,
# 종료 시 잔여 status='new'가 있으면 이 워크플로를 스스로 다시 트리거한다.
# - cost_cap은 "이번 실행 하나"가 아니라 "체인 전체 누적"에 대한 총 상한이다.
#   각 회차는 (총상한 - 이전 회차까지의 누적 비용)만큼만 남은 예산으로 돈다.
# - chain_iteration / cumulative_cost / cumulative_docs 는 체인이 내부적으로 이어받는
#   상태값이다 — 사람이 새로 체인을 시작할 때는 손대지 않고 기본값(1 / 0 / 0)으로 둔다.
# - 무한 루프 방지: chain_iteration이 12를 넘으면 예산이 남아도 더 이어가지 않는다.
# - 다음 회차 트리거는 GITHUB_TOKEN으로 `gh workflow run`을 호출한다. GitHub는 종종
#   GITHUB_TOKEN이 발생시킨 이벤트가 새 워크플로 실행을 못 만들게 막는데, workflow_dispatch를
#   API로 명시 호출하는 경우는 보통 이 제한을 받지 않는다 — 다만 조직 정책에 따라 막힐 수
#   있으니, 체인이 조용히 끊기면(Step Summary에 "다음 회차 트리거"가 안 보이는데 잔여가
#   있는 경우) repo secrets에 `workflow` 스코프 PAT을 `WORKFLOW_TRIGGER_TOKEN`으로 추가한다
#   (아래 env에서 있으면 우선 사용하도록 폴백 처리돼 있다).
name: enrich-backlog

on:
  workflow_dispatch:
    inputs:
      cost_cap:
        description: "체인 전체 누적 실측 비용(USD) 상한 — 도달 시 연쇄 중단"
        type: string
        required: true
        default: "5"
      limit:
        description: "체인 전체 누적 처리 문서 수 상한 (비워두면 비용 상한까지 무제한)"
        type: string
        required: false
        default: ""
      exclude_sources:
        description: "제외할 source_id 패턴(쉼표 구분, '*' 와일드카드). 계층1은 'arxiv-*'"
        type: string
        required: false
        default: ""
      published_after:
        description: "발행일 하한 YYYY-MM-DD. 계층2는 '2026-03-01' (빈 값이면 하한 없음)"
        type: string
        required: false
        default: ""
      chain_iteration:
        description: "내부용 — 연쇄 실행 회차(1부터). 사람이 새로 시작할 때는 그대로 둔다."
        type: string
        required: false
        default: "1"
      cumulative_cost:
        description: "내부용 — 이전 회차까지 누적 실측 비용(USD). 사람이 새로 시작할 때는 0."
        type: string
        required: false
        default: "0"
      cumulative_docs:
        description: "내부용 — 이전 회차까지 누적 처리 문서 수. 사람이 새로 시작할 때는 0."
        type: string
        required: false
        default: "0"

# 두 백로그 실행이 겹치면 비용 상한을 각자 독립적으로 계산해 실측 총액이 두 배로
# 뛸 수 있다 — 직렬화해 방지. 체인의 다음 회차도 같은 그룹이라 앞 회차 종료를 기다린다.
concurrency:
  group: enrich-backlog
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # 체인의 다음 회차를 gh workflow run으로 트리거하기 위해 필요

env:
  BACKLOG_BATCH_LIMIT: 2500  # 회차당 처리 문서 수 상한

jobs:
  enrich-backlog:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install -e .

      - name: 마이그레이션 (make init)
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::secrets.DATABASE_URL 미설정" ; exit 1
          fi
          make init

      - name: 백로그 처리 (회차 ${{ inputs.chain_iteration }})
        id: run
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::secrets.ANTHROPIC_API_KEY 미설정" ; exit 1
          fi

          COST_CAP="${{ inputs.cost_cap }}"
          CUM_COST="${{ inputs.cumulative_cost }}"
          REMAIN_COST=$(python -c "print(max(0.0, float('$COST_CAP') - float('$CUM_COST')))")

          BATCH_LIMIT="$BACKLOG_BATCH_LIMIT"
          if [ -n "${{ inputs.limit }}" ]; then
            REMAIN_DOCS=$(python -c "print(max(0, int('${{ inputs.limit }}') - int('${{ inputs.cumulative_docs }}')))")
            if [ "$REMAIN_DOCS" -lt "$BATCH_LIMIT" ]; then BATCH_LIMIT="$REMAIN_DOCS"; fi
          fi

          BUDGET_LEFT=$(python -c "print(1 if $REMAIN_COST > 0 else 0)")
          if [ "$BUDGET_LEFT" = "0" ] || [ "$BATCH_LIMIT" -le 0 ]; then
            echo "이번 회차는 예산/건수 상한에 이미 도달해 처리 없이 종료" | tee enrich-backlog.log
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            echo "run_cost=0" >> "$GITHUB_OUTPUT"
            echo "run_docs=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 계층 필터 — 연쇄 회차마다 그대로 이어져야 한다(안 그러면 다음 회차가 보류
          # 계층인 arXiv 옛날분을 집는다). 아래 트리거 단계에서도 같은 값을 넘긴다.
          FILTER_ARGS=""
          if [ -n "${{ inputs.exclude_sources }}" ]; then
            FILTER_ARGS="$FILTER_ARGS --exclude-sources ${{ inputs.exclude_sources }}"
          fi
          if [ -n "${{ inputs.published_after }}" ]; then
            FILTER_ARGS="$FILTER_ARGS --published-after ${{ inputs.published_after }}"
          fi

          echo "실행: python src/enrich/extract_claims.py --backlog --cost-cap $REMAIN_COST --limit $BATCH_LIMIT$FILTER_ARGS"
          set +e
          python src/enrich/extract_claims.py --backlog --cost-cap "$REMAIN_COST" --limit "$BATCH_LIMIT" $FILTER_ARGS 2>&1 | tee enrich-backlog.log
          EC=${PIPESTATUS[0]}
          set -e

          echo "exit_code=$EC" >> "$GITHUB_OUTPUT"
          RUN_COST=$(grep -oP '실측 비용 \$\K[0-9.]+' enrich-backlog.log | tail -1)
          RUN_DOCS=$(grep -oP '백로그 처리 \K[0-9]+' enrich-backlog.log | tail -1)
          echo "run_cost=${RUN_COST:-0}" >> "$GITHUB_OUTPUT"
          echo "run_docs=${RUN_DOCS:-0}" >> "$GITHUB_OUTPUT"

      - name: 요약 (Step Summary)
        if: always()
        run: |
          {
            echo "## 백로그 claim 추출 결과 (회차 ${{ inputs.chain_iteration }}/12)"
            echo
            echo '```'
            tail -n 20 enrich-backlog.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 로그 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrich-backlog-log-round${{ inputs.chain_iteration }}
          path: enrich-backlog.log
          retention-days: 30
          if-no-files-found: warn

      - name: 체인 판단 및 다음 회차 트리거
        if: always()
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TRIGGER_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          EC="${{ steps.run.outputs.exit_code }}"
          RUN_COST="${{ steps.run.outputs.run_cost }}"
          RUN_DOCS="${{ steps.run.outputs.run_docs }}"
          ITER="${{ inputs.chain_iteration }}"
          COST_CAP="${{ inputs.cost_cap }}"
          LIMIT="${{ inputs.limit }}"
          EXCLUDE="${{ inputs.exclude_sources }}"
          PUBLISHED_AFTER="${{ inputs.published_after }}"

          # 단계마다 셸이 새로 뜨므로 계층 필터를 여기서 다시 조립한다(앞 단계와 같은 값)
          FILTER_ARGS=""
          if [ -n "$EXCLUDE" ]; then FILTER_ARGS="$FILTER_ARGS --exclude-sources $EXCLUDE"; fi
          if [ -n "$PUBLISHED_AFTER" ]; then FILTER_ARGS="$FILTER_ARGS --published-after $PUBLISHED_AFTER"; fi

          NEW_CUM_COST=$(python -c "print(round(float('${{ inputs.cumulative_cost }}') + float('$RUN_COST'), 4))")
          NEW_CUM_DOCS=$(( ${{ inputs.cumulative_docs }} + RUN_DOCS ))
          NEW_ITER=$(( ITER + 1 ))

          {
            echo
            echo "### 연쇄 상태 (회차 ${ITER})"
            echo "- 이번 회차: exit=${EC}, 비용 \$${RUN_COST}, 처리 시도 ${RUN_DOCS}건"
            echo "- 누적: 비용 \$${NEW_CUM_COST} / 총상한 \$${COST_CAP}, 처리 ${NEW_CUM_DOCS}건"
          } >> "$GITHUB_STEP_SUMMARY"

          STOP_REASON=""
          if [ "$EC" = "2" ]; then STOP_REASON="모델 단가 설정 오류(exit 2) — 확인 필요, 연쇄 중단"; fi
          if [ -z "$STOP_REASON" ] && [ "$EC" = "1" ]; then STOP_REASON="실패율 5% 이상(exit 1) — 확인 필요, 연쇄 중단"; fi
          if [ -z "$STOP_REASON" ] && [ "$(python -c "print(1 if $NEW_CUM_COST >= float('$COST_CAP') else 0)")" = "1" ]; then
            STOP_REASON="누적 비용이 총 상한(\$${COST_CAP})에 도달"
          fi
          if [ -z "$STOP_REASON" ] && [ -n "$LIMIT" ] && [ "$NEW_CUM_DOCS" -ge "$LIMIT" ]; then
            STOP_REASON="누적 처리 건수가 상한(${LIMIT}건)에 도달"
          fi
          if [ -z "$STOP_REASON" ] && [ "$NEW_ITER" -gt 12 ]; then
            STOP_REASON="연쇄 실행 12회 안전장치 도달"
          fi
          if [ -z "$STOP_REASON" ]; then
            # 같은 계층 필터를 적용해 센다 — 보류 계층(arXiv 옛날분)을 잔여로 오인하면
            # 처리할 게 없는데도 12회까지 헛돈다.
            REMAIN_NEW=$(python src/enrich/extract_claims.py --count-remaining $FILTER_ARGS)
            echo "- 잔여 백로그(현재 계층 기준): ${REMAIN_NEW}건" >> "$GITHUB_STEP_SUMMARY"
            if [ "$REMAIN_NEW" -le 0 ]; then
              STOP_REASON="백로그 소진(잔여 0건)"
            fi
          fi

          if [ -n "$STOP_REASON" ]; then
            echo "연쇄 중단: $STOP_REASON"
            echo "- **연쇄 중단**: ${STOP_REASON}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "다음 회차(${NEW_ITER}/12) 트리거 — 누적 비용 \$${NEW_CUM_COST}로 이어서 실행"
            echo "- **다음 회차(${NEW_ITER}/12) 트리거**" >> "$GITHUB_STEP_SUMMARY"
            if gh workflow run enrich-backlog.yml \
              --ref "${{ github.ref_name }}" \
              -f cost_cap="$COST_CAP" \
              -f limit="$LIMIT" \
              -f exclude_sources="$EXCLUDE" \
              -f published_after="$PUBLISHED_AFTER" \
              -f chain_iteration="$NEW_ITER" \
              -f cumulative_cost="$NEW_CUM_COST" \
              -f cumulative_docs="$NEW_CUM_DOCS"; then
              :
            else
              MANUAL_CMD="gh workflow run enrich-backlog.yml -f cost_cap=$COST_CAP -f limit=$LIMIT -f exclude_sources=$EXCLUDE -f published_after=$PUBLISHED_AFTER -f chain_iteration=$NEW_ITER -f cumulative_cost=$NEW_CUM_COST -f cumulative_docs=$NEW_CUM_DOCS"
              echo "::warning::다음 회차 자동 트리거 실패(GITHUB_TOKEN 워크플로 재귀 실행 제한 가능성) — repo secrets에 workflow 스코프 PAT을 WORKFLOW_TRIGGER_TOKEN으로 추가하거나 수동 실행: $MANUAL_CMD"
              echo "- **다음 회차 자동 트리거 실패** — 수동 실행: \`$MANUAL_CMD\`" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: 실패율 5% 이상이면 이 실행 자체도 실패로 표시
        if: steps.run.outputs.exit_code == '1' || steps.run.outputs.exit_code == '2'
        run: exit 1
