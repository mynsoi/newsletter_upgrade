어 시절에는 자기 분야를 깊게 파는 것이 정답처럼 느껴지지만, 시니어가 되면 사업과 데이터를 이해하고 개발자와 구현 범위를 협의하는 일까지 필요해집니다. 여기에 AI를 활용하면 개발자의 도움이 필요했던 아이디어도 혼자서 작동하는 결과물로 만들어 볼 수 있습니다. 이쯤 되면 결국 무엇이든 조금씩 하는 사람이 되어야 하지 않을까 싶겠죠.", "하지만 활용할 수 있는 도구가 많아질수록, 자신이 원래 가지고 있던 강점은 오히려 더 중요해집니다.", "왜 이런 일이 벌어질까요? AI 덕분에 우리가 만들어 낼 수 있는 것은 거의 끝없이 늘어납니다. 하지만 무엇을 만들어야 하는지, 방금 나온 결과물이 쓸 만한지, 어디서 멈추고 무엇을 버려야 하는지는 여전히 사람이 판단해야 합니다. AI가 정해 주는 것이 아니죠. 만드는 일이 쉬워질수록 일의 무게 중심은 ‘만들기’에서 ‘고르고 버리기’로 옮겨 갑니다. AI가 내놓은 결과물에 “아니오”라고 말하려면 자기만의 기준이 있어야 한다는 뜻입니다. 왜 아닌지를 설명할 수 있어야 하니까요.", "진짜 변화는 코드를 짤 수 있게 된 것 자체보다, 오랫동안 다져 온 감각과 판단을 실제로 돌아가는 결과물까지 이어 갈 수 있게 됐다는 점입니다. AI가 자신을 다른 사람으로 바꿔 놓았다기보다는, 이미 잘하던 일이 닿을 수 있는 범위를 넓혀 준 셈입니다.", "그러니 전문가가 될지, 여러 분야를 두루 다루는 사람이 될지 둘 중 하나를 선택할 필요는 없습니다. 중심이 되는 전문성은 더 깊게 다지되, 그 전문성에서 나온 기준을 가지고 필요한 영역으로 건너가면 됩니다. 그것이 개발이든, 데이터든, 비즈니스든 말이죠.", "여러분의 업무에 대입해 보면 어떨까요? 디자이너 자리에 기획안을 쓰는 사람, 현장 점검 결과를 정리하는 사람, 계약서를 검토하는 사람을 넣어 봐도 이야기는 같습니다. AI는 순식간에 여러 개의 초안을 만들어 줍니다. 하지만 그중 무엇을 살리고 무엇을 지울지 가려내는 눈은 각자가 그 일을 해 오면서 쌓은 것입니다. 초안을 얻는 속도와 초안을 판단하는 능력은 별개의 문제인 것이죠.", "여기서 주의해야 할 함정이 하나 있습니다. AI를 능숙하게 활용하게 된 것을 자신의 실력이 향상된 것으로 착각하기 쉽다는 점입니다. ‘인지적 오프로딩의 딜레마’를 생각해 볼 수 있습니다. 어떤 일을 AI에 많이 맡길수록 정작 사람이 그 분야의 능력을 유지하고 키우기는 어려워진다는 것이죠.", "결과물이 빨리 나온다고 해서 그 결과물을 판단하는 능력까지 함께 좋아지는 것은 아닙니다. 결과물을 얻는 동안 판단에 필요한 근육은 오히려 약해질 수 있으니까요.", "한 직무를 3~5년쯤 수행하다 보면 말로 모두 설명하기 어려운 고유한 감각이 생깁니다. 결국 사람의 판단이 필요한 구간은 남습니다. AI 활용 능력은 바로 그 감각 위에 얹힐 때 비로소 실력이 됩니다. 판단할 기준은 없는데 도구를 다루는 솜씨만 좋아진다면 어떻게 될까요? 더 많이 만들 수는 있겠지만, 더 잘 만들지는 못할 것입니다.", "AI가 모두에게 같은 도구를 쥐여 준 이상, 차이를 만드는 것은 도구 바깥에 있습니다. 무엇을 남기고 무엇을 버릴지 결정하는 기준, 그것이 곧 실력입니다. 다음에 AI가 내놓은 결과물을 받아 들면 스스로에게 이렇게 물어보기 바랍니다. “이 중에서 무엇을 버리겠는가, 그리고 그 이유를 내 말로 설명할 수 있는가?” 이 질문에 답할 수 있다면, 여러분은 AI를 잘 쓰는 사람을 넘어 실력 있는 사람입니다."], "최종": ["AI를 업무에 활용하다 보면 이런 고민이 들 수 있습니다. 한 분야를 깊이 파고드는 전문가가 되어야 할까요, 아니면 여러 분야를 두루 다루는 사람이 되어야 할까요? AI로 할 수 있는 일이 늘어날수록, 정작 어떤 실력을 쌓아야 할지는 더 헷갈리기도 합니다. 디자이너든, 기획자든, AI를 업무에 활용하는 여러분 모두에게 해당하는 질문입니다.", "디자인을 예로 들어 보겠습니다. 주니어 시절에는 자기 분야를 깊게 파는 것이 정답처럼 느껴집니다. 좋은 화면을 만들고, 사용자의 문제를 해결하고, 복잡한 서비스를 정리하는 일만 제대로 익히려 해도 오랜 시간이 필요하니까요. 하지만 시니어가 되면 디자인 실력만으로는 일이 풀리지 않습니다. 사업이 어떻게 돌아가는지 이해해야 하고, 데이터를 살펴야 하며, 구현 가능한 범위를 개발자와 협의해야 하죠. 브랜드와 콘텐츠까지 함께 고민해야 하는 일도 늘어납니다.", "여기에 AI를 본격적으로 활용하면 할 수 있는 일의 범위가 또 한 번 넓어집니다. 예전 같으면 개발자의 도움이 필요하다는 이유로 접어 두었을 아이디어를 혼자서 만들어 볼 수 있게 된 것이죠. 자료를 조사하고, 뼈대를 세우고, 글과 이미지를 만드는 것은 물론 코드까지 짜서 실제로 작동하는 결과물을 내놓을 수 있습니다. 이쯤 되면 디자이너라는 직업도 결국 무엇이든 조금씩 하는 사람으로 바뀌지 않을까 싶겠죠.", "하지만 활용할 수 있는 도구가 많아질수록, 자신이 원래 가지고 있던 강점은 오히려 더 중요해집니다.", "왜 이런 일이 벌어질까요? AI 덕분에 우리가 만들어 낼 수 있는 것은 거의 끝없이 늘어납니다. 하지만 무엇을 만들어야 하는지, 방금 나온 결과물이 쓸 만한지, 어디서 멈추고 무엇을 버려야 하는지는 여전히 사람이 판단해야 합니다. AI가 정해 주는 것이 아니죠. 만드는 일이 쉬워질수록 일의 무게 중심은 ‘만들기’에서 ‘고르고 버리기’로 옮겨 갑니다. AI가 내놓은 결과물에 “아니오”라고 말하려면 자기만의 기준이 있어야 한다는 뜻입니다. 왜 아닌지를 설명할 수 있어야 하니까요.", "진짜 변화도 여기에 있습니다. 코드를 짤 수 있게 된 것 자체보다 더 큰 변화는 오랫동안 디자이너로서 다져 온 감각과 판단을 화면 설계에만 머물게 할 필요가 없어졌다는 점입니다. 이제는 그 판단을 실제로 돌아가는 결과물까지 이어 갈 수 있게 됐으니까요. AI가 자신을 다른 사람으로 바꿔 놓았다기보다는, 이미 잘하던 일이 닿을 수 있는 범위를 넓혀 준 셈입니다.", "그러니 전문가가 될지, 여러 분야를 두루 다루는 사람이 될지 둘 중 하나를 선택할 필요는 없습니다. 중심이 되는 전문성은 더 깊게 다지되, 그 전문성에서 나온 기준을 가지고 필요한 영역으로 건너가면 됩니다. 그것이 개발이든, 데이터든, 비즈니스든 말이죠.", "여러분의 업무에 대입해 보면 어떨까요? 디자이너 자리에 기획안을 쓰는 사람, 현장 점검 결과를 정리하는 사람, 계약서를 검토하는 사람을 넣어 봐도 이야기는 같습니다. AI는 순식간에 여러 개의 초안을 만들어 줍니다. 하지만 그중 무엇을 살리고 무엇을 지울지 가려내는 눈은 각자가 그 일을 해 오면서 쌓은 것입니다. 초안을 얻는 속도와 초안을 판단하는 능력은 별개의 문제인 것이죠.", "여기서 주의해야 할 함정이 하나 있습니다. AI를 능숙하게 활용하게 된 것을 자신의 실력이 향상된 것으로 착각하기 쉽다는 점입니다. AI의 도움이 코딩 실력을 쌓는 데 어떤 영향을 미치는지 다룬 앤트로픽의 문서를 참고하면, ‘인지적 오프로딩의 딜레마’를 생각해 볼 수 있습니다. 어떤 일을 AI에 많이 맡길수록 정작 사람이 그 분야의 능력을 유지하고 키우기는 어려워진다는 것이죠.", "결과물이 빨리 나온다고 해서 그 결과물을 판단하는 능력까지 함께 좋아지는 것은 아닙니다. 결과물을 얻는 동안 판단에 필요한 근육은 오히려 약해질 수 있으니까요.", "한 직무를 3~5년쯤 수행하다 보면 말로 모두 설명하기 어려운 고유한 감각이 생깁니다. 결국 사람의 판단이 필요한 구간은 남습니다. AI 활용 능력은 바로 그 감각 위에 얹힐 때 비로소 실력이 됩니다. 판단할 기준은 없는데 도구를 다루는 솜씨만 좋아진다면 어떻게 될까요? 더 많이 만들 수는 있겠지만, 더 잘 만들지는 못할 것입니다.", "AI가 모두에게 같은 도구를 쥐여 준 이상, 차이를 만드는 것은 도구 바깥에 있습니다. 무엇을 남기고 무엇을 버릴지 결정하는 기준, 그것이 곧 실력입니다. 다음에 AI가 내놓은 결과물을 받아 들면 스스로에게 이렇게 물어보기 바랍니다. “이 중에서 무엇을 버리겠는가, 그리고 그 이유를 내 말로 설명할 수 있는가?” 이 질문에 답할 수 있다면, 여러분은 AI를 잘 쓰는 사람을 넘어 실력 있는 사람입니다."], "재작성(astra)": ["지난 9월, 한 프로덕트 디자인 디렉터가 링크드인에 짧은 고민을 올렸습니다. AI 시대의 디자이너는 한 분야를 깊이 파고드는 전문가가 되어야 할까요, 아니면 여러 분야를 두루 다루는 사람이 되어야 할까요? 디자이너들이나 고민할 문제라고 생각할지 모르지만, 이 질문은 우리 모두에게 해당합니다. AI를 업무에 활용하는 여러분에게도 말이죠.", "이 디렉터도 처음부터 답을 가지고 있었던 것은 아닙니다. 경력이 쌓이면서 생각이 몇 번 바뀌었다고 하는데요, 주니어 시절에는 자기 분야를 깊게 파는 것이 정답이라고 믿었습니다. 좋은 화면을 만들고, 사용자의 문제를 해결하고, 복잡한 서비스를 정리하는 일만 제대로 익히려 해도 오랜 시간이 필요했으니까요. 하지만 시니어가 되자 디자인 실력만으로는 일이 풀리지 않았습니다. 사업이 어떻게 돌아가는지 이해해야 했고, 데이터를 살펴야 했으며, 구현 가능한 범위를 개발자와 협의해야 했죠. 브랜드와 콘텐츠까지 함께 고민해야 하는 일도 늘어났습니다.", "그러다 직접 사업을 시작하고 AI를 본격적으로 활용하면서 할 수 있는 일의 범위가 또 한 번 넓어졌다고 합니다. 예전 같으면 개발자의 도움이 필요하다는 이유로 접어 두었을 아이디어를 혼자서 만들어 볼 수 있게 된 것이죠. 자료를 조사하고, 뼈대를 세우고, 글과 이미지를 만드는 것은 물론 코드까지 짜서 실제로 작동하는 결과물을 내놓게 됐습니다. 이쯤 되면 디자이너라는 직업도 결국 무엇이든 조금씩 하는 사람으로 바뀌지 않을까 싶겠죠. 이 디렉터도 처음에는 그렇게 짐작했다고 합니다.", "하지만 AI를 쓰면 쓸수록 결론은 오히려 반대쪽으로 기울었습니다. 활용할 수 있는 도구가 많아지니 자신이 원래 가지고 있던 강점이 더 중요해졌다는 것입니다.", "왜 이런 일이 벌어질까요? AI 덕분에 우리가 만들어 낼 수 있는 것은 거의 끝없이 늘어납니다. 하지만 무엇을 만들어야 하는지, 방금 나온 결과물이 쓸 만한지, 어디서 멈추고 무엇을 버려야 하는지는 여전히 사람이 판단해야 합니다. AI가 정해 주는 것이 아니죠. 만드는 일이 쉬워질수록 일의 무게 중심은 ‘만들기’에서 ‘고르고 버리기’로 옮겨 갑니다. AI가 내놓은 결과물에 “아니오”라고 말하려면 자기만의 기준이 있어야 한다는 뜻입니다. 왜 아닌지를 설명할 수 있어야 하니까요.", "이 디렉터가 꼽은 진짜 변화도 여기에 있었습니다. 코드를 짤 수 있게 된 것 자체는 생각만큼 대단한 일이 아니었다고 합니다. 더 큰 변화는 오랫동안 디자이너로서 다져 온 감각과 판단을 화면 설계에만 머물게 할 필요가 없어졌다는 점이었죠. 이제는 그 판단을 실제로 돌아가는 결과물까지 이어 갈 수 있게 됐으니까요. AI가 자신을 다른 사람으로 바꿔 놓았다기보다는, 이미 잘하던 일이 닿을 수 있는 범위를 넓혀 준 셈입니다.", "그러니 전문가가 될지, 여러 분야를 두루 다루는 사람이 될지 둘 중 하나를 선택할 필요가 없다고 이 디렉터는 말합니다. 중심이 되는 전문성은 더 깊게 다지되, 그 전문성에서 나온 기준을 가지고 필요한 영역으로 건너가면 된다는 것입니다. 그것이 개발이든, 데이터든, 비즈니스든 말이죠.", "여러분의 업무에 대입해 보면 어떨까요? 디자이너 자리에 기획안을 쓰는 사람, 현장 점검 결과를 정리하는 사람, 계약서를 검토하는 사람을 넣어 봐도 이야기는 같습니다. AI는 순식간에 여러 개의 초안을 만들어 줍니다. 하지만 그중 무엇을 살리고 무엇을 지울지 가려내는 눈은 각자가 그 일을 해 오면서 쌓은 것입니다. 초안을 얻는 속도와 초안을 판단하는 능력은 별개의 문제인 것이죠.", "여기서 주의해야 할 함정이 하나 있습니다. AI를 능숙하게 활용하게 된 것을 자신의 실력이 향상된 것으로 착각하기 쉽다는 점입니다. 기업에서 AI를 가르치는 한 강사는 AI의 도움이 코딩 실력을 쌓는 데 어떤 영향을 미치는지 다룬 앤트로픽의 문서를 소개하면서 ‘인지적 오프로딩의 딜레마’를 이야기했습니다. 어떤 일을 AI에 많이 맡길수록 정작 사람이 그 분야의 능력을 유지하고 키우기는 어려워진다는 것이죠.", "이 강사는 지금 AI 없이 직접 자료를 조사하라고 하면 12시간 넘게 걸릴 것이고, 솔직히 해낼 자신도 없다고 털어놓았습니다. 결과물이 빨리 나온다고 해서 그 결과물을 판단하는 능력까지 함께 좋아지는 것은 아니라는 뜻입니다. 결과물을 얻는 동안 판단에 필요한 근육은 오히려 약해질 수 있으니까요.", "같은 강사는 한 직무를 3~5년쯤 수행하면 말로 모두 설명하기 어려운 고유한 감각이 생긴다고도 말했습니다. 결국 사람의 판단이 필요한 구간은 남는다는 것입니다. AI 활용 능력은 바로 그 감각 위에 얹힐 때 비로소 실력이 됩니다. 판단할 기준은 없는데 도구를 다루는 솜씨만 좋아진다면 어떻게 될까요? 더 많이 만들 수는 있겠지만, 더 잘 만들지는 못할 것입니다.", "AI가 모두에게 같은 도구를 쥐여 준 이상, 차이를 만드는 것은 도구 바깥에 있습니다. 무엇을 남기고 무엇을 버릴지 결정하는 기준, 그것이 곧 실력입니다. 다음에 AI가 내놓은 결과물을 받아 들면 스스로에게 이렇게 물어보기 바랍니다. “이 중에서 무엇을 버리겠는가, 그리고 그 이유를 내 말로 설명할 수 있는가?” 이 질문에 답할 수 있다면, 여러분은 AI를 잘 쓰는 사람을 넘어 실력 있는 사람입니다."], "초안(Claude)": ["지난 9월, 한 프로덕트 디자인 디렉터가 링크드인에 짧은 고민을 올렸습니다. AI 시대의 디자이너는 한 분야를 깊게 파고드는 전문가가 되어야 할까요, 아니면 여러 분야를 두루 다루는 사람이 되어야 할까요? 디자이너만의 고민처럼 보이지만, 끝까지 읽고 나면 우리 모두에게 해당하는 질문이라는 걸 알게 됩니다.", "이 디렉터의 생각은 경력이 쌓이면서 몇 번 바뀌었습니다. 주니어 시절에는 자기 분야를 깊이 파는 것이 답이라고 믿었습니다. 좋은 화면을 만들고, 사용자의 문제를 풀고, 복잡한 서비스를 정리하는 일 하나만 제대로 익히는 데에도 긴 시간이 걸렸으니까요. 시니어가 되자 사정이 달라졌습니다. 디자인 실력만으로는 일이 풀리지 않았거든요. 사업이 어떻게 굴러가는지 알아야 했고, 데이터를 들여다봐야 했고, 어디까지 구현할 수 있는지 개발자와 협의해야 했습니다. 브랜드와 콘텐츠까지 함께 고민하는 일도 늘었죠.", "그러다 직접 사업을 시작하고 AI를 본격적으로 쓰면서 할 수 있는 일의 폭이 또 한 번 크게 넓어졌습니다. 예전 같으면 개발자의 손을 빌려야 한다는 이유로 접어 두었을 아이디어를 이제는 혼자서 만들어 봅니다. 자료를 조사하고, 뼈대를 세우고, 글과 이미지를 만들고, 코드까지 짜서 실제로 작동하는 결과물을 내놓습니다. 처음에는 이 디렉터도 이러다 디자이너라는 직업이 결국 무엇이든 조금씩 하는 사람으로 바뀌는 게 아닐까 짐작했다고 합니다.", "그런데 AI를 쓰면 쓸수록 결론은 정반대로 기울었습니다. 도구가 늘어나자 오히려 자기 강점의 무게가 더 커졌다는 것이죠.", "자, 왜 그럴까요? AI 덕분에 만들어 낼 수 있는 것은 거의 끝없이 늘어납니다. 하지만 무엇을 만들어야 하는지, 방금 나온 결과물이 쓸 만한지, 어디서 멈추고 무엇을 버려야 하는지는 AI가 정해 주지 않습니다. 그 판단은 여전히 사람이 해야 합니다. 만드는 일이 쉬워질수록 일의 무게 중심은 '만들기'에서 '고르고 버리기'로 옮겨 갑니다. 제목의 질문이 바로 여기에 닿아 있습니다. AI가 내놓은 결과물에 ‘아니오’라고 말하려면, 왜 아닌지를 설명할 수 있는 자기만의 기준이 있어야 하니까요.", "이 디렉터가 꼽은 진짜 변화도 같은 곳을 가리킵니다. 코드를 짤 수 있게 된 것 자체는 생각만큼 대단한 일이 아니었다고 합니다. 더 큰 변화는 오랫동안 디자이너로 다져 온 감각과 판단을 화면 설계에서 멈추지 않고, 실제로 돌아가는 결과물까지 끌고 갈 수 있게 됐다는 점이었습니다. AI가 사람을 다른 사람으로 바꿔 놓은 게 아니라, 이미 하던 일이 닿는 거리를 늘려 준 셈입니다. 그래서 이 디렉터는 둘 중 하나를 고를 필요가 없다고 말합니다. 중심이 되는 전문성은 더 깊이 다지고, 그 기준을 가지고 개발이든 데이터든 비즈니스든 필요한 곳까지 건너가면 된다는 것입니다.", "이 이야기를 우리 일에 옮겨 보겠습니다. 디자이너 자리에 기획안을 쓰는 사람, 현장 점검 결과를 정리하는 사람, 계약서를 검토하는 사람을 넣어 봐도 구조는 같습니다. AI는 초안을 순식간에 여러 개 만들어 줍니다. 그중 무엇을 살리고 무엇을 지울지 가려내는 눈은 각자가 그 일을 해 오며 쌓은 것입니다.", "여기서 짚어야 할 함정이 하나 있습니다. AI를 능숙하게 쓰게 된 것을 실력이 늘어난 것으로 착각하기 쉽다는 점입니다. 기업에서 AI를 가르치는 한 강사는, AI의 도움이 코딩 실력을 쌓는 데 어떤 영향을 주는지 다룬 앤트로픽의 문서를 소개하며 '인지적 오프로딩의 딜레마'를 이야기했습니다. 어떤 일을 AI에 많이 맡길수록 사람이 그 분야의 능력을 지키고 키우기는 어려워진다는 것이죠. 이 강사는 지금 AI 없이 손으로 자료를 조사하라고 하면 12시간 넘게 걸릴 것이고, 솔직히 해낼 자신도 없다고 털어놓았습니다. 결과물이 빨리 나오는 동안 그 결과물을 판단할 근육은 오히려 약해질 수 있다는 뜻입니다.", "같은 강사는 한 직무를 3~5년쯤 하면 말로 다 풀어내기 어려운 고유한 감각이 생긴다고도 말했습니다. 사람의 판단이 필요한 구간은 결국 남는다는 것이죠. AI 활용 능력은 바로 그 감각 위에 얹힐 때 비로소 실력이 됩니다. 기준 없이 도구만 능숙해지면, 우리는 더 많이 만들 뿐 더 잘 만들지는 못합니다.", "AI가 모두에게 같은 도구를 쥐여 준 이상, 차이를 만드는 것은 도구 바깥에 있습니다. 무엇을 남기고 무엇을 버릴지 정하는 기준, 그것이 곧 실력입니다. 다음에 AI가 내놓은 결과물을 받아 들면 스스로에게 물어보시기 바랍니다. \"이 중에서 무엇을 버리겠는가, 그리고 그 이유를 내 말로 설명할 수 있는가?\" 이 질문에 답할 수 있다면, 여러분은 AI를 잘 쓰는 사람을 넘어 실력 있는 사람입니다."]}, "feedback": "출처를 문장에다가 남길 필요 없어. 그리고 디자이너 이야기가 좀 길어."}, "sources": [{"kind": "Threads", "id": "01", "who": "공냥이 @specal1849", "date": "2026-04-16", "title": "프롬프트 60건 공유했더니 팀장이 \"회사용으로 정리해 올려\" → 직원이 복사 중. \"정리된 데이터 달라 하면", "reach": "262", "core": "프롬프트 60건 공유했더니 팀장이 \"회사용으로 정리해 올려\" → 직원이 복사 중. \"정리된 데이터 달라 하면 되잖아\"", "star": false}, {"kind": "Threads", "id": "02", "who": "공냥이", "date": "2025-05-09", "title": "AI 글의 세 패턴(구조 집착·반복 어휘·지나친 균형) — 그런데 이 글 자체가 AI로 썼다는 반전", "reach": "202", "core": "AI 글의 세 패턴(구조 집착·반복 어휘·지나친 균형) — 그런데 이 글 자체가 AI로 썼다는 반전", "star": false}, {"kind": "Threads", "id": "03", "who": "공냥이", "date": "2026-01-04", "title": "프롬프트에서 중요한 걸 앞에 쓰는 이유(트랜스포머·위치 편향)", "reach": "168", "core": "프롬프트에서 중요한 걸 앞에 쓰는 이유(트랜스포머·위치 편향)", "star": false}, {"kind": "Threads", "id": "04", "who": "공냥이", "date": "2025-12-09", "title": "동사 하나로 결과가 갈린다 — 동사·목적·조건·형식 원칙", "reach": "140", "core": "동사 하나로 결과가 갈린다 — 동사·목적·조건·형식 원칙", "star": false}, {"kind": "Threads", "id": "05", "who": "공냥이", "date": "2026-03-06", "title": "기업 AX 현장 18편: 검증 부담은 형태만 바뀌고, 기대치 function sents(t){return t.replace(/\s+/g,' ').split(/(?<=[.?!])\s+/).filter(Boolean)}
function lcs(a,b){const n=a.length,m=b.length,d=Array.from({length:n+1},()=>new Int16Array(m+1));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);const ka=new Set(),kb=new Set();let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){ka.add(i);kb.add(j);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return[ka,kb]}
function reader(){
  const vs = Object.keys(D.ws.versions), cur = D.ws.versions[state.ver], base = D.ws.versions[state.cmp];
  let html;
  if (state.diff && state.cmp !== state.ver){
    const A = base.flatMap(p=>sents(p)).map(s=>s.replace(/\s/g,'')), keep = lcs(A, cur.flatMap(p=>sents(p)).map(s=>s.replace(/\s/g,'')))[1];
    let k=0; html = cur.map(p=>'<p>'+sents(p).map(s=>{const c=keep.has(k++)?'':'s-add';return `<span class="${c}">${esc(s)}</span>`}).join(' ')+'</p>').join('');
  } else html = cur.map(p=>`<p>${esc(p)}</p>`).join('');
  const chars = cur.join('').replace(/\s/g,'').length;
  return `<div class="grid lg:grid-cols-[1fr_300px] gap-6"><article>
    <div class="flex flex-wrap items-center gap-2 mb-4">${pills(vs.map(v=>[v]),state.ver,'setVer')}</div>
    <h1 class="text-[24px] md:text-[26px] font-bold leading-snug tracking-tight mb-5">${esc(D.ws.title)}</h1>
    <div class="read">${html}</div></article>
  <aside class="lg:sticky lg:top-24 h-fit space-y-3">
    ${card(`<div class="text-[12px] text-zinc-500">분량</div><div class="text-[22px] font-semibold tabular-nums">${chars.toLocaleString()}<span class="text-[13px] font-normal text-zinc-500"> 자 (공백 제외)</span></div>
      <div class="mt-3 flex items-center justify-between text-[13px]"><span>바뀐 문장 표시</span><button onclick="state.diff=!state.diff;render()" class="w-10 h-6 rounded-full p-0.5 ${state.diff?'bg-blue-600':'bg-zinc-300 dark:bg-zinc-700'}"><span class="block w-5 h-5 rounded-full bg-white transition ${state.diff?'translate-x-4':''}"></span></button></div>
      <div class="mt-2 text-[12.5px] text-zinc-500">비교 기준 <select onchange="state.cmp=this.value;render()" class="ml-1 rounded border border-zinc-200 dark:border-zinc-800 bg-transparent px-1 py-0.5">${vs.map(v=>`<option ${v===state.cmp?'selected':''}>${v}</option>`).join('')}</select></div>`)}
    ${card(`<div class="text-[13px] font-medium mb-1.5">이번에 반영한 피드백</div><div class="text-[13px] text-zinc-600 dark:text-zinc-300 rounded-lg bg-zinc-50 dark:bg-zinc-900 p-2.5">“${esc(D.ws.feedback)}”</div>
      <button onclick="setStep(4)" class="mt-3 w-full rounded-lg border border-zinc-200 dark:border-zinc-800 py-2 text-[13px]">피드백 더 주기</button>
      <button onclick="setStep(5)" class="mt-2 w-full rounded-lg bg-blue-600 text-white py-2 text-[13px] font-medium">이미지 만들고 확정</button>`)}
  </aside></div>`;
}

      <div class="text-[11px] text-center text-zinc-400">이 글에서 진행자 비용 $1.23 · 글은 쓰지 않고 진행만 합니다</div></div>
    <div class="px-3 pt-2 flex gap-1.5 overflow-x-auto no-scrollbar">${['원문 더 모아 줘','오류 원인 찾아 줘','왜 이렇게 바뀌었어?'].map(x=>`<button class="shrink-0 rounded-full border border-zinc-200 dark:border-zinc-800 px-2.5 py-1 text-[12px]">${x}</button>`).join('')}</div>

}

   <div class="w-full md:w-[520px] rounded-t-2xl md:rounded-2xl bg-white dark:bg-zinc-950 p-5 fade">

    <div class="text-[12.5px] text-zinc-500 mb-4">진행자(Claude)가 aside로 찾고, 원문은 요약하지 않고 그대로 저장합니다. 읽기만 합니다.</div>
    <label class="text-[13px] font-medium">무엇을 찾을까요</label><input value="AI를 쓰면서 오히려 실력이 줄었다는 경험담" class="mt-1 mb-3 w-full rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-900 px-3 py-2 text-[14px]">
    <label class="text-[13px] font-medium">어디서</label><div class="mt-1 mb-3 flex flex-wrap gap-1.5">${['Threads','LinkedIn','경영일기','직접 URL'].map((x,i)=>`<button class="rounded-full border px-3 py-1 text-[13px] ${i<2?'border-blue-600 bg-blue-50 text-blue-700 dark:bg-blue-500/10 dark:text-blue-300':'border-zinc-200 dark:border-zinc-800'}">${x}</button>`).join('')}</div>
    <div class="flex items-center gap-3 text-[13px]"><span>최대</span><input type="range" min="3" max="15" value="8" class="flex-1 accent-blue-600"><span class="tabular-nums">8개</span></div>
    <button onclick="$('#sheet').remove()" class="mt-5 w-full rounded-lg bg-blue-600 text-white py-2.5 text-[14px] font-medium">모으기 시작 <span class="opacity-70 text-[12px]">약 10~20분 · 끝나면 알림</span></button></div></div>`;
}

function mobileNav(){
  const t = [['home','글','pen'],['sources','원문','book'],['rules','기준','ruler'],['confirmed','확정본','check']];
  return `<nav class="md:hidden fixed bottom-0 inset-x-0 z-30 border-t border-zinc-200 dark:border-zinc-800 bg-white/90 dark:bg-zinc-950/90 backdrop-blur pb-[env(safe-area-inset-bottom)]">
    <div class="grid grid-cols-5">${t.map(([k,l,i])=>`<button onclick="go('${k}')" class="py-2 flex flex-col items-center gap-0.5 text-[11px] ${state.page===k?'text-blue-600':'text-zinc-500'}">${ic(i,'w-5 h-5')}${l}</button>`).join('')}
    <button onclick="toggleDrawer()" class="py-2 flex flex-col items-center gap-0.5 text-[11px] text-zinc-500">${ic('bot','w-5 h-5')}진행자</button></div></nav>`;
}

function render(){
  const pages = {home, ws, sources, rules, confirmed};
  $('#app').innerHTML = sidebar() + `<main class="flex-1 min-w-0 h-full overflow-y-auto overflow-x-hidden pb-20 md:pb-0">${(pages[state.page]||home)()}</main>` + drawer() + mobileNav();
}
function go(p, step){ state.page = p; if (step) state.step = step; state.running=false; location.hash = p; render(); }
function setStep(n){ state.step = n; state.running=false; render(); }
function setVer(v){ state.ver = v; if (state.cmp===v) state.cmp = Object.keys(D.ws.versions).find(x=>x!==v); render(); }
function setSrc(v){ state.srcFilter = v; render(); }
function toggleDrawer(){ state.drawer = !state.drawer; render(); }
function sheet(){ document.body.insertAdjacentHTML('beforeend', sheetHTML()); }
function theme(){ document.documentElement.classList.toggle('dark'); render(); }
function noop(){}
function runWrite(){ state.step = 3; state.running = true; state.runIdx = 0; render();
  const tick = () => { state.runIdx++; if (state.runIdx >= STAGES.length) { state.running=false; state.ver='최종'; state.cmp='재작성(astra)'; } render(); if (state.running) setTimeout(tick, 1600); };
  setTimeout(tick, 1600); }
if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.classList.add('dark');
const Q = new URLSearchParams(location.search);
if (Q.get('step')) state.step = +Q.get('step'); if (Q.has('drawer')) state.drawer = true;
if (Q.has('dark')) document.documentElement.classList.add('dark'); if (Q.has('light')) document.documentElement.classList.remove('dark');
window.addEventListener('hashchange', ()=>{ const p = location.hash.slice(1); if (p && p!==state.page){ state.page=p; render(); } });
render();
</script></body></html>
