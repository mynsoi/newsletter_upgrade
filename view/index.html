 결론은 뜻밖입니다. 생각보다 고되고 부담은 갈수록 무거워지는데, 그 부담이 한쪽으로 몰릴 수밖에 없는 구조라는 겁니다. 대기업에서 AI 도입을 맡은 실무자와 이야기해 보니 그쪽도 비슷한 문제를 겪고 있었다고 하고요.\n\n여러분은 어떠신가요? AI로 초안을 쓰고 자료를 정리하기 시작한 뒤로 퇴근 시간이 빨라지셨나요?\n\n자, 이 강사의 이야기에서 무엇을 읽어야 할까요? AI가 일을 빠르게 해 주는 건 분명합니다. 강사의 체감으로는 AI를 잘 쓰는 사람이 서너 사람 몫을 해내는 사례가 흔하다고 하니까요. 문제는 빨라진 속도가 곧바로 여유나 성과로 바뀌지 않는다는 데 있습니다. 강사가 AI 기업 앤트로픽의 글을 소개하며 던지는 물음도 바로 이것입니다. 글이나 코드를 만드는 속도가 올라갔다고 해서 그만큼 조직과 개인의 생산성이 오른 것이냐는 거죠. 오히려 일이 빨라지면 기대치가 따라 올라가고, 잘하는 사람 앞으로 일이 쌓입니다.\n\n현장의 모습이 그렇습니다. 사내에서 'AI 선도자'로 뽑힌 사람들이 갈수록 높아지는 기대를 감당하다 지쳐 버리고, 끝내 회사를 떠나는 일도 적지 않다고 합니다. 위에서 내려오는 압박도 있습니다. 결과에 책임을 지는 임원이 자기가 AI로 뽑아 본 결과물을 내밀며 왜 이만큼 못 해 오느냐고 묻는 경우도 있다고 하죠. 누군가 AI로 만든 결과물이 곧장 모두의 기준이 되어 버리는 겁니다.\n\nAI가 일을 대신해 준 만큼 사람은 편해져야 하지 않을까요? 바로 여기에 함정이 있습니다. AI는 정답을 내놓는 기계가 아닙니다. 같은 질문에도 매번 조금씩 다른 답을 내고, 사람은 그럴듯해 보이는 답을 쉽게 믿어 버리죠. 그러니 누군가는 반드시 확인해야 합니다. 직접 쓰던 수고가 빠진 자리를 결과물을 하나하나 검증하는 수고가 채운 셈입니다. 일의 무게는 사라지지 않았고 자리만 옮겨 갔을 뿐입니다. 강사는 이런 확인 작업이 쌓이면 결국 사람이 소진된다고 말합니다. 머릿속 연료를 뜻하는 '바이오토큰'이 바닥났다는 농담까지 나온다니, 이제 일이 막히는 곳은 사람 쪽입니다.\n\n일이 잘 쓰는 사람에게 몰리는 데도 까닭이 있습니다. 같은 팀 안에서도 누구는 AI로 몇 사람 몫을 해내고, 누구는 원하는 답 하나 얻기도 버겁습니다. 서로 얼마나 빨리 일하는지 모르는 채로 일을 나누면 급한 일은 자연히 빠른 사람에게 갑니다. 빨리 끝낸 사람이 받는 보상은 대개 다음 일입니다.\n\n그렇다고 AI로 시간을 벌 수 없다는 말은 아닙니다. 작은 마케팅 회사를 운영하는 한 대표가 링크드인에 올린 글을 보죠. 이 대표가 올해 AI로 한 일 가운데 가장 쓸모 있었던 건 글쓰기와 상관이 없었습니다. 콘텐츠를 쓰는 일은 여전히 몇 시간씩 붙들고 있어야 한다는군요. 대신 매주 꽤 많은 시간을 잡아먹던 자잘한 반복 업무를 AI에 맡겼습니다. 세 군데 메일함으로 들어오는 문의를 읽고 분류하고 요약해 답장 초안까지 써 두는 일, 새로 달린 구글 리뷰에 답글 초안을 만드는 일, 기록해 둔 작업 시간을 청구서 초안으로 바꾸는 일 같은 것들입니다. 리뷰 답글은 대표가 문구를 승인하기 전에는 게시되지 않습니다. 이렇게 갖춰 두는 데도 시간이 좀 들었다고 합니다.\n\n이 대표는 삶이 통째로 바뀌진 않았다고 솔직하게 털어놓습니다. 해변에 앉아 하루 두 시간만 일하는 처지는 아니라면서요. 다만 돌려받은 시간을 사업의 다른 영역에 쓸 수 있게 됐다고 합니다.\n\n강사가 수업에서 권하는 길도 이와 닮았습니다. 자동화를 무작정 늘리기보다 어디까지 AI에 맡길 수 있는지 먼저 따져 보고, 최소한의 자동화로 효과가 가장 잘 나는 곳부터 찾자는 겁니다.\n\n그렇다면 이 대표와 사내 AI 선도자들은 무엇이 달랐을까요? 둘 다 AI 덕에 일이 빨라졌다는 점은 같습니다. 차이는 아낀 시간이 어디로 갔느냐입니다. 이 대표의 시간은 사업의 다른 일로 갔습니다. 높아지는 기대에 지쳐 간 선도자들의 시간은 그 기대가 고스란히 가져간 셈이고요. 물론 대표는 자기 시간의 주인이 자기 자신입니다. 조직에 속한 우리는 사정이 다르죠.\n\n퇴근을 늦추는 것은 AI가 아닙니다. 아낀 시간의 쓰임을 정하지 않은 채 다음 일을 받아 드는 습관이 퇴근을 늦춥니다. 주인이 정해지지 않은 빈 시간은 가장 먼저 들어온 요청이 차지하기 마련이니까요. 그 빈 시간을 노리는 손이 많은 조직에서는 더욱 그렇습니다. 그래서 아낀 시간을 어디에 쓸지는 일을 시작하기 전에, 그리고 팀이 함께 정해 두어야 합니다.\n\nAI에 일을 맡기기 전에 한 가지만 먼저 적어 보세요. 이걸로 아낀 시간을 어디에 쓸 것인가. 미뤄 둔 고민이어도 좋고 동료의 결과물을 함께 살피는 일이어도 좋습니다. 제시간에 퇴근하는 것도 물론 훌륭한 답입니다. 그리고 AI가 낸 결과를 확인하는 시간도 엄연히 일로 셈해야 합니다.\n\n리더라면 한 가지를 더 해 주시기 바랍니다. AI를 잘 쓰는 팀원에게 일을 하나 더 얹기 전에, 그 사람이 아낀 시간이 지금 어디로 가고 있는지 먼저 물어보세요. 팀원마다 AI로 일하는 속도가 다르다면 일을 나누는 방식도 다시 이야기해야 합니다. 빨리 끝낸 사람에게 돌아가는 것이 다음 일뿐이라면, AI를 가장 잘 쓰는 사람부터 지쳐 떠날 테니까요.\n\nAI가 돌려준 시간에는 이름표가 붙어 있지 않습니다. 이름표를 붙이는 건 우리 몫입니다.", "m": {"대비": 3, "나열": 0, "선언": 0, "번역투": 0, "분량": 2073}}, {"key": "A-im-not-ai", "group": "A", "label": "1단계 · im-not-ai", "desc": "처음부터 쓰고 im-not-ai humanize-korean로 다듬음", "title": "왜 AI를 쓰는데 더 퇴근 시간이 빨라지지 않을까요?", "body": "직원이 원하기만 하면 AI 사용료를 회사가 전부 대 주는 곳이 있습니다. 도구도 마음대로 골라 쓸 수 있고 2주에 한 번은 외부 강사가 와서 AI 교육을 하죠. AI를 익히기에 이만한 환경도 드물 겁니다. 이 회사에 강의를 다니는 강사가 올해 3월 Threads에 현장 이야기를 18편에 걸쳐 풀어놓았는데요, 내용은 기대와 조금 달랐습니다. 강사가 보기에 AI를 잘 다루는 사람이 서너 사람 몫을 해낸다고 느껴지는 경우는 흔하다고 합니다. 그런데 그만큼 사람의 한계도 더 빨리 드러난다는 겁니다.\n\n강사가 현장 실무자들과 나눈 이야기도 비슷합니다. 사내 'AI 프론티어'로 뽑힌 뒤 업무 기대치가 계속 올라가 번아웃을 겪거나 아예 회사를 떠난 사람이 적지 않다고 하죠. 강사가 경력직 이직을 도왔던 한 사람도 일이 너무 많고 기대치가 높다는 하소연을 자주 했다고 합니다. 그만둬도 되겠느냐는 물음에 강사는 우선 버텨 내라고 답했고요.\n\n자, AI는 일을 덜어 주는 도구라는데 왜 잘 쓰는 사람이 먼저 지칠까요? 강사가 인용한 앤트로픽의 글에 실마리가 있습니다. 일하는 속도가 빨라진 것이 정말로 조직과 개인의 생산성이 오른 것과 같으냐는 질문이죠. 속도는 분명히 빨라졌습니다. 문제는 그렇게 생긴 여유가 어디로 새어 나가느냐입니다. 강사의 이야기에서 세 갈래를 읽을 수 있습니다.\n\n첫째, 빨라진 속도가 곧 새 기준이 됩니다. 일을 빨리 끝낸 사람에게는 다음 일이 오기 마련입니다. 강사는 임원이 직접 AI로 뽑아 본 결과물을 내밀며 왜 이만큼 해 오지 못하느냐고 묻는 경우도 있다고 전합니다. AI가 기대치를 끌어올리는 셈이죠.\n\n둘째, 확인하는 수고는 줄지 않습니다. AI는 정답을 찍어 내는 기계가 아닙니다. 같은 질문에도 답이 그때그때 달라지죠. 그런데 그럴듯한 답을 받으면 사람은 기계를 믿고 넘어가고 싶어집니다. 이른바 '자동화 편향'입니다. 그러니 직접 만들던 수고가 사라진 자리에 AI의 결과를 의심하고 검증하는 수고가 들어섭니다. 일이 줄었다기보다 다른 종류의 일로 갈아탄 셈이죠. 강사는 이 부담이 쌓이면 번아웃으로 이어진다고 말합니다. 머릿속 연료라는 뜻의 '바이오토큰'이 바닥났다는 농담이 요즘 오가는 것도 그래서일 겁니다.\n\n셋째, 잘 쓰는 요령은 남에게 쉽게 넘어가지 않습니다. 한 직무를 3~5년쯤 하면 말이나 글로 다 옮기기 어려운 나만의 감각이 생깁니다. 이것을 '암묵지'라고 부릅니다. AI를 다루는 요령도 마찬가지입니다. 일을 고르게 나누면 될 것 같지만 그 감각이 정리돼 있지 않으니 결국 '할 줄 아는 사람'에게 일이 돌아갑니다. 강사가 교육에서 만난 사람들도 자기 암묵지를 제대로 정리하지 못한 경우가 많았다고 합니다. 당연한 일입니다. 지금 일만으로도 바쁜데 노하우를 정리할 짬이 어디 있겠습니까. 여기에 AI로 일하는 흐름을 새로 짜는 일까지 얹히면 부담은 오히려 커집니다.\n\n그렇다면 아낀 시간을 온전히 돌려받는 사람은 없을까요? 작은 마케팅 회사를 운영하는 한 대표가 LinkedIn에 올린 글이 참고가 됩니다. 이 대표는 매주 조금씩 시간을 갉아먹던 잔일들을 AI에 넘겼습니다. 메일함 세 곳에 쌓이는 문의를 나누고 요약해 답장 초안을 써 두게 했고 업무 시간 기록은 청구서 초안으로 옮겨지게 했죠. 고객 리뷰 답글도 AI가 초안을 잡지만 이 대표가 문구를 확인해 허락하기 전에는 한 줄도 공개되지 않습니다. 정작 콘텐츠를 쓰는 일은 아직 손이 많이 가서 고객 업무와 함께 감당할 수 있게 줄일 방법을 찾는 중이라고 하고요. 처음에 이 체계를 갖추느라 품이 들었고 생활이 극적으로 달라지지도 않았답니다. 그래도 되찾은 시간을 회사의 다른 일에 돌리고 있다고 합니다.\n\n이 사례에서는 자동화 목록보다 눈여겨볼 것이 있습니다. 이 대표는 AI가 만든 초안을 그대로 내보내지 않고 마지막 확인을 자기 몫으로 남겨 두었습니다. 시간이 생기면 어디에 써야 할지도 알고 있었던 셈이죠. 콘텐츠 쓰는 시간과 고객 일 사이에서 균형을 잡고 싶다고 했으니까요.\n\n여기서 제 생각을 분명히 말씀드리겠습니다. AI가 아껴 준 시간은 저절로 내 것이 되지 않습니다. 쓸 곳을 정해 두지 않은 시간은 오래 비어 있지 않거든요. 다음 요청과 더 높아진 기대, 검증해야 할 AI의 결과물이 그 자리를 금세 채웁니다. AI를 잘 쓰는 사람일수록 이 일은 더 빨리 일어나고요. 퇴근 시간이 그대로인 이유는 AI가 부족해서가 아닙니다. 아낀 시간을 어디에 쓸지 먼저 정하지 않았기 때문입니다.\n\n강사가 권하는 순서도 같은 방향을 가리킵니다. 덮어놓고 자동화부터 하기보다 AI에게 어느 선까지 맡길 수 있는지부터 가려 보자는 겁니다. 자동화는 최소한으로 하되 가장 잘 되는 곳부터 찾고, 맡겨도 위험이 낮다고 판단된 일에 사람이 중간에 확인하는 장치를 여러 겹 둔 뒤 적어도 2~3주는 다듬어 안정시키라고 하죠. 그것도 1년 이상 쓸 일부터요.\n\n리더라면 한 가지를 더 생각해야 합니다. AI로 일을 일찍 끝낸 사람에게 일을 더 얹는 것은 가장 쉬운 선택입니다. 하지만 그러면 잘 쓰는 사람만 지치고 팀 안의 속도 차이는 더 벌어집니다. 강사의 지적처럼, 동료가 어떤 속도로 일하는지도 모르면서 팀의 박자를 맞출 수는 없습니다. 아낀 시간의 쓰임새는 개인이 혼자 정할 일이 아니라 팀이 함께 정할 일입니다.\n\n앞으로 AI 덕분에 일을 일찍 끝냈다면, 다음 일을 받아 들기 전에 이렇게 물어보세요. '이렇게 아낀 시간을 나는 어디에 쓸 것인가?' 답을 정해 둔 사람만 그 시간을 지킬 수 있습니다. 답이 없다면 그 시간은 이미 다음 요청의 몫입니다. (끝)", "m": {"대비": 4, "나열": 3, "선언": 1, "번역투": 0, "분량": 2031}}, {"key": "A-avoid-ai-writing", "group": "A", "label": "1단계 · avoid-ai-writing", "desc": "처음부터 쓰고 avoid-ai-writing (영어 기준 스킬)로 다듬음", "title": "왜 AI를 쓰는데 더 퇴근 시간이 빨라지지 않을까요?", "body": "기업에서 AI 교육을 하는 한 강사가 2주에 한 번씩 고정으로 강의를 나가는 회사가 있습니다. 이 회사 대표들은 직원이 원하기만 하면 AI 이용료를 전부 대 줍니다. 써 보고 싶은 도구가 있으면 결제해서 마음껏 써 볼 수 있죠. 이런 교육 현장이 워낙 드물어서 강사는 강의료를 깎고서라도 이 회사에 간답니다.\n\n강사는 요즘 AI를 잘 쓰 세요. 결과물은 반드시 사람이 확인하고 승인해야 합니다. 다른 하나는 그렇게 아낀 시간을 어디에 쓸지입니다. 미뤄 둔 고민이든, 현장을 한 번 더 살피는 일이든, 이른 퇴근이든 좋습니다. 정했다면 팀장과도 이야기해 두세요. 팀을 이끄는 분이라면, AI로 손이 빨라진 팀원이 있을 때 일을 더 얹기 전에 그렇게 생긴 시간을 어디에 쓸지부터 함께 정해 주시기 바랍니다.\n\nAI를 쓴다고 퇴근이 저절로 빨라지지는 않습니다. 아낀 시간을 어디에 쓸지 미리 정해 둔 사람이 결국 일찍 퇴근합니다.", "m": {"대비": 4, "나열": 3, "선언": 0, "번역투": 0, "분량": 1786}}], "groups": [["draft", "공통 초안"], ["A", "1단계 · 처음부터 쓰기 (워크트리별 스킬)"], ["B", "2단계 · 같은 초안 다듬기 (스킬 효과만)"], ["R", "재작성 · \"영어로 쓰면 좋은데 한국어로 쓰니 이상한 글\" 고치기"]]};

  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
