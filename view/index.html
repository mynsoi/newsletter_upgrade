const DATA = {"items": [{"key": "SIM-C-log", "group": "SIM", "label": "C · Claude가 진행 · 진행 기록", "desc": "시나리오: 제목 후보(틀린 경로 주입) → 3번 제목으로 글 쓰기 → 피드백 파일 반영 → 질문 → 경영일기 '팀플레이어' 글 가져오기", "title": "C · Claude가 진행 — 진행 기록", "body": "총 658초 · 사람 개입 1회 · 진행 비용 $3.26\n\n개입: 1단계: Claude가 경로 오류를 보고 → 사람이 '04.md가 맞다, 고쳐서 진행해'라고 답함\n\n[턴 1] 48초 · $0.18 — 요청: 새 글을 시작합니다. 설정 파일은 briefs/sim-C.json입니다. 먼저 제목 후보를 뽑아 주세요.\n\n  · 실행: cat briefs/sim-C.json && ls briefs/\n\n  · 실행: ls -la originals/linkedin/4.md excerpts/threads05-5to9.md 2>&1; ls originals/ originals/linkedin excerpts 2>&1 | head -50; cat briefs/t2-C.json\n\n  · 실행: ls; grep -n \"sources\\|ROOT\\|BASE\\|Path(\" scripts/column_pipeline.py | head -60\n\n  · 실행: ls -la sources/originals/linkedin/4.md sources/originals/linkedin/04.md sources/excerpts/threads05-5to9.md 2>&1; ls sources/originals/linkedin/ sources/excerpts\n\n  · 실행: sed -n 28,70p scripts/column_pipeline.py; sed -n 110,130p scripts/column_pipeline.py; grep -n \"def prompt_first\" -A25 scripts/title_candidates.py\n\n  · 답: 제목 후보는 뽑지 못했습니다. 설정 파일에 틀린 경로가 있어서 명령을 실행하지 않고 먼저 알려 드립니다.  **문제:** `briefs/sim-C.json`의 첫 번째 원문(중심 재료) 경로 `originals/linkedin/4.md`에 해당하는 파일이 없습니다. 스크립트는 `sources/` 아래에서 경로를 찾는데, 실제 파일 이름은 `sources/originals/linkedin/04.md`입니다. 앞에 0이 빠졌습니다. 이대로 실행하면 제목 후보를 만드는 단계에서 파일을 찾지 못해 멈춥니다. - 두 번째 원문 `excerpts/threads05-5to9.md`는 제대로 있습니다.  **고칠 방법:** `briefs/sim-C.json`에서 `\"originals/linkedin/4.md\"`를 `\"originals/linkedin/04.md\"`로 바꾸면 됩니다. 참고로 `briefs/sim-N.json`에는 같은 수정이 이미 들어가 있습니다(아직 커밋하지 않은 상태).  고치시면 바로 제목 후보를 다시 뽑겠습니다. 제가 고치기를 원하시면 말씀해 주세요.\n\n[턴 2] 74초 · $0.26 — 요청: 원문 경로는 originals/linkedin/04.md가 맞습니다. 고쳐서 진행해 주세요.\n\n  · 실행: sed -i 's#\"originals/linkedin/4.md\"#\"originals/linkedin/04.md\"#' briefs/sim-C.json && git diff briefs/sim-C.json\n\n  · 실행: python3 -I scripts/column_pipeline.py --titles briefs/sim-C.json 2>&1 | tail -30\n\n  · 실행: ls runs/titles0/sim-C/ && cat runs/titles0/sim-C/astra.md\n\n  · 답: `briefs/sim-C.json`의 원문 경로를 `originals/linkedin/04.md`로 고친 뒤 astra로 제목 후보 8개를 뽑았습니다. 오류나 빈 결과는 없었습니다.  1. AI를 잘 쓰게 된 걸까요, 일을 잘하게 된 걸까요? 2. 만들 수 있다고 다 만들지는 마세요 3. AI가 만든 결과물에 ‘아니오’라고 할 수 있나요? 4. 할 수 있는 일이 늘수록 내 기준이 중요해집니다 5. AI로 일은 빨라졌는데, 판단도 쉬워졌나요? 6. 오래 쌓은 업무 감각이 AI를 만났을 때 7. ‘이 정도면 됐다’는 내가 정해야 합니다 8. AI 도구를 익히느라 내 일을 놓치고 있지는 않나요?  결과 파일은 `runs/titles0/sim-C/astra.md`입니다. 쓸 제목의 번호를 알려 주시거나 제목을 직접 주시면 그 제목으로 정하겠습니다. 경로 수정은 아직 커밋하지 않았습니다.\n\n[턴 3] 286초 · $0.38 — 요청: 3번 제목으로 정하고 글을 써 주세요.\n\n  · 실행: python3 -I scripts/column_pipeline.py --set-title briefs/sim-C.json 3 2>&1 | tail -20; git diff briefs/sim-C.json\n\n  · 실행: python3 -I scripts/column_pipeline.py briefs/sim-C.json > runs/sim/C.write.out 2>&1; echo \"exit=$?\" >> runs/sim/C.write.out (백그라운드)\n\n  · 실행: cat runs/sim/C.write.out; ls -la runs/columns/sim-C* 2>&1 | head; ls -t runs/columns | head\n\n  · 실행: head -5 runs/columns/sim-C/final.md; wc -m runs/columns/sim-C/final.md\n\n  · 답: 글 쓰기 세 단계(초안 → astra 재작성 → astra 기준 반영)가 모두 오류 없이 끝났습니다. 빈 결과도 없었습니다.  - **제목:** AI가 만든 결과물에 ‘아니오’라고 할 수 있나요? - **최종본:** `runs/columns/sim-C/final.md` (약 2,300자) - 중간 결과는 `runs/columns/sim-C/draft.md`(초안)와 `r4.md`(재작성)에 있습니다. 실행 기록은 `runs/sim/C.write.out`에 남겼습니다.  본문은 확인해 보시고, 피드백이 있으면 파일로 저장한 뒤 경로를 알려 주세요. 그 파일로 수정 반영을 돌리겠습니다. `briefs/sim-C.json`의 경로 수정과 제목 지정은 아직 커밋하지 않았습니다.\n\n[턴 4] 67초 · $0.45 — 요청: 멘토 피드백을 runs/sim/C-feedback-1.txt에 저장해 두었습니다. 반영해 주세요.\n\n  · 실행: ls -la runs/sim/\n\n  · 실행: cp runs/columns/sim-C/final.md /tmp/claude-1000/sim-C-final.before.md 2>/dev/null; python3 -I scripts/column_pipeline.py --revise briefs/sim-C.json runs/sim/C-f\n\n  · 실행: ls -la runs/columns/sim-C/ && head -1 runs/columns/sim-C/final-r1.md && cmp -s /tmp/claude-1000/sim-C-final.before.md runs/columns/sim-C/final.md && echo \"final\n\n  · 답: `runs/sim/C-feedback-1.txt`의 피드백을 astra로 반영했습니다. 피드백 파일은 경로만 넘겼고, 실행은 오류 없이 끝났습니다(48초).  - **수정본:** `runs/columns/sim-C/final-r1.md` (1,926자, 원래 약 2,300자). 제목은 「AI가 만든 결과물에 ‘아니오’라고 할 수 있나요?」 그대로입니다. - 수정 전 `final.md`는 바뀌지 않고 그대 AI가 만든 결과물, 무엇을 버리시겠습니까?", "body": "AI 시대의 디자이너는 한 분야를 깊게 파는 전문가여야 할까요, 아니면 여러 일을 두루 해내는 사람이어야 할까요? 프로덕트 디자이너는 서비스의 화면을 만들고, 사용자가 겪는 문제를 해결하며, 복잡한 서비스를 알기 쉽게 정리하는 사람인데요, AI로 할 수 있는 일이 늘어나면서 자신의 역할도 다시 생각하게 됩니다.\n\n주니어일 때는 답이 비교적 분명합니다. 잘하는 것을 더 깊게 파면 되니까요. 디자이너가 해야 할 일들을 제대로 익히는 데만도 오랜 시간과 경험이 필요하죠. 하지만 시니어가 되면 디자인을 잘하는 것만으로는 충분하지 않습니다. 사업이 어떻게 굴러가는지 알아야 하고, 데이터를 읽어야 하며, 개발자와 구현 범위를 협의해야 합니다. 브랜드와 콘텐츠까지 고민해야 하는 일도 늘어나고 말입니다.\n\n직접 사업을 시작하고 AI를 본격적으로 활용하면서 할 수 있는 일의 범위가 크게 넓어진 사례도 있습니다. 예전에는 “이건 개발자의 도움이 있어야 하겠는데”라며 접어 두었던 아이디어를 혼자서 만들어 볼 수 있게 된 것이죠. 자료 조사부터 구조 설계, 글과 이미지, 코드까지 직접 손을 대서 실제로 작동하는 결과물을 내놓게 됐습니다. 이런 변화를 보면 처음에는 디자이너라는 직업도 결국 여러 일을 두루 하는 방향으로 바뀌겠다고 생각하기 쉽습니다.\n\n그런데 AI를 쓰면서 할 수 있는 일이 많아질수록 “나는 무엇에 강한가?”라는 질문은 오히려 더 중요해집니다. 왜 그럴까요? AI와 함께라면 무엇이든 얼마든지 만들어 낼 수 있지만, 무엇을 만들어야 하는지까지 정해지는 것은 아니기 때문입니다. 방금 나온 결과물이 쓸 만한지, 어디서 멈춰야 하는지, 무엇을 덜어내야 하는지는 여전히 사람이 판단해야 하죠.\n\n제가 주목한 대목은 바로 그다음입니다. 중요한 것은 코딩을 할 수 있게 됐다는 사실 자체가 아닙니다. 디자이너로 일하며 오랫동안 다져 온 안목과 판단력을 화면 안에 가둬 두지 않고, 실제로 작동하는 결과물까지 이어 갈 수 있게 됐다는 점이 더 큰 변화입니다. AI가 자신을 다른 사람으로 바꾼 것이 아니라, 늘 해 오던 일을 더 멀리 펼칠 수 있게 해줬다는 말이죠. 그러니 전문가가 될 것인지, 여러 일을 두루 하는 사람이 될 것인지는 양자택일의 문제가 아닙니다. 분명하게 잘하는 한 가지를 깊게 다지면서 AI로 그 강점을 낯선 영역에까지 펼치는 사람이 앞서 나갈 것입니다.\n\n여기서 한 가지를 분명히 짚고 싶습니다. AI를 잘 쓰게 됐다는 것과 실력이 늘었다는 것은 같은 말이 아닙니다. 혹시 여러분도 도구를 능숙하게 다루게 되면 일하는 실력도 그만큼 늘었다고 여기지는 않나요? 앞선 사례에서 중요했던 것은 코드 자체가 아니었습니다. 그 코드로 무엇을 만들고 무엇을 덜어낼지 가려내는 기준이었죠. 오랫동안 자신의 일을 해오며 다져 온 기준 말입니다.\n\n일하는 속도와 성과를 놓고도 비슷한 질문을 던져 볼 수 있습니다. 일하는 속도가 빨라졌다고 해서 개인과 조직의 성과도 늘었다고 말할 수 있을까요? AI를 써 봤지만 효과가 분명하지 않았던 분이라면 고개가 끄덕여질 질문일 겁니다.\n\n앤트로픽이 낸 글은 이른바 ‘인지적 오프로딩’의 딜레마를 다룹니다. 어떤 일을 AI에 맡길수록 사람이 그 일을 해내는 능력을 유지하거나 키우기는 어려워진다는 것인데요, AI 없이 직접 자료 조사를 하려면 열두 시간 넘게 매달려야 할 것 같고, 끝까지 해낼 자신도 없다는 고백도 있습니다. 도구를 다루는 솜씨는 늘었는데, 정작 도구 없이 일을 해내는 힘은 줄어들 수 있다는 말입니다.\n\n그렇다면 AI에 넘겨주지 말아야 할 실력은 무엇일까요? 같은 일을 3~5년쯤 하다 보면 그 사람만의 감각이 생깁니다. 분명히 알고는 있지만 설명하려고 하면 말로 잘 나오지 않는 감각, 흔히 ‘암묵지’라고 부르는 것이죠. 저는 무엇을 버려야 할지 가려내는 기준이 바로 여기서 나온다고 봅니다. “이 문단은 우리 팀의 사정과 맞지 않는다”, “이 표현은 그럴듯하지만 실제와는 다르다”, “이 대목은 빼는 편이 낫다.” AI가 내놓은 초안을 보며 여러분이 내리는 이런 판단이 곧 여러분의 실력입니다.\n\n문제는 이런 기준이 대개 머릿속에만 들어 있다는 점입니다. 기업의 AI 교육 현장에서도 자신의 노하우를 제대로 정리해 둔 사람은 드물다고 합니다. 눈앞의 일을 처리하기에도 바쁜데, 그럴 여유가 어디 있겠냐는 것이죠.\n\n그렇다면 어떻게 해야 할까요? 거창하게 노하우를 정리하려고 하기보다는 작은 습관 하나부터 시작하기 바랍니다. 다음에 AI가 결과물을 내놓으면 그대로 사용하기 전에 무엇을 버릴지 먼저 정해 보세요. 그리고 버린 이유를 한 줄씩 적어 두는 겁니다. 그 한 줄이 쌓이면 말로 설명하기 어려웠던 여러분의 판단 기준이 조금씩 글로 드러날 것입니다.\n\n앞으로 사람 사이의 차이는 얼마나 많은 AI 도구를 다루느냐에서 벌어지지 않을 겁니다. 무엇을 버릴지 가려내는 자기 기준이 얼마나 굳건한지, 그리고 그 기준을 실제 결과물까지 얼마나 멀리 이어 갈 수 있는지에서 벌어지겠죠. AI가 만들어 주는 것이 많아질수록 여러분은 무엇을 남길지 판단할 수 있어야 합니다. AI가 만든 결과물 앞에서, 여러분은 무엇을 버리시겠습니까?", "m": {"대비": 1, "나열": 0, "선언": 0, "번역투": 0, "분량": 1886}}, {"key": "SIM-N-final-r1.md", "group": "SIM", "label": "N · 고정 스크립트 · 피드백 반영", "desc": "같은 글쓰기 스크립트 — 글 차이는 우연(비교 대상 아님)", "title": "AI가 만든 결과물, 무엇을 버리시겠습니까?", "body": "AI 시대에는 한 분야를 깊게 파는 전문가여야 할까요, 아니면 여러 일을 두루 해내는 사람이어야 할까요? AI로 할 수 있는 일이 늘어나면서 자신의 역할도 다시 생각하게 됩니다.\n\n디자이너가 AI를 활용해 예전에는 개발자의 도움이 필요했던 아이디어를 혼자서 만들어 보는 사례도 있습니다. 자료 조사부터 구조 설계, 글과 이미지, 코드까지 직접 다루며 실제로 작동하는 결과물을 내놓는 것이죠. 이런 변화를 보면 결국 여러 일을 두루 하는 사람이 되어야겠다고 생각하기 쉽습니다.\n\n그런데 AI를 쓰면서 할 수 있는 일이 많아질수록 “나는 무엇에 강한가?”라는 질문은 오히려 더 중요해집니다. 왜 그럴까요? AI와 함께라면 무엇이든 얼마든지 만들어 낼 수 있지만, 무엇을 만들어야 하는지까지 정해지는 것은 아니기 때문입니다. 방금 나온 결과물이 쓸 만한지, 어디서 멈춰야 하는지, 무엇을 덜어내야 하는지는 여전히 사람이 판단해야 하죠.\n\n중요한 것은 코딩을 할 수 있게 됐다는 사실 자체가 아닙니다. 오랫동안 다져 온 안목과 판단력을 실제로 작동하는 결과물까지 이어 갈 수 있게 됐다는 점이 더 큰 변화입니다. 그러니 전문가가 될 것인지, 여러 일을 두루 하는 사람이 될 것인지는 양자택일의 문제가 아닙니다. 분명하게 잘하는 한 가지를 깊게 다지면서 AI로 그 강점을 낯선 영역에까지 펼치는 사람이 앞서 나갈 것입니다.\n\n여기서 한 가지를 분명히 짚고 싶습니다. AI를 잘 쓰게 됐다는 것과 실력이 늘었다는 것은 같은 말이 아닙니다. 혹시 여러분도 도구를 능숙하게 다루게 되면 일하는 실력도 그만큼 늘었다고 여기지는 않나요? 앞선 사례에서 중요했던 것은 코드 자체가 아니었습니다. 그 코드로 무엇을 만들고 무엇을 덜어낼지 가려내는 기준이었죠. 오랫동안 자신의 일을 해오며 다져 온 기준 말입니다.\n\n일하는 속도와 성과를 놓고도 비슷한 질문을 던져 볼 수 있습니다. 일하는 속도가 빨라졌다고 해서 개인과 조직의 성과도 늘었다고 말할 수 있을까요? AI를 써 봤지만 효과가 분명하지 않았던 분이라면 고개가 끄덕여질 질문일 겁니다.\n\n이른바 ‘인지적 오프로딩’에도 딜레마가 있습니다. 어떤 일을 AI에 맡길수록 사람이 그 일을 해내는 능력을 유지하거나 키우기는 어려워진다는 것인데요, AI 없이 직접 자료 조사를 하려면 열두 시간 넘게 매달려야 할 것 같고, 끝까지 해낼 자신도 없다는 고백도 있습니다. 도구를 다루는 솜씨는 늘었는데, 정작 도구 없이 일을 해내는 힘은 줄어들 수 있다는 말입니다.\n\n그렇다면 AI에 넘겨주지 말아야 할 실력은 무엇일까요? 같은 일을 3~5년쯤 하다 보면 그 사람만의 감각이 생깁니다. 분명히 알고는 있지만 설명하려고 하면 말로 잘 나오지 않는 감각, 흔히 ‘암묵지’라고 부르는 것이죠. 저는 무엇을 버려야 할지 가려내는 기준이 바로 여기서 나온다고 봅니다. “이 문단은 우리 팀의 사정과 맞지 않는다”, “이 표현은 그럴듯하지만 실제와는 다르다”, “이 대목은 빼는 편이 낫다.” AI가 내놓은 초안을 보며 여러분이 내리는 이런 판단이 곧 여러분의 실력입니다.\n\n문제는 이런 기준이 대개 머릿속에만 들어 있다는 점입니다. 기업의 AI 교육 현장에서도 자신의 노하우를 제대로 정리해 둔 사람은 드물다고 합니다. 눈앞의 일을 처리하기에도 바쁜데, 그럴 여유가 어디 있겠냐는 것이죠.\n\n그렇다면 어떻게 해야 할까요? 거창하게 노하우를 정리하려고 하기보다는 작은 습관 하나부터 시작하기 바랍니다. 다음에 AI가 결과물을 내놓으면 그대로 사용하기 전에 무엇을 버릴지 먼저 정해 보세요. 그리고 버린 이유를 한 줄씩 적어 두는 겁니다. 그 한 줄이 쌓이면 말로 설명하기 어려웠던 여러분의 판단 기준이 조금씩 글로 드러날 것입니다.\n\n앞으로 사람 사이의 차이는 얼마나 많은 AI 도구를 다루느냐에서 벌어지지 않을 겁니다. 무엇을 버릴지 가려내는 자기 기준이 얼마나 굳건한지, 그리고 그 기준을 실제 결과물까지 얼마나 멀리 이어 갈 수 있는지에서 벌어지겠죠. AI가 만들어 주는 것이 많아질수록 여러분은 무엇을 남길지 판단할 수 있어야 합니다. AI가 만든 결과물 앞에서, 여러분은 무엇을 버리시겠습니까?", "m": {"대비": 0, "나열": 0, "선언": 0, "번역투": 0, "분량": 1516}}, {"key": "T0-sim-C", "group": "T0", "label": "제목 첫 단계 · sim-C", "desc": "한 줄: AI로 할 수 있는 일이 늘수록, 무엇을 만들고 무엇을 버릴지 판단하는 내 기준이 실력이 된다. AI를 잘 쓰게 됐다는 것과 실력이 늘었다는 것은 같은 말이 아니다. | 원문: LinkedIn, 프로덕트 디자인 디렉터, 2026-09-12 / Threads, 기업 AI 교육 강사, 2026-03-06 (18편 중 5~9편)", "title": "sim-C 제목 후보 (쓰기 전)", "body": "1. AI를 잘 쓰게 된 걸까요, 일을 잘하게 된 걸까요?\n\n2. 만들 수 있다고 다 만들지는 마세요\n\n3. AI가 만든 결과물에 ‘아니오’라고 할 수 있나요?\n\n4. 할 수 있는 일이 늘수록 내 기준이 중요해집니다\n\n5. AI로 일은 빨라졌는데, 판단도 쉬워졌나요?\n\n6. 오래 쌓은 업무 감각이 AI를 만났을 때\n\n7. ‘이 정도면 됐다’는 내가 정해야 합니다\n\n8. AI 도구를 익히느라 내 일을 놓치고 있지는 않나요?", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T0-sim-N", "group": "T0", "label": "제목 첫 단계 · sim-N", "desc": "한 줄: AI로 할 수 있는 일이 늘수록, 무엇을 만들고 무엇을 버릴지 판단하는 내 기준이 실력이 된다. AI를 잘 쓰게 됐다는 것과 실력이 늘었다는 것은 같은 말이 아니다. | 원문: LinkedIn, 프로덕트 디자인 디렉터, 2026-09-12 / Threads, 기업 AI 교육 강사, 2026-03-06 (18편 중 5~9편)", "title": "sim-N 제목 후보 (쓰기 전)", "body": "1. AI를 잘 쓰면 일도 잘하게 될까요?\n\n2. 만들 수 있다고 다 만들지는 마세요\n\n3. AI가 만든 결과물, 무엇을 버리시겠습니까?\n\n4. 할 수 있는 일이 늘수록 ‘내 기준’이 필요한 이유\n\n5. 이제 코딩도 할 수 있습니다. 실력도 늘었을까요?\n\n6. ‘이 정도면 됐다’를 판단하는 것도 실력입니다\n\n7. AI로 더 많은 일을 하려면 내가 잘하는 일부터 들여다보세요\n\n8. 결과물이 쌓이는 속도로 실력을 재지 마세요", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T0-t1-A", "group": "T0", "label": "제목 첫 단계 · t1-A", "desc": "한 줄: AI가 엉뚱한 답을 내놓는 건 AI가 모자라서라기보다 우리가 일할 때 쓰는 자료를 보여 주지 않았기 때문이다. 근거가 될 자료를 같이 주면 엉뚱한 답을 고치느라 쓰던 시간이 준다. | 원문: LinkedIn, AI 스타트업 AI 리드, 2026-10 / Threads, 세무사, 2026-10-02 (본문과 작성자 답글) / Threads, 노무사, 2026-02-07", "title": "t1-A 제목 후보 (쓰기 전)", "body": "1. AI가 아껴 준 시간을 답 고치는 데 쓰고 있나요?\n\n2. AI의 실력을 탓하기 전에 보여 줘야 할 것\n\n3. 우리 팀 AI에게도 업무 인수인계가 필요합니다\n\n4. 질문만 잘하면 AI가 일을 잘할까요?\n\n5. 내가 보는 업무 자료를 AI도 보고 있나요?\n\n6. 법령을 찾아보게 했더니 AI의 답이 달라졌습니다\n\n7. AI에게 정답을 재촉하기 전에 근거를 건네세요\n\n8. 자료를 챙기는 수고가 답을 고치는 수고를 줄입니다", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T0-t1-C", "group": "T0", "label": "제목 첫 단계 · t1-C", "desc": "한 줄: AI에게 '기억해 달라'고 부탁하기보다, 나중에 AI가 다시 찾아볼 수 있게 내 일의 기록을 쌓아 두는 사람이 AI 덕을 본다. | 원문: Threads, 업무 자동화를 공유하는 직장인, 2026-09-15 / LinkedIn, 마케팅 커뮤니케이션 매니저(비개발자), 2026-09", "title": "t1-C 제목 후보 (쓰기 전)", "body": "1. AI를 쓰는데 왜 자료는 여전히 내가 찾을까요?\n\n2. AI에게 '기억해줘'라고 말하기 전에\n\n3. 기록을 남기는 사람이 AI 덕을 보는 이유\n\n4. '그때 왜 그렇게 했죠?'라는 질문이 부담스럽다면\n\n5. 내 메모는 AI가 다시 찾을 수 있나요?\n\n6. 몇 달 전 업무까지 기억하려고 애쓰지 마세요\n\n7. 내 업무 기록을 AI의 참고서로 만드는 법\n\n8. AI에게도 업무 인수인계가 필요합니다", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T0-t2-A", "group": "T0", "label": "제목 첫 단계 · t2-A", "desc": "한 줄: AI로 할 수 있는 일이 늘수록, 무엇을 만들고 무엇을 버릴지 판단하는 내 기준이 실력이 된다. AI를 잘 쓰게 됐다는 것과 실력이 늘었다는 것은 같은 말이 아니다. | 원문: LinkedIn, 프로덕트 디자인 디렉터, 2026-09-12 / Threads, 기업 AI 교육 강사, 2026-03-06 (18편 중 5~9편)", "title": "t2-A 제목 후보 (쓰기 전)", "body": "1. AI를 잘 쓰면 실력도 늘어난 걸까요?\n\n2. '만들 수 있다'는 이유만으로 만들지 마세요\n\n3. AI가 만든 결과물, 무엇을 보고 합격점을 주나요?\n\n4. 더 빨리 만들게 됐는데 왜 더 바빠질까요?\n\n5. AI 도구를 늘리기 전에 내 기준부터 점검하세요\n\n6. 무엇을 버릴지 결정하는 것도 실력입니다\n\n7. 할 수 있는 일이 늘수록 잘하는 일이 중요해집니다\n\n8. AI로 개발까지 하는 디자이너에게 남는 전문성은?", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T0-t2-C", "group": "T0", "label": "제목 첫 단계 · t2-C", "desc": "한 줄: AI에 맡긴 일은 조금씩 내 손에서 빠져나간다. AI 없이는 못 하게 된 일이 생겼다면, 무엇을 맡기고 무엇을 내 손에 남길지 정해야 한다. | 원문: Threads, 기업 AI 교육 강사, 2026-03-06 (18편 중 5~9편) / LinkedIn, 프로덕트 디자인 디렉터, 2026-09-12", "title": "t2-C 제목 후보 (쓰기 전)", "body": "1. AI 없이는 못 하는 일이 생겼나요?\n\n2. AI에 맡길 일보다 내 손에 남길 일부터 정하세요\n\n3. '할 수 있는 일'이 늘었다고 실력도 늘었을까요?\n\n4. AI에 맡긴 뒤 내 손에서 멀어진 일들\n\n5. 잘하던 일까지 모두 AI에 넘기지는 마세요\n\n6. 결과는 AI가 내도 기준은 내가 세워야 합니다\n\n7. AI로 업무 범위가 넓어질수록 전문성이 필요한 이유\n\n8. 우리 팀이 직접 할 줄 알아야 하는 일은 무엇인가요?", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T0-t3-A", "group": "T0", "label": "제목 첫 단계 · t3-A", "desc": "한 줄: AI 도구를 늘린다고 일이 줄지는 않는다. 일의 재료(데이터·기록·맥락)를 먼저 모아 두어야 도구가 일할 곳이 생긴다. | 원문: LinkedIn, AI 스타트업 AI 리드, 2026-10 / Threads, 중소 사업체 운영자, 2026-05-05", "title": "t3-A 제목 후보 (쓰기 전)", "body": "1. AI 도구는 늘었는데, 왜 일은 줄지 않을까요?\n\n2. 자동화를 서두르기 전에 업무 기록부터 모으세요\n\n3. 우리 회사 AI는 매일이 입사 첫날입니다\n\n4. AI에게 일은 줬는데, 재료도 주셨나요?\n\n5. ‘왜 그렇게 결정했는지’도 AI의 일할 재료입니다\n\n6. AI에게도 우리 회사의 지도가 필요합니다\n\n7. 데이터를 잔뜩 넣으면 AI가 일을 잘할까요?\n\n8. AI 활용에도 일의 순서가 있습니다", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T0-t3-C", "group": "T0", "label": "제목 첫 단계 · t3-C", "desc": "한 줄: 자동화를 몇 개 만들었는지보다, 팀원이 하루에 열어야 하는 창과 도구가 줄었는지를 봐야 한다. 도구가 늘면 그 도구를 오가는 일도 같이 는다. | 원문: LinkedIn, AI 스타트업 AI 리드, 2026-10 / Threads, 중소 사업체 운영자, 2026-05-05", "title": "t3-C 제목 후보 (쓰기 전)", "body": "1. 자동화는 늘었는데, 왜 일은 여전히 번거로울까요?\n\n2. 새 AI 도구를 만들기 전에 직원의 화면부터 보세요\n\n3. 도구를 오가는 것도 일입니다\n\n4. 우리 팀은 하루에 몇 개의 창을 열까요?\n\n5. 자동화의 성과를 '개수'로 세지 마세요\n\n6. 편리한 도구를 모으면 업무도 편리해질까요?\n\n7. 봇 열 개보다 반가운 '창 하나 덜 열기'\n\n8. 좋은 자동화에는 '동선 정리'가 필요합니다", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T-t1-B-astra", "group": "T", "label": "제목 · t1-B · astra", "desc": "지금 제목: AI는 왜 날마다 첫 출근을 할까 | 본문: runs/columns/t1-B/final.md", "title": "t1-B 제목 후보 (astra)", "body": "1. AI가 아껴준 시간은 어디로 갔을까요?\n\n2. AI에게도 업무 인수인계가 필요합니다\n\n3. 똑똑한 AI가 우리 팀 사정은 모르는 이유\n\n4. AI에게 자료는 많을수록 좋을까요?\n\n5. AI가 일을 못한다고 결론 내리기 전에\n\n6. AI에게 무엇을 잊게 할지도 정하세요\n\n7. 신입에게도 자료 없이 보고서를 맡기시나요?\n\n8. AI의 답을 고치느라 바쁜 당신에게", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T-t2-B-astra", "group": "T", "label": "제목 · t2-B · astra", "desc": "지금 제목: AI가 많이 만들어 줄수록, 버릴 줄 알아야 합니다 | 본문: runs/columns/t2-B/final.md", "title": "t2-B 제목 후보 (astra)", "body": "1. AI를 잘 쓰게 된 걸까요, 실력이 늘어난 걸까요?\n\n2. 할 수 있는 일이 늘수록 ‘잘하는 한 가지’가 중요한 이유\n\n3. AI가 만든 것 중 무엇을 버리셨나요?\n\n4. 만들기가 쉬워졌다고 판단까지 쉬워진 것은 아닙니다\n\n5. AI에게 일을 맡길수록 내 실력도 자랄까요?\n\n6. AI가 빌려주는 ‘손’, 내가 길러야 할 ‘눈’\n\n7. 좋은 결과물을 고르는 감각은 직접 해 본 일에서 나옵니다\n\n8. AI 결과물을 쓰기 전에 버릴 이유부터 적어 보세요", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T-t3-B-astra", "group": "T", "label": "제목 · t3-B · astra", "desc": "지금 제목: 도구 열 개보다 지도 한 장 | 본문: runs/columns/t3-B/final.md", "title": "t3-B 제목 후보 (astra)", "body": "1. AI 도구는 늘었는데 왜 일은 줄지 않을까요?\n\n2. 여러분의 AI는 날마다 첫 출근을 하나요?\n\n3. AI에게 일을 맡기기 전에 팀의 기록부터 살펴보세요\n\n4. ‘많이 아는 AI’가 내 일도 잘 알까요?\n\n5. AI가 무엇을 잊어야 할지도 정하셨나요?\n\n6. 업무 자동화에도 순서가 있습니다\n\n7. 회의실에만 남은 결정은 AI가 알 수 없습니다\n\n8. AI에게도 우리 회사의 지도가 필요합니다", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "T-확정본-astra", "group": "T", "label": "제목 · 확정본 · astra", "desc": "지금 제목: AI를 쓰는데도 퇴근 시간이 그대로인 이유 | 본문: columns/2026-10-08-ai-퇴근시간.md", "title": "확정본 제목 후보 (astra)", "body": "1. AI로 일은 빨라졌는데, 왜 퇴근은 그대로일까요?\n\n2. AI로 아낀 시간은 누가 결정하나요?\n\n3. AI를 잘 쓰는 직원에게 일을 더 맡기기 전에\n\n4. 일을 빨리 끝내고도 더 지치는 이유\n\n5. AI가 초안을 써도 확인은 사람의 몫입니다\n\n6. AI 도구를 마음껏 쓰게 해 주면 충분할까요?\n\n7. 팀원마다 AI를 쓰는 속도가 다릅니다\n\n8. AI로 아낀 시간에도 용도를 정해 주세요", "m": {"분량": 0, "대비": 0, "나열": 0, "선언": 0, "번역투": 0}}, {"key": "F-2026-10-08-ai-퇴근시간", "group": "F", "label": "확정 · 2026-10-08-ai-퇴근시간", "desc": "멘토 확정본 (columns/2026-10-08-ai-퇴근시간.md)", "title": "AI를 쓰는데도 퇴근 시간이 그대로인 이유", "body": "여러분이 다니는 회사에서 원하는 AI 도구의 비용을 전액 지원한다고 해보세요. 어떤 도구를 쓸지도 여러분이 직접 고를 수 있습니다. AI를 익히고 활용하기에 꽤 좋은 조건이겠죠.\n\n그런데 지원이 충분한 곳에서도 직원들은 어려움을 겪는다고 합니다. AI를 잘 쓰는 사람이 체감상 서너 사람 몫을 해내는 경우는 흔하지만, 그만큼 사람의 한계도 빨리 드러난다는 것이죠. 생각보다 힘들고, 갈수록 부담이 커지며, 그 부담마저 일부 직원에게 몰릴 수 있다는 겁니다.\n\nAI를 써 봤지만 기대만큼 효과를 보지 못한 분이라면 고개가 끄덕여질 텐데요, AI 기업 앤트로픽의 글도 비슷한 질문을 던집니다. 일하는 속도가 빨라진 만큼 개인과 조직의 성과도 높아졌느냐는 질문이죠. 여러분은 어떻습니까? 일은 전보다 빨리 끝내는데, 퇴근 시간은 여전히 그대로이지 않나요?\n\n먼저 살펴볼 것은 ‘확인하는 데 드는 수고’입니다. AI는 같은 질문에도 매번 다른 답을 내놓고, 틀린 답을 주기도 합니다. 그런데 사람에게는 기계가 내놓은 답을 쉽게 믿는 경향이 있죠. 이른바 ‘자동화 편향’입니다. 그러니 AI의 결과물을 활용하려면 일부러 의심하면서 다시 들여다봐야 합니다.\n\nAI를 써도 검증 부담은 사라지지 않습니다. 형태만 바뀔 뿐이죠. 직접 작성하는 데 들이던 힘을 이제는 AI가 작성한 내용을 걸러 내는 데 써야 하니까요. 이런 피로가 쌓이면 번아웃으로 이어지기도 합니다. 요즘 “뇌 토큰이 바닥났다”는 농담이 도는 것도 그래서겠죠. 토큰은 AI가 글을 처리하는 단위인데요, AI가 처리할 수 있는 양에 한계가 있듯 사람의 머리에도 한계가 있다는 뜻입니다.\n\n둘째는 높아지는 기대치입니다. 현업에서는 AI를 잘 써서 오히려 지쳤다는 이야기가 드물지 않게 나온다고 합니다. 사내 ‘AI 프론티어’로 뽑힌 뒤 회사의 기대가 끝없이 높아졌고, 이를 견디다 못해 회사를 떠난 사람도 있다는 것이죠.\n\n결과를 책임지는 임원이 자신이 AI로 만든 결과물을 내밀며 왜 이만큼 해 오지 못하느냐고 묻는 경우도 있다고 합니다. 한 번 빨리 처리한 일이 그다음부터는 당연히 해내야 할 일이 되는 겁니다. 직원이 아낀 시간만큼 회사의 기대가 높아진다면, 일을 빨리 끝낸다고 해서 쉴 여유가 생기지는 않겠죠.\n\n셋째는 직원마다 AI를 활용하는 속도가 다르다는 점입니다. 같은 팀에서도 누군가는 AI로 일을 금방 끝내지만, 누군가는 아직 도구를 익히는 중입니다. 동료가 얼마나 빨리 일하는지도 모르는 상태에서 손발을 맞추기는 어렵습니다. 저는 바로 이 지점에서 특정 직원에게 일이 몰린다고 봅니다. 서로의 업무 속도를 알지 못하면, 일은 빨리 끝내는 사람에게 계속 넘어가기 마련이니까요.\n\n그렇다면 AI로 시간을 아끼는 것만으로 충분할까요? 저는 아낀 시간을 어떻게 쓸지까지 정해야 한다고 생각합니다. AI가 시간을 줄여 주더라도 그 시간을 여러분이 원하는 대로 쓰게 해 주지는 않으니까요. 용도를 정해 두지 않으면 새로 들어오는 일이 그 시간을 차지하게 됩니다.\n\n한 소규모 마케팅 회사에서는 매주 시간을 잡아먹던 자잘한 반복 업무를 AI에 맡겼다고 합니다. 세 개의 메일함으로 들어오는 문의를 분류하고 답장 초안을 쓰는 일, 기록된 작업 시간을 바탕으로 청구서 초안을 만드는 일 같은 것들이죠.\n\n고객 리뷰에 다는 답글도 AI가 초안을 작성합니다. 하지만 사람이 문구를 확인하고 승인하기 전에는 하나도 게시되지 않습니다. 그렇다고 모든 일이 금방 끝나는 것은 아닙니다. 콘텐츠를 작성하는 데는 여전히 몇 시간씩 걸린다고 하네요. 해변에서 하루 두 시간만 일하는 삶을 살게 된 건 아니라는 농담도 있지만, 아낀 시간을 사업의 다른 일에 쓸 수 있게 됐다는 겁니다.\n\n이 사례에서 시간을 돌려받을 수 있었던 이유는 무엇일까요? 제가 보기에 그 시간을 어디에 쓸지 스스로 결정할 수 있었기 때문입니다. AI로 큰 효과를 보는 것은 개인 단위이기에 가능한 경우가 많고, 조직에서는 사정이 다르다고 합니다. 조직에서는 내가 아낀 시간이 다른 사람에게는 ‘일을 더 맡길 수 있는 여유’로 보이기 쉽습니다. 그리고 그 여유는 곧 새로운 일로 채워지죠.\n\n그러니 다음에 AI에게 일을 맡길 때는 두 가지를 먼저 정해 두기 바랍니다. 하나는 ‘AI에게 어디까지 맡길 것인가’입니다. 처음부터 많은 일을 맡기려고 하지 마세요. 가장 잘 되는 일부터 작게 시작하고, 결과물은 반드시 사람이 확인하고 승인해야 합니다.\n\n다른 하나는 ‘그렇게 아낀 시간을 어디에 쓸 것인가’입니다. 미뤄 둔 문제를 고민하는 데 써도 좋고, 현장을 한 번 더 살피는 데 써도 좋습니다. 일찍 퇴근하는 데 쓸 수도 있겠죠. 여러분이 정한 용도를 팀장과도 이야기하기 바랍니다. 그래야 아낀 시간을 어떻게 쓸지 함께 정할 수 있으니까요.\n\n팀을 이끄는 분이라면 직원이 AI로 일을 빨리 끝냈을 때 곧바로 다른 일을 맡기기 전에, 그 시간을 어디에 쓸지부터 함께 정해 주기 바랍니다. AI를 잘 쓰는 직원에게 계속 일을 더 맡긴다면 그 직원의 퇴근 시간은 달라질 수 없겠죠.\n\nAI를 쓴다고 퇴근 시간이 저절로 빨라지지는 않습니다. 아낀 시간을 어디에 쓸지 미리 정하고 그에 맞게 쓸 수 있어야, 퇴근도 앞당길 수 있습니다.", "m": {"대비": 4, "나열": 2, "선언": 0, "번역투": 0, "분량": 1894}}, {"key": "t1-A-final", "group": "C1", "label": "t1-A · A 확정본 절차 · 최종", "desc": "한 줄: AI가 엉뚱한 답을 내놓는 건 AI가 모자라서라기보다 우리가 일할 때 쓰는 자료를 보여 주지 않았기 때문이다. 근거가 될 자료를 같이 주면 엉뚱한 답을 고치느라 쓰던 시간이 준다. | 원문: LinkedIn, AI 스타트업 AI 리드, 2026-10 / Threads, 세무사, 2026-10-02 (본문과 작성자 답글) / Threads, 노무사, 2026-02-07 | 재작성 참고: p752·p716", "title": "AI는 왜 늘 신입처럼 대답할까", "body": "여러분의 팀에 신입사원이 들어왔다고 해보세요. 그 직원이 제 몫을 하기까지는 시간이 좀 걸릴 겁니다. 업무 지식이 부족해서만은 아니죠. 어떤 일을 누구에게 물어야 하는지, 지금의 방침은 언제 어떤 자리에서 정해졌는지, 자기 업무가 옆 팀의 일과 어떻게 연결되는지를 알아야 하니까요. 이런 것들을 익히는 데 대략 석 달이 걸린다고 합니다.\n\n그런데 우리가 사용하는 AI에게도 이런 석 달이 주어질까요? 지금의 AI는 ‘날마다 첫 출근하는 신입사원’과 비슷합니다. 무언가를 물을 때마다 메신저 기록을 처음부터 다시 뒤지고, 전날 파악한 내용도 다음 날이면 모른다는 것이죠.\n\nAI에게 일을 맡겼다가 우리 팀 사정과 동떨어진 일반론이나 그대로 쓰기 어려운 초안을 받아본 적이 있을 겁니다. 그러면 여러분은 “AI가 아직 멀었네.”라고 생각하겠죠. 하지만 그렇게 결론을 내리기 전에 먼저 살펴볼 것이 있습니다. 여러분이 그 일을 하면서 펼쳐 보는 자료를 AI에게도 보여줬는지 말입니다. 엉뚱한 답은 AI의 능력이 부족해서라기보다 일에 필요한 자료를 받지 못해서 나오는 경우가 많습니다. 첫 출근한 신입사원에게 아무것도 건네지 않은 채 보고서를 써오라고 하면 어떨까요? 아무리 똑똑한 직원이라도 결과는 크게 다르지 않을 겁니다.\n\n회의록을 요약하거나 메일 초안을 작성하는 도구를 하나둘 늘린다고 회사가 달라지지는 않습니다. 사용하는 직원에게는 켜야 할 창이 하나 더 생길 뿐이죠. 그래서 한 AI 스타트업에서는 AI가 회사를 미리 익히도록 하는 데 공을 들였습니다.\n\n이 회사의 AI는 날마다 새벽 4시에 메신저 대화, 회의 녹음, 업무 문서, 개발 기록을 훑습니다. 그리고 사람과 서비스, 업무마다 설명 페이지를 만든 다음, 누가 무엇을 논의했고 무엇을 맡았는지에 따라 페이지들을 연결하죠. 누군가 질문하면 해당 페이지를 찾고, 거기서 한 단계 연결된 페이지까지 함께 살펴서 답을 만듭니다. 질문을 받고 나서야 자료를 뒤지는 것이 아니라, 미리 그려놓은 지도를 펼쳐 보는 셈입니다.\n\n여기까지 읽으면 “역시 AI에게 자료를 많이 줘야 하는군.”이라고 생각할 텐데요, 이 사례에서 흥미로운 부분은 그다음에 나옵니다.\n\n자료를 모두 모아 지도를 만들었더니 사람, 브랜드, 업무 등의 항목이 2,927개 생겼습니다. 그런데 한 사람의 업무를 기준으로 살펴보니, 그중 70퍼센트는 그 사람의 메신저에도, 회의에도, 문서에도 등장한 적이 없는 다른 팀의 브랜드와 크리에이터였습니다. 회사의 지식을 한데 모았지만 정작 자신의 일과 관계없는 항목이 대부분이었던 것이죠.\n\n그래서 지도를 만드는 기준을 바꿨습니다. 어떤 직책을 갖고 있느냐가 아니라 ‘실제로 어떤 일을 하느냐’에 따라 사람마다 지도를 따로 키우기로 한 겁니다. 가령 같은 브랜드라도 상품기획자(MD)들의 대화에는 등장하고 개발자들의 대화에는 나오지 않는다면 MD의 지도에만 넣습니다. 물론 각자가 볼 권한이 있는 자료만 읽도록 했고요.\n\n자료를 고르는 과정이 처음부터 순조로웠던 것은 아닙니다. 업무 문서 도구인 노션에 최근 올라온 페이지 400개 중에서 사용자의 직무와 채널, 주제에 맞는 12개만 골라 넣는데요, 처음에는 단어를 기준으로 골랐다가 문제가 생겼습니다. 채널 이름에 ‘브랜드’나 ‘광고’라는 단어가 들어 있다는 이유만으로 다른 사람의 주간 회의록과 단가표까지 딸려 들어온 것이죠. 결국 자료를 고르는 일만 담당하는 AI 모델을 따로 두었습니다. 이 모델은 제목만 보고도 사용자가 실제로 하는 일에 맞는 자료를 가려냈다고 합니다.\n\n무엇을 기억할지만큼이나 무엇을 잊을지도 정해야 했습니다. 30일이 지나도록 다시 등장하지 않는 항목은 지도에서 지우기로 했죠. 처음에 5천 개를 웃돌던 항목 가운데 57퍼센트가 한 번 언급되고 끝난 이름이었다고 합니다. 절반이 넘는 항목이 그저 스쳐 간 이름이었던 겁니다. 다만 여러 출처에 등장하거나, 다른 항목과 여러 갈래로 연결되거나, 설명이 붙어 있는 항목은 남겨두었습니다.\n\n이 사례가 알려주는 것은 무엇일까요? AI가 엉뚱한 답을 덜 내놓게 하려면 우리가 일할 때 보는 자료를 보여줘야 한다는 것입니다. 그렇다고 자료가 많을수록 좋은 것은 아니죠. ‘내 일과 관련된 자료’를 골라줘야 합니다. 신입사원의 책상 위에 서류를 산더미처럼 쌓아준다고 그 직원이 일을 잘하게 되지는 않을 테니까요.\n\n이 원리는 개발자들에게만 해당하는 이야기가 아닙니다. 한 세무사는 법령정보센터에서 법령 자료를 프로그램이 직접 찾아볼 수 있도록 열어놓은 통로, 즉 API의 사용 키를 받아 Claude에 연결했습니다. 그랬더니 답의 수준이 몰라보게 달라졌다고 하네요. 그동안 Claude를 별 볼 일 없다고 여겼는데, 문제는 자신의 사용법에 있었다는 고백도 덧붙였습니다.\n\n한 노무사는 부당해고 상담을 하던 중 의뢰인이 ChatGPT에 물어서 가져온 판례가 실제로는 존재하지 않는다는 것을 알게 됐습니다. 그 뒤로 국가법령정보센터의 무료 API를 자신의 AI 비서에 연결해두고, 상담 도중 판례가 정말 있는지 확인하게 합니다. 선고일과 사건명, 법원까지 확인하는 데 30초면 된다고 하죠.\n\nAI가 내놓은 결과는 거듭 확인해야 합니다. 자료를 연결했다고 해서 AI가 더 이상 틀리지 않는다는 뜻은 아닙니다. 다만 그 답이 맞는지 따져볼 기준이 생기는 것이죠.\n\n저는 AI의 효과가 애매하게 느껴지는 이유도 여기에 있다고 생각합니다. 자료 없이 받은 답은 결국 사람이 손봐야 합니다. 우리 상황을 다시 설명하고, 틀린 부분을 짚어주고, 또 질문해야 하죠. 이렇게 주고받는 데 드는 시간이 AI가 아껴준 시간을 갉아먹습니다. 처음부터 답의 근거가 될 자료를 함께 건네면 이런 과정을 줄일 수 있겠죠.\n\n그렇다면 여러분도 새벽마다 자료를 읽어 들이는 시스템부터 만들어야 할까요? 원리만 가져와도 됩니다. AI에게 일을 맡길 때 새로 온 팀원에게 건넬 법한 자료를 함께 붙여보세요. 관련된 지난 회의록, 따라야 할 규정, 작년에 작성한 비슷한 보고서 같은 것들입니다. 폴더를 통째로 넘기기보다는 이번 일에 꼭 필요한 자료 몇 개를 고르기 바랍니다. 물론 여러분이 볼 권한이 있는 자료인지, AI에 올려도 되는 자료인지는 먼저 확인해야 합니다.\n\n신입사원이 석 달 만에 제 몫을 하게 되는 것은 그동안 보고 들은 것이 쌓였기 때문입니다. 우리가 평소 사용하는 AI에게는 그런 석 달이 주어지지 않죠. 그러니 엉뚱한 답이 돌아왔다면 AI를 탓하기 전에 스스로에게 물어보기 바랍니다. “내가 이 일을 하면서 펼쳐 보는 자료 가운데 AI에게 보여준 것은 무엇인가?”라고 말입니다. AI가 동료의 몫을 하길 바란다면, 그 석 달 동안 익혔어야 할 것을 대신 건네주는 일은 여러분의 을 잊을지도 정해야 했습니다. 30일이 지나도록 다시 등장하지 않는 항목은 지도에서 지우기로 했죠. 처음에 5천 개를 웃돌던 항목 가운데 57퍼센트가 한 번 언급되고 끝난 이름이었다고 합니다. 절반이 넘는 항목이 그저 스쳐 간 이름이었던 겁니다. 다만 여러 출처에 등장하거나, 다른 항목과 여러 갈래로 연결되거나, 설명이 붙어 있는 항목은 남겨두었습니다.\n\n이 사례가 알려주는 것은 무엇일까요? AI가 엉뚱한 답을 덜 내놓게 하려면 우리가 일할 때 보는 자료를 보여줘야 한다는 것입니다. 그렇다고 자료가 많을수록 좋은 것은 아니죠. ‘내 일과 관련된 자료’를 골라줘야 합니다. 신입사원의 책상 위에 서류를 산더미처럼 쌓아준다고 그 직원이 일을 잘하게 되지는 않을 테니까요.\n\n이 원리는 개발자들에게만 해당하는 이야기가 아닙니다. 한 세무사는 법령정보센터에서 법령 자료를 프로그램이 직접 찾아볼 수 있도록 열어놓은 통로, 즉 API의 사용 키를 받아 Claude에 연결했습니다. 그랬더니 답의 수준이 몰라보게 달라졌다고 하네요. 그동안 Claude를 별 볼 일 없다고 여겼는데, 문제는 자신의 사용법에 있었다는 고백도 덧붙였습니다.\n\n한 노무사의 경험도 살펴보겠습니다. 부당해고 상담을 하던 중 의뢰인이 ChatGPT에 물어서 가져온 판례가 실제로는 존재하지 않는다는 것을 알게 됐습니다. 그 뒤로 이 노무사는 국가법령정보센터의 무료 API를 자신의 AI 비서에 연결해두고, 상담 도중 판례가 정말 있는지 확인하게 합니다. 선고일과 사건명, 법원까지 확인하는 데 30초면 된다고 하죠.\n\n스스로를 컴퓨터를 모르는 전형적인 문과 출신이라고 소개하는 이 노무사도 AI가 내놓은 결과는 거듭 확인해야 한다고 강조합니다. 자료를 연결했다고 해서 AI가 더 이상 틀리지 않는다는 뜻은 아닙니다. 다만 그 답이 맞는지 따져볼 기준이 생기는 것이죠.\n\n저는 AI의 효과가 애매하게 느껴지는 이유도 여기에 있다고 생각합니다. 자료 없이 받은 답은 결국 사람이 손봐야 합니다. 우리 상황을 다시 설명하고, 틀린 부분을 짚어주고, 또 질문해야 하죠. 이렇게 주고받는 데 드는 시간이 AI가 아껴준 시간을 갉아먹습니다. 처음부터 답의 근거가 될 자료를 함께 건네면 이런 과정을 줄일 수 있겠죠.\n\n그렇다면 여러분도 새벽마다 자료를 읽어 들이는 시스템부터 만들어야 할까요? 원리만 가져와도 됩니다. AI에게 일을 맡길 때 새로 온 팀원에게 건넬 법한 자료를 함께 붙여보세요. 관련된 지난 회의록, 따라야 할 규정, 작년에 작성한 비슷한 보고서 같은 것들입니다. 폴더를 통째로 넘기기보다는 이번 일에 꼭 필요한 자료 몇 개를 고르기 바랍니다. 물론 여러분이 볼 권한이 있는 자료인지, AI에 올려도 되는 자료인지는 먼저 확인해야 합니다.\n\n신입사원이 석 달 만에 제 몫을 하게 되는 것은 그동안 보고 들은 것이 쌓였기 때문입니다. 우리가 평소 사용하는 AI에게는 그런 석 달이 주어지지 않죠. 그러니 엉뚱한 답이 돌아왔다면 AI를 탓하기 전에 스스로에게 물어보기 바랍니다. “내가 이 일을 하면서 펼쳐 보는 자료 가운데 AI에게 보여준 것은 무엇인가?”라고 말입니다. AI가 동료의 몫을 하길 바란다면, 그 석 달 동안 익혔어야 할 것을 대신 건네주는 일은 여러분의 몫입니다.", "m": {"대비": 4, "나열": 0, "선언": 0, "번역투": 0, "분량": 2549}}, {"key": "t1-A-draft", "group": "C1", "label": "t1-A · (중간) Claude 초안 — B도 이 초안 사용", "desc": "한 줄: AI가 엉뚱한 답을 내놓는 건 AI가 모자라서라기보다 우리가 일할 때 쓰는 자료를 보여 주지 않았기 때문이다. 근거가 될 자료를 같이 주면 엉뚱한 답을 고치느라 쓰던 시간이 준다. | 원문: LinkedIn, AI 스타트업 AI 리드, 2026-10 / Threads, 세무사, 2026-10-02 (본문과 작성자 답글) / Threads, 노무사, 2026-02-07", "title": "AI는 왜 늘 신입처럼 대답할까", "body": "신입 사원이 들어오면 제 몫을 하기까지 시간이 걸립니다. 업무 지식이 모자라서만은 아니죠. 어떤 일을 누구에게 물어야 하는지, 지금의 방침이 언제 어떤 자리에서 정해졌는지, 내 업무가 옆 팀 일과 어떻게 얽혀 있는지를 알아야 하거든요. 한 AI 스타트업에서 AI 업무를 이끄는 리드는 이런 것을 익히는 데 대략 석 달이 걸린다고 봅니다.\n\n그런데 우리가 쓰는 AI에게는 이 석 달이 없습니다. 이 리드는 지금의 AI를 날마다 첫 출근하는 신입에 빗댑니다. 무엇을 물을 때마다 메신저 기록을 맨 앞부터 새로 뒤지고, 전날 파악한 것도 다음 날이면 모른다는 거죠.\n\nAI에게 일을 맡겼다가 엉뚱한 답을 받아 보신 적이 있을 겁니다. 우리 팀 사정과 동떨어진 일반론이나, 그럴듯하지만 그대로는 쓸 수 없는 초안 같은 것들이요. 그러면 우리는 'AI가 아직 멀었다'고 결론을 내리곤 합니다. 하지만 저는 생각이 다릅니다. 엉뚱한 답은 AI의 머리가 나빠서라기보다 우리가 일할 때 펼쳐 보는 자료를 AI에게 보여 주지 않아서 나오는 경우가 많습니다. 첫 출근한 신입에게 아무것도 건네지 않고 보고서를 써 오라고 하면, 아무리 똑똑한 사람이라도 결과는 크게 다르지 않을 테니까요.\n\n이 리드는 회의록 요약이나 메일 초안 같은 도구를 하나둘 늘려서는 회사가 달라지지 않는다고 말합니다. 쓰는 사람에게는 켜야 할 창이 하나 더 생길 뿐이라는 겁니다. 그래서 공을 들인 것은 AI가 회사를 미리 익히게 하는 일이었습니다. AI는 날마다 새벽 4시에 메신저 대화, 회의 녹음, 업무 문서, 개발 기록을 훑어 둡니다. 그리고 사람과 서비스, 업무 하나하나에 설명 페이지를 만든 다음, 누가 무엇을 논의했고 누가 무엇을 맡았는지를 따라 페이지끼리 이어 놓습니다. 누가 무언가를 물으면 AI는 해당 페이지를 찾고, 거기서 한 걸음 이어진 페이지까지 곁들여 답을 만듭니다. 질문을 받고 나서야 뒤지는 게 아니라 미리 그려 둔 지도를 펼쳐 보는 셈이죠.\n\n여기까지만 들으면 자료는 많이 넣을수록 좋다는 이야기 같습니다. 그런데 이 사례가 정말 흥미로운 지점은 그 반대편에 있습니다.\n\n자료를 전부 모아 지도를 그렸더니 사람, 브랜드, 업무 같은 항목이 2,927개 생겼습니다. 그런데 그중 70%는 이 리드의 메신저에도 회의에도 문서에도 나온 적이 없는 다른 팀의 브랜드와 크리에이터였습니다. 회사의 지식을 몽땅 모았더니 정작 자기 일과 상관없는 것이 대부분이었던 겁니다. 그래서 지도의 기준을 바꿨습니다. 어떤 직책을 달고 있느냐가 아니라 실제로 어떤 일을 하고 있느냐에 따라 사람마다 지도를 따로 키우기로 했죠. 같은 브랜드라도 상품기획자(MD)들 대화에는 오르내리고 개발자들 대화에는 나오지 않으면 MD의 지도에만 들어갑니다. 물론 각자 볼 권한이 있는 자료만 읽고요.\n\n고르는 과정에는 실패담도 있습니다. 업무 문서 도구(노션)에 최근 올라온 페이지 400개 가운데 자기 직무와 채널, 주제에 맞는 12개만 골라 넣는데, 처음에 단어를 기준으로 골랐다가 일이 꼬였습니다. 채널 이름에 '브랜드'나 '광고'라는 말이 들어 있다는 이유만으로 다른 사람의 주간 회의록과 단가표가 딸려 들어온 거죠. 결국 고르는 일만 맡는 AI 모델을 따로 두었고, 이 모델은 제목만 보고도 이 리드가 실제로 하는 일을 가려냈다고 합니다.\n\nAI가 무엇을 잊을지도 정했습니다. 30일이 지나도록 다시 나오지 않는 항목은 지도에서 지웁니다. 처음에 5천 개를 웃돌던 항목 가운데 57%가 한 번 언급되고 끝난 이름이었다고 하니, 절반이 넘는 항목이 그냥 스쳐 간 이름이었던 셈입니다. 다만 여러 출처에 등장하거나 다른 항목과 여러 갈래로 이어져 있거나 설명이 붙은 항목은 남겨 두었습니다.\n\n정리하면 이렇습니다. AI가 엉뚱한 답을 덜 내게 하려면 우리가 일할 때 보는 자료를 보여 줘야 합니다. 그렇다고 많이 줄수록 좋은 것은 아닙니다. 내 일에 닿아 있는 자료를 골라서 줘야 합니다. 책상 위에 서류를 산더미처럼 쌓아 준다고 신입이 일을 잘하게 되지는 않는 것과 같습니다.\n\n이 원리는 개발자들만의 이야기가 아닙니다. 한 세무사는 법령정보센터에서 법령 자료를 프로그램이 직접 찾아볼 수 있게 열어 둔 통로(API)의 사용 키를 받아 Claude에 연결했습니다. 그랬더니 답의 수준이 몰라보게 달라졌다고 합니다. 그동안 Claude를 별 볼 일 없다고 여겼는데 문제는 자기 사용법에 있었다는 고백도 덧붙였죠. 한 노무사는 부당해고 상담에서 의뢰인이 ChatGPT에 물어 가져온 판례가 실제로는 없는 판례였던 일을 겪었습니다. 그 뒤로 국가법령정보센터의 무료 API를 자기 AI 비서에 연결해 두고, 상담 도중 판례가 정말 있는지 확인하게 합니다. 선고일과 사건명, 법원까지 30초면 나온다고 하죠. 스스로를 컴퓨터를 모르는 전형적인 문과 출신이라고 소개하는 이 노무사도, AI가 내놓은 결과는 거듭 확인해야 한다고 강조합니다. 자료를 건넨다고 AI가 틀리지 않게 되는 것은 아닙니다. 다만 답이 맞는지 따져 볼 기준이 생깁니다.\n\nAI의 효과가 애매하게 느껴지는 이유도 여기에 있다고 저는 봅니다. 자료 없이 받은 답은 결국 사람이 손봐야 합니다. 우리 상황을 다시 설명하고, 틀린 곳을 짚고, 또 묻죠. 이렇게 주고받는 데 드는 시간이 AI가 아껴 준 시간을 갉아먹습니다. 처음부터 근거가 될 자료를 같이 건네면 이렇게 주고받을 일이 줄어듭니다.\n\n새벽마다 자료를 읽어 들이는 시스템부터 만들 필요는 없습니다. 원리만 빌려 오면 됩니다. AI에게 일을 맡길 때 새로 온 팀원에게 건넬 법한 자료를 함께 붙여 보세요. 관련된 지난 회의록, 따라야 할 규정, 작년에 쓴 비슷한 보고서 같은 것들이요. 폴더를 통째로 넘기지 말고 이번 일에 꼭 필요한 몇 개만 고르시고요. 물론 내가 볼 수 있는 자료인지, AI에 올려도 되는 자료인지는 먼저 따져 봐야 합니다.\n\n신입이 석 달 만에 제 몫을 하게 되는 것은 그동안 보고 들은 것이 쌓였기 때문입니다. 우리가 평소 쓰는 AI에게는 그런 석 달이 주어지지 않습니다. 그러니 엉뚱한 답이 돌아왔다면 AI를 탓하기 전에 스스로 물어보십시오. 내가 이 일을 하면서 펼쳐 보는 자료 가운데 AI에게 보여 준 것은 무엇이었나. AI를 동료로 만드는 것은 그 석 달 치를 대신 건네주는 우리의 몫입니다.", "m": {"대비": 5, "나열": 0, "선언": 0, "번역투": 0, "분량": 2294}}, {"key": "t1-B-final", "group": "C1", "label": "t1-B · B 문체 참고 바꿈 · 최종", "desc": "한 줄: AI가 엉뚱한 답을 내놓는 건 AI가 모자라서라기보다 우리가 일할 때 쓰는 자료를 보여 주지 않았기 때문이다. 근거가 될 자료를 같이 주면 엉뚱한 답을 고치느라 쓰던 시간이 준다. | 원문: LinkedIn, AI 스타트업 AI 리드, 2026-10 / Threads, 세무사, 2026-10-02 (본문과 작성자 답글) / Threads, 노무사, 2026-02-07 | 재작성 참고: p724·p669", "title": "AI는 왜 날마다 첫 출근을 할까", "body": "신입 사원이 들어오면 제 몫을 하기까지 시간이 걸립니다. 업무 지식이 부족해서만은 아닙니다. 어떤 일을 누구에게 물어야 하는지, 지금의 방침이 언제 어떤 자리에서 정해졌는지, 자기 업무가 옆 팀의 일과 어떻게 얽혀 있는지를 익혀야 하기 때문이죠. 한 AI 스타트업에서는 여기에 대략 석 달이 걸린다고 합니다.\n\n그런데 우리가 쓰는 AI에게는 이 석 달이 주어지지 않습니다. 지금의 AI는 ‘날마다 첫 출근하는 신입’과 닮아 있는데요, 무엇을 물을 때마다 메신저 기록을 처음부터 다시 뒤지고, 전날 파악했던 것도 다음 날이면 모르는 겁니다. 매일 출근하지만 회사 사정은 늘 처음부터 배워야 하는 셈이죠.\n\n혹시 여러분도 AI에게 일을 맡겼다가 엉뚱한 답을 받아본 적이 있나요? 우리 팀 사정과 동떨어진 일반론을 늘어놓거나, 그럴싸해 보이지만 그대로는 쓸 수 없는 초안을 내놓는 경우 말입니다. 그러면 우리는 ‘AI가 제대로 일하려면 아직 멀었다’고 결론 내리곤 합니다. 하지만 저는 그 전에 따져볼 것이 있다고 생각합니다. 여러분이 일할 때 펼쳐 보는 자료를 AI에게도 보여줬는지 말입니다. 첫 출근한 신입에게 아무런 자료도 건네지 않고 보고서를 써오라고 한다면, 아무리 똑똑한 사람이라도 좋은 결과를 내기는 어렵겠죠.\n\n회의록 요약이나 메일 초안 작성 도구를 하나둘 늘린다고 회사가 달라지지는 않습니다. 사용자에게 켜야 할 창이 하나 더 생길 뿐이죠. 그래서 이 스타트업에서 공을 들인 일은 AI가 회사를 미리 익히도록 만드는 것이었습니다.\n\n방식은 이렇습니다. AI가 날마다 새벽 4시에 메신저 대화, 회의 녹음, 업무 문서, 개발 기록을 훑습니다. 그런 다음 사람과 서비스, 업무 하나하나에 관한 설명 페이지를 만들고, 누가 무엇을 논의했는지, 누가 무엇을 맡았는지에 따라 페이지들을 서로 연결합니다. 누군가 질문을 던지면 해당 페이지를 찾고, 거기서 한 걸음 이어진 페이지까지 함께 살펴 답을 만드는 겁니다. 질문을 받고 나서야 자료를 뒤지는 대신, 미리 그려둔 지도를 펼쳐 보는 것이죠.\n\n여기까지 읽으면 ‘그러니까 AI에게 자료를 많이 넣어주라는 말이군’이라고 생각할지 모르겠습니다. 하지만 이 사례에서 눈여겨볼 대목은 그다음입니다. 자료를 많이 모으는 것이 오히려 문제를 일으켰으니까요.\n\n자료를 전부 모아 지도를 그렸더니 사람, 브랜드, 업무 같은 항목이 2,927개 생겼습니다. 그런데 그중 70%는 정작 지도를 쓰는 사람의 메신저에도, 회의에도, 문서에도 등장한 적이 없는 다른 팀의 브랜드와 크리에이터였습니다. 회사의 지식을 한데 모았는데 정작 자기 일과 상관없는 것이 대부분이었던 겁니다.\n\n그래서 지도를 만드는 기준을 바꿨습니다. 어떤 직책을 가지고 있느냐가 아니라 ‘실제로 어떤 일을 하고 있느냐’에 따라 사람마다 지도를 따로 키우기로 한 것이죠. 같은 브랜드라도 상품기획자(MD)들의 대화에는 오르내리고 개발자들의 대화에는 등장하지 않는다면 MD의 지도에만 들어갑니다. 물론 각자가 볼 권한이 있는 자료만 읽는다는 조건 아래에서 말입니다.\n\n필요한 자료를 고르는 과정도 처음부터 순탄하지는 않았습니다. 업무 문서 도구인 노션에 최근 올라온 페이지 400개 가운데 사용자의 직무와 채널, 주제에 맞는 12개만 골라 넣는 과정이었는데요, 처음에는 단어를 기준으로 골랐다가 엉뚱한 자료까지 들어왔습니다. 채널 이름에 ‘브랜드’나 ‘광고’라는 말이 있다는 이유만으로 다른 사람의 주간 회의록과 단가표가 딸려 들어온 것이죠. 결국 자료를 고르는 일만 담당하는 AI 모델을 따로 뒀습니다. 이 모델은 제목만 보고도 사용자가 실제로 하는 일과 관련된 자료를 가려냈다고 합니다.\n\n무엇을 기억하게 할지 정했다면, 무엇을 잊게 할지도 정해야겠죠. 30일이 지나도록 다시 등장하지 않는 항목은 지도에서 지우도록 했습니다. 처음에 5천 개를 웃돌던 항목 가운데 57%가 한 번 언급되고 끝난 이름이었다고 합니다. 절반이 넘는 항목이 업무에서 계속 다뤄지는 대상이 아니라 잠깐 스쳐 간 이름이었던 셈입니다. 다만 여러 출처에 등장하거나, 다른 항목과 여러 갈래로 연결되거나, 설명이 붙어 있는 항목은 남겨뒀습니다.\n\n이 사례가 말해주는 것은 분명합니다. AI가 엉뚱한 답을 덜 내놓게 하려면 우리가 일할 때 보는 자료를 보여줘야 합니다. 그렇다고 많이 주기만 하면 되는 것은 아닙니다. 내 일과 관련된 자료를 골라줘야 하죠. 신입의 책상 위에 서류를 산더미처럼 쌓아놓는다고 일을 잘하게 되지는 않으니까요.\n\n‘이런 일은 개발자들이나 할 수 있는 것 아닌가?’라고 생각하는 분도 있을 겁니다. 하지만 이 원리는 개발자에게만 해당하지 않습니다. 한 세무사는 법령정보센터에서 법령 자료를 프로그램이 직접 찾아볼 수 있도록 열어둔 통로, 즉 API의 사용 키를 받아 Claude에 연결했습니다. 그랬더니 답의 수준이 몰라보게 달라졌다고 합니다. 그동안 Claude를 별 볼 일 없다고 생각했는데, 문제는 자신의 사용법에 있었다는 고백도 덧붙였죠.\n\n한 노무사의 사례도 있습 습니다.\n\n방식은 이렇습니다. AI가 날마다 새벽 4시에 메신저 대화, 회의 녹음, 업무 문서, 개발 기록을 훑습니다. 그런 다음 사람과 서비스, 업무 하나하나에 관한 설명 페이지를 만들고, 누가 무엇을 논의했는지, 누가 무엇을 맡았는지에 따라 페이지들을 서로 연결합니다. 누군가 질문을 던지면 해당 페이지를 찾고, 거기서 한 걸음 이어진 페이지까지 함께 살펴 답을 만드는 겁니다. 질문을 받고 나서야 자료를 뒤지는 대신, 미리 그려둔 지도를 펼쳐 보는 것이죠.\n\n여기까지 읽으면 ‘그러니까 AI에게 자료를 많이 넣어주라는 말이군’이라고 생각할지 모르겠습니다. 하지만 이 사례에서 눈여겨볼 대목은 그다음입니다. 자료를 많이 모으는 것이 오히려 문제를 일으켰으니까요.\n\n자료를 전부 모아 지도를 그렸더니 사람, 브랜드, 업무 같은 항목이 2,927개 생겼습니다. 그런데 그중 70%는 이 리드의 메신저에도, 회의에도, 문서에도 등장한 적이 없는 다른 팀의 브랜드와 크리에이터였습니다. 회사의 지식을 한데 모았는데 정작 자기 일과 상관없는 것이 대부분이었던 겁니다.\n\n그래서 지도를 만드는 기준을 바꿨습니다. 어떤 직책을 가지고 있느냐가 아니라 ‘실제로 어떤 일을 하고 있느냐’에 따라 사람마다 지도를 따로 키우기로 한 것이죠. 같은 브랜드라도 상품기획자(MD)들의 대화에는 오르내리고 개발자들의 대화에는 등장하지 않는다면 MD의 지도에만 들어갑니다. 물론 각자가 볼 권한이 있는 자료만 읽는다는 조건 아래에서 말입니다.\n\n필요한 자료를 고르는 과정도 처음부터 순탄하지는 않았습니다. 업무 문서 도구인 노션에 최근 올라온 페이지 400개 가운데 이 리드의 직무와 채널, 주제에 맞는 12개만 골라 넣는 과정이었는데요, 처음에는 단어를 기준으로 골랐다가 엉뚱한 자료까지 들어왔습니다. 채널 이름에 ‘브랜드’나 ‘광고’라는 말이 있다는 이유만으로 다른 사람의 주간 회의록과 단가표가 딸려 들어온 것이죠. 결국 자료를 고르는 일만 담당하는 AI 모델을 따로 뒀습니다. 이 모델은 제목만 보고도 이 리드가 실제로 하는 일과 관련된 자료를 가려냈다고 합니다.\n\n무엇을 기억하게 할지 정했다면, 무엇을 잊게 할지도 정해야겠죠. 30일이 지나도록 다시 등장하지 않는 항목은 지도에서 지우도록 했습니다. 처음에 5천 개를 웃돌던 항목 가운데 57%가 한 번 언급되고 끝난 이름이었다고 합니다. 절반이 넘는 항목이 업무에서 계속 다뤄지는 대상이 아니라 잠깐 스쳐 간 이름이었던 셈입니다. 다만 여러 출처에 등장하거나, 다른 항목과 여러 갈래로 연결되거나, 설명이 붙어 있는 항목은 남겨뒀습니다.\n\n이 사례가 말해주는 것은 분명합니다. AI가 엉뚱한 답을 덜 내놓게 하려면 우리가 일할 때 보는 자료를 보여줘야 합니다. 그렇다고 많이 주기만 하면 되는 것은 아닙니다. 내 일과 관련된 자료를 골라줘야 하죠. 신입의 책상 위에 서류를 산더미처럼 쌓아놓는다고 일을 잘하게 되지는 않으니까요.\n\n‘이런 일은 개발자들이나 할 수 있는 것 아닌가?’라고 생각하는 분도 있을 겁니다. 하지만 이 원리는 개발자에게만 해당하지 않습니다. 한 세무사는 법령정보센터에서 법령 자료를 프로그램이 직접 찾아볼 수 있도록 열어둔 통로, 즉 API의 사용 키를 받아 Claude에 연결했습니다. 그랬더니 답의 수준이 몰라보게 달라졌다고 합니다. 그동안 Claude를 별 볼 일 없다고 생각했는데, 문제는 자신의 사용법에 있었다는 고백도 덧붙였죠.\n\n한 노무사의 사례도 있습니다. 부당해고 상담을 하던 중 의뢰인이 ChatGPT에 물어 가져온 판례가 실제로는 존재하지 않는다는 사실을 알게 됐다고 합니다. 그 뒤로 국가법령정보센터의 무료 API를 자신의 AI 비서에 연결해두고, 상담 도중 판례가 정말 있는지 확인하게 했습니다. 선고일과 사건명, 법원까지 확인하는 데 30초면 된다고 하죠.\n\n스스로를 컴퓨터를 모르는 전형적인 문과 출신이라고 소개하는 이 노무사도 AI가 내놓은 결과는 거듭 확인해야 한다고 강조합니다. 자료를 연결했다고 AI가 더 이상 틀리지 않는 것은 아니기 때문입니다. 다만 무엇을 근거로 답이 맞는지 따져봐야 할지, 그 기준이 생기는 것이죠.\n\n저는 AI를 쓰면서도 효과가 애매하다고 느끼는 이유가 여기에 있다고 봅니다. 자료 없이 받은 답은 결국 사람이 손봐야 합니다. 우리 상황을 다시 설명하고, 틀린 부분을 짚어주고, 다시 질문을 던져야 하죠. 이렇게 주고받는 시간이 AI가 아껴준 시간을 갉아먹는 겁니다. 처음부터 근거가 될 자료를 함께 건넨다면 이런 왕복을 줄일 수 있습니다.\n\n그렇다면 여러분은 어디서부터 시작해야 할까요? 당장 새벽마다 자료를 읽어 들이는 시스템을 만들 필요는 없습니다. 원리를 여러분의 업무에 적용하면 됩니다. AI에게 일을 맡길 때 새로 온 팀원에게 건넬 법한 자료를 함께 붙여보세요. 관련된 지난 회의록, 따라야 할 규정, 작년에 작성한 비슷한 보고서 같은 것들 말입니다. 폴더를 통째로 넘기기보다는 이번 일에 꼭 필요한 자료 몇 개를 고르기 바랍니다. 물론 여러분이 볼 수 있는 자료인지, AI에 올려도 되는 자료인지는 먼저 따져봐야겠죠.\n\n신입이 석 달 만에 제 몫을 하게 되는 것은 그동안 보고 들은 것이 쌓였기 때문입니다. 우리가 평소 쓰는 AI에게는 그런 석 달이 없습니다. 그러니 엉뚱한 답이 돌아왔다면 AI의 능력을 탓하기 전에 스스로에게 물어보기 바랍니다. ‘내가 이 일을 하면서 펼쳐 보는 자료 가운데 AI에게 보여준 것은 무엇인가?’라고 말입니다. AI가 날마다 첫 출근하는 신입에서 벗어나 동료로 일하기를 바란다면, 그 석 달 치를 대신 건네주는 일은 우리의 몫입니다.", "m": {"대비": 3, "나열": 0, "선언": 0, "번역투": 0, "분량": 2660}}, {"key": "t1-C-final", "group": "C1", "label": "t1-C · C 다른 각도 · 최종", "desc": "한 줄: AI에게 '기억해 달라'고 부탁하기보다, 나중에 AI가 다시 찾아볼 수 있게 내 일의 기록을 쌓아 두는 사람이 AI 덕을 본다. | 원문: Threads, 업무 자동화를 공유하는 직장인, 2026-09-15 / LinkedIn, 마케팅 커뮤니케이션 매니저(비개발자), 2026-09 | 재작성 참고: p752·p716", "title": "AI에게 기억을 부탁하지 말고, 기록을 남기세요", "body": "몇 달 전에 끝난 일을 두고 상사가 여러분에게 묻습니다. “그 업체와는 왜 그런 방향으로 정리했죠? 그 무렵 매출은 어느 정도였습니까?” 머릿속을 더듬어 보지만 떠오르는 것은 당시 회의실의 분위기 정도입니다. 메일함을 거슬러 올라가고 메신저 대화방과 폴더를 뒤지던 여러분은 결국 이렇게 답하겠죠. “확인해서 다시 말씀드리겠습니다.” 한 번쯤 겪어 봤을 상황일 겁니다.\n\n업무 기록을 위키로 쌓아 두고 이런 질문에 대비한 사례가 있습니다. AI에게 업무 위키를 찾아보라고 하면 된다는 것이죠. 어떻게 이것이 가능할까요?\n\n이 사례에서는 옵시디언이라는 메모 앱을 업무 위키로 사용합니다. 회의 내용과 결정 사항, 진행 상황, 주요 데이터를 서로 연결하며 쌓아 두는 것인데요, 자기 업무에 관한 사전을 만드는 셈입니다. 설정하는 일은 AI에게 맡겼다고 합니다. 앱을 설치한 다음 AI 도구인 코덱스(Codex)에게 비개발자도 쓰기 쉽도록 구조를 가능한 한 단순하게 만들어 달라고 요청했죠. 설정에 필요한 것이 있으면 한 번에 하나씩 물어보고, 지난 일을 질문하면 저장된 기록부터 확인한 후 답하라고도 일러두었습니다. 나머지 설정은 AI가 맞춰 주는 방식입니다.\n\n사용하는 방법도 간단합니다. 회의가 끝나면 그날 결정한 내용을 위키에 남기라고 합니다. 광고 성과를 정리한 날에는 이번 달 성과와 달라진 점을, 업체와 문제가 생긴 날에는 해당 업체와 관련된 내용을 기록하게 하죠. 몇 달 뒤 상사가 당시의 결정 이유나 매출을 물으면 AI에게 위키에서 찾아보라고 하면 됩니다. 여러 프로젝트를 동시에 관리하는 사람일수록 편리함을 크게 느낀다고 하네요.\n\n여러분은 이 이야기를 읽으며 ‘AI에게 내 일을 잘 기억해 달라고 하면 되는구나’라고 생각할지 모릅니다. 하지만 핵심은 조금 다릅니다. AI에게 무언가를 외워 달라고 부탁하는 것이 아니라, AI가 나중에 다시 찾아볼 수 있도록 자기 업무의 기록을 쌓는 것입니다. 그렇게 하면 몇 달 전 일을 머릿속에 붙들어 두려고 애쓰지 않아도 되죠. 기록은 옵시디언에 남기고, 필요한 내용을 찾아 꺼내는 일은 AI에게 맡기는 겁니다.\n\nAI를 써 봤지만 별 도움이 되지 않았다는 분들이 적지 않은데요, 저는 그 이유의 상당 부분이 여기에 있다고 봅니다. AI는 세상일에 관해서는 제법 많은 것을 압니다. 하지만 우리 팀이 지난 분기에 무엇을 결정했고 왜 그렇게 결정했는지는 우리가 알려 주지 않으면 알 수 없죠. 그러니 질문할 때마다 사정을 처음부터 설명해야 합니다. 이것이 번거로워 대충 질문하면 그럴듯하지만 별 쓸모없는 답을 얻게 되겠죠. 그러고는 “AI, 생각보다 별로네.”라고 평가합니다.\n\n그렇다면 AI에게 우리 업무를 기억해 달라고 부탁하면 해결될까요? ‘기억을 부탁하는 것’과 ‘기록을 남기는 것’의 차이를 먼저 생각해 보기 바랍니다. 기억을 부탁한다는 것은 내 업무의 맥락을 통째로 AI에게 맡긴다는 뜻입니다. 반면 기록을 쌓으면 맥락은 내가 관리하면서 필요한 내용을 찾는 일에 AI를 활용할 수 있죠. 파일로 남긴 기록은 여러분이 직접 열어 볼 수 있습니다. 틀린 내용은 고칠 수 있고, 필요하면 동료에게 그대로 보여 줄 수도 있고요.\n\n앞서 상사가 던진 두 질문으로 돌아가 보겠습니다. 하나는 ‘왜’를, 다른 하나는 ‘얼마’를 묻는 질문인데요, 어느 쪽을 더 빨리 잊게 될까요? 바로 ‘왜’입니다. 숫자는 어느 보고서에라도 남아 있을지 모릅니다. 하지만 결정의 이유는 회의실을 나서는 순간부터 흐려지기 시작하죠.\n\n앞선 사례에서 기록을 남기는 시점을 살펴보기 바랍니다. 회의가 끝난 직후, 성과를 정리한 날, 업체 문제가 발생한 날입니다. 일이 벌어졌을 때 결정한 내용과 변경 사항을 적어 두는 것이죠. 기억이 가장 선명할 때 남긴 몇 줄이 몇 달 뒤에는 흐릿해진 기억을 대신해 답해 주는 겁니다.\n\n흩어진 자료를 정리해 일하는 방식을 바꾼 사례도 있습니다. 기획서와 회의록, 공부한 내용이 여러 폴더와 메모장, 카톡방에 흩어져 있어 필요한 자료를 늘 찾아 헤맸다고 합니다. 하루 열 시간을 들여 AI 도구를 배우고 며칠에 걸쳐 일하는 방식을 바꾼 뒤에는 무엇이든 기억하고 챙겨 주는 비서가 생긴 것 같았다고 하네요.\n\n그 비서는 어떻게 업무를 챙겨 주는 걸까요? 무엇이 달라졌는지 살펴보면 그 비서의 솜씨 역시 기록에서 나온다는 것을 알 수 있습니다. 흩어져 있던 자료를 하나의 폴더 체계로 모으고, 아침에 일일 노트를 열면 전날 정리한 ‘내일의 우선순위’가 나타나도록 했죠. 비서가 아침마다 보여 주는 것은 결국 어제 자신이 남긴 메모인 겁니다.\n\nAI 시대에 일을 잘하기 위해 필요한 것은 지난 일을 빠짐없이 기억하는 능력일까요? 나중에 꺼내 쓸 수 있도록 기록을 남기는 습관에 더 주목하기 바랍니다. 같은 AI를 사용하더라도 업무 기록을 쌓아 둔 사람은 자기 일에 맞는 답을 얻을 수 있습니다. 반면 찾아볼 기록이 없는 사람은 누구에게나 적용될 만한 일반론을 듣게 되겠죠. AI가 우리 일을 알아서 기억할 만큼 똑똑해지기를 기다릴 필요가 없습니다. AI가 찾아볼 자료를 우리가 먼저 마련하면 됩니다.\n\n시작부터 거창할 필요는 없습니다. 오늘 회의가 끝나면 무엇을 결정했고 왜 그렇게 결정했는지 몇 줄로 남겨 보세요. 현장에서 내린 판단이나 협력사와 나눈 통화도 마찬가지입니다. 회사의 보안 기준이 허락하는 범위에서 이런 기록을 한곳에 모아 두기 바랍니다. 그래야 몇 달 뒤 누군가 당시의 일을 물었을 때 기억을 더듬는 대신 AI에게 기록을 찾아보라고 할 수 있겠죠.\n\n따로 말하지 않아도 기록이 남도록 자동화하는 방법도 있습니다. 하지만 이런 자동화가 효과를 발휘하려면 무엇을 남겨야 하는지 알고 기록하는 습관이 먼저 갖춰져야 합니다. AI의 도움을 얻고 싶다면 AI에게 기억을 부탁하기 전에, 여러분이 오늘 n\n이 직장인이 언제 기록을 남기는지 살펴보기 바랍니다. 회의가 끝난 직후, 성과를 정리한 날, 업체 문제가 발생한 날입니다. 일이 벌어졌을 때 결정한 내용과 변경 사항을 적어 두는 것이죠. 기억이 가장 선명할 때 남긴 몇 줄이 몇 달 뒤에는 흐릿해진 기억을 대신해 답해 주는 겁니다.\n\n비슷한 이야기를 링크드인에서도 찾아볼 수 있습니다. 한 비개발자 마케팅 매니저는 기획서와 회의록, 공부한 내용이 여러 폴더와 메모장, 카톡방에 흩어져 있어 필요한 자료를 늘 찾아 헤맸다고 합니다. 이분은 하루 열 시간을 들여 AI 도구를 배우고 며칠에 걸쳐 일하는 방식을 바꿨는데요, 그 결과를 무엇이든 기억하고 챙겨 주는 비서가 생긴 것에 빗댑니다.\n\n그 비서는 어떻게 업무를 챙겨 주는 걸까요? 무엇이 달라졌는지 살펴보면 그 비서의 솜씨 역시 기록에서 나온다는 것을 알 수 있습니다. 이분은 흩어져 있던 자료를 하나의 폴더 체계로 모았습니다. 아침에 일일 노트를 열면 전날 정리한 ‘내일의 우선순위’가 나타나도록 했죠. 비서가 아침마다 보여 주는 것은 결국 어제 자신이 남긴 메모인 겁니다.\n\nAI 시대에 일을 잘하기 위해 필요한 것은 지난 일을 빠짐없이 기억하는 능력일까요? 나중에 꺼내 쓸 수 있도록 기록을 남기는 습관에 더 주목하기 바랍니다. 같은 AI를 사용하더라도 업무 기록을 쌓아 둔 사람은 자기 일에 맞는 답을 얻을 수 있습니다. 반면 찾아볼 기록이 없는 사람은 누구에게나 적용될 만한 일반론을 듣게 되겠죠. AI가 우리 일을 알아서 기억할 만큼 똑똑해지기를 기다릴 필요가 없습니다. AI가 찾아볼 자료를 우리가 먼저 마련하면 됩니다.\n\n시작부터 거창할 필요는 없습니다. 오늘 회의가 끝나면 무엇을 결정했고 왜 그렇게 결정했는지 몇 줄로 남겨 보세요. 현장에서 내린 판단이나 협력사와 나눈 통화도 마찬가지입니다. 회사의 보안 기준이 허락하는 범위에서 이런 기록을 한곳에 모아 두기 바랍니다. 그래야 몇 달 뒤 누군가 당시의 일을 물었을 때 기억을 더듬는 대신 AI에게 기록을 찾아보라고 할 수 있겠죠.\n\n글쓴이는 따로 말하지 않아도 기록이 남도록 하는 방법이 있다고 예고합니다. 하지만 이런 자동화가 효과를 발휘하려면 무엇을 남겨야 하는지 알고 기록하는 습관이 먼저 갖춰져야 합니다. AI의 도움을 얻고 싶다면 AI에게 기억을 부탁하기 전에, 여러분이 오늘 남겨야 할 기록부터 살펴보기 바랍니다.", "m": {"대비": 2, "나열": 0, "선언": 1, "번역투": 0, "분량": 2197}}, {"key": "t1-C-draft", "group": "C1", "label": "t1-C · (중간) Claude 초안", "desc": "한 줄: AI에게 '기억해 달라'고 부탁하기보다, 나중에 AI가 다시 찾아볼 수 있게 내 일의 기록을 쌓아 두는 사람이 AI 덕을 본다. | 원문: Threads, 업무 자동화를 공유하는 직장인, 2026-09-15 / LinkedIn, 마케팅 커뮤니케이션 매니저(비개발자), 2026-09", "title": "AI에게 기억을 부탁하지 말고, 기록을 남기세요", "body": "몇 달 전에 끝난 일을 두고 상사가 불쑥 묻습니다. 그 업체와는 왜 그런 방향으로 정리했느냐고요. 그 무렵 매출이 어느 정도였는지도 묻습니다. 머릿속을 더듬어 봐도 떠오르는 건 그날 회의실 분위기 정도입니다. 메일함을 거슬러 올라가고, 메신저 대화방을 뒤지고, 이 폴더 저 폴더를 열어 보다가 결국 \"확인해서 다시 말씀드리겠습니다\"라고 답하죠. 한 번쯤은 겪어 보셨을 겁니다.\n\n최근 SNS에 업무 자동화 요령을 연재한 한 직장인은 이런 질문을 받아도 허둥대지 않습니다. AI에게 자기 위키를 뒤져 보라고 한마디 하면 그걸로 끝이라고 하거든요.\n\n비결은 생각보다 소박합니다. 이 직장인은 옵시디언이라는 메모 앱을 업무 위키로 씁니다. 회의 내용, 결정 사항, 진행 상황, 주요 데이터를 서로 이어 붙여 차곡차곡 쌓아 가는, 자기 일만 담긴 사전인 셈이죠. 세팅은 AI에게 맡겼습니다. 앱을 깐 뒤 AI 도구인 코덱스(Codex)에게 부탁을 하나 보냈을 뿐입니다. 자기는 비개발자이니 구조는 되도록 단순하게 짜 달라고 했습니다. 설정하다 필요한 게 생기면 한 번에 하나씩 물어봐 달라고 했고요. 그리고 지난 일을 물으면 쌓아 둔 기록부터 확인한 다음 대답하라고 일러두었습니다. 나머지는 AI가 알아서 맞춰 준다는 게 글쓴이의 설명입니다.\n\n쓰는 법은 더 간단합니다. 회의가 끝나면 그날 정해진 것을 위키에 남기라고 말합니다. 광고 성과를 정리한 날엔 이번 달 성과와 달라진 점을, 업체와 문제가 생긴 날엔 그 업체에 얽힌 내용을 적어 두게 합니다. 몇 달 뒤 상사가 그때의 이유나 매출을 물어 오면 위키에서 찾아보라고 AI에게 시키면 됩니다. 프로젝트 여러 개를 한꺼번에 챙기는 사람일수록 이 편리함이 크다고 하네요.\n\n자, 이 글에서 눈여겨볼 대목은 따로 있습니다. 글쓴이는 요점이 AI에게 무언가를 외워 달라고 조르는 데 있지 않다고 말합니다. AI가 훗날 다시 들춰 볼 수 있도록 내 일의 기록을 쌓아 가는 데 있다는 것이죠. 그래서 자신은 몇 달 전 일까지 머릿속에 붙들어 두려고 애쓰지 않는다고 덧붙입니다. 기록은 옵시디언에 두고, 찾아 꺼내는 일은 AI에게 넘기는 겁니다.\n\nAI를 써 봤지만 효과가 애매했다는 분이 적지 않습니다. 저는 그 이유의 상당 부분이 여기에 있다고 봅니다. AI는 세상일에는 제법 밝습니다. 하지만 우리 팀이 지난 분기에 무엇을 왜 결정했는지는 우리가 알려 주지 않는 한 알 길이 없습니다. 그러니 물을 때마다 사정을 처음부터 설명해야 하고, 그게 번거로워 대충 물으면 대충 그럴듯한 답이 돌아오죠. 그러고는 'AI, 생각보다 별로네' 하고 결론을 내립니다.\n\n그렇다면 우리 일을 기억해 달라고 AI에게 부탁하면 될까요? 기억을 부탁하는 건 내 일의 맥락을 통째로 AI에게 맡기는 일입니다. 기록을 쌓는 건 맥락은 내 손에 쥔 채 찾는 일만 AI에게 시키는 것이고요. 파일로 남은 기록은 내가 열어 볼 수 있고, 틀린 곳은 고칠 수 있고, 필요하면 동료에게 그대로 보여 줄 수도 있습니다.\n\n상사의 두 질문을 다시 보죠. 하나는 '왜'를, 다른 하나는 '얼마'를 묻습니다. 둘 중 더 빨리 증발하는 건 '왜'입니다. 숫자는 어느 보고서 한구석에라도 남아 있을지 모릅니다. 하지만 결정의 이유는 회의실 문을 나서는 순간부터 흐려지거든요. 이 직장인이 언제 기록하는지 보세요. 회의가 끝난 직후, 성과를 정리한 날, 업체 문제가 불거진 날입니다. 일이 벌어진 바로 그 자리에서 결정과 변경 사항을 적어 둡니다. 기억이 가장 선명할 때 남긴 몇 줄이 몇 달 뒤 흐릿해진 기억을 대신해 답하는 것이죠.\n\n비슷한 장면은 다른 곳에서도 보입니다. 링크드인에 글을 올린 한 비개발자 마케팅 매니저는 기획서, 회의록, 공부한 내용이 이 폴더 저 폴더와 메모장, 카톡방에 나뉘어 있어 늘 찾아 헤맸다고 털어놓습니다. 하루 열 시간을 들여 AI 도구를 배우고 며칠에 걸쳐 일하는 방식을 바꾼 뒤, 이분은 그 결과를 무엇이든 기억하고 챙겨 주는 비서에 빗댑니다. 그런데 무엇이 달라졌는지 들여다보면 그 비서의 솜씨도 기록에서 나옵니다. 흩어졌던 자료를 하나의 폴더 체계로 모았습니다. 아침에 일일 노트를 열면 전날 정리해 둔 '내일의 우선순위'가 올라와 있고요. 비서가 아침마다 내미는 건 결국 어제의 내가 적어 둔 메모입니다.\n\nAI 시대에 일 잘하는 사람의 무기는 기억력이 아닙니다. 나중에 꺼내 쓸 수 있게 남겨 둔 기록이 진짜 무기입니다. 같은 AI를 쓰더라도 쌓아 둔 기록이 있는 사람은 자기 일에 맞는 답을 얻고, 그렇지 않은 사람은 누구에게나 할 법한 일반론을 듣게 될 겁니다. AI가 우리 일을 알아서 기억할 만큼 똑똑해지기를 기다릴 이유는 없습니다. AI가 찾아볼 거리를 우리가 먼저 마련해 두면 됩니다.\n\n시작은 작아도 됩니다. 오늘 회의가 끝나면 정해진 것과 그렇게 정한 이유를 몇 줄로 남겨 보세요. 현장에서 내린 판단이든, 협력사와 나눈 통화든 마찬가지입니다. 회사 보안 기준이 허락하는 범위 안에서 그런 기록을 한곳에 모아 두세요. 그러면 몇 달 뒤 누가 그때 일을 물어도 기억을 쥐어짜는 대신 AI에게 찾아보라고 하면 됩니다. 글쓴이는 따로 말하지 않아도 기록이 남게 하는 방법이 있다고 예고합니다. 하지만 자동화가 힘을 쓰려면 무엇을 남길지 아는 습관이 먼저입니다. 기억하려 애쓰는 사람보다 꺼내 쓸 수 있게 남겨 두는 사람이 AI 덕을 봅니다.", "m": {"대비": 3, "나열": 0, "선언": 1, "번역투": 0, "분량": 1945}}, {"key": "t2-A-final", "group": "C2", "label": "t2-A · A 확정본 절차 · 최종", "desc": "한 줄: AI로 할 수 있는 일이 늘수록, 무엇을 만들고 무엇을 버릴지 판단하는 내 기준이 실력이 된다. AI를 잘 쓰게 됐다는 것과 실력이 늘었다는 것은 같은 말이 아니다. | 원문: LinkedIn, 프로덕트 디자인 디렉터, 2026-09-12 / Threads, 기업 AI 교육 강사, 2026-03-06 (18편 중 5~9편) | 재작성 참고: p752·p716", "title": "AI를 잘 쓰면 여러분의 실력도 늘어날까요?", "body": "아이디어가 떠올라도 “내가 직접 만들 수는 없는 일이야.”라며 접어 둔 적이 있습니까? 프로덕트 디자인 업무에 AI를 활용해 그런 아이디어를 직접 만들어 본 사례가 있습니다. 개발자가 없으면 만들 수 없다고 생각했던 일을, 이제는 자료를 조사하고 구조를 잡는 것부터 글과 이미지를 만들고 코드를 써서 실제로 작동시키는 것까지 직접 해본다고 합니다.\n\n디자인 업무에서는 잘하는 것 하나를 깊게 파는 일이 중요합니다. 화면을 잘 그리고 사용자의 문제를 해결하는 일만 해도 익숙해지기까지 오랜 시간이 필요하니까요. 하지만 시니어가 되면 화면을 잘 만드는 것만으로는 충분하지 않습니다. 사업 구조와 데이터를 알아야 하고, 개발자와 구현 범위를 협의해야 하며, 브랜드도 챙겨야 하죠. 여기에 AI까지 등장하니 할 수 있는 일의 범위가 한층 넓어졌습니다. 이 변화만 보면 한 분야를 깊이 아는 것보다 여러 분야를 두루 다루는 쪽으로 디자이너의 일이 바뀌는 듯합니다.\n\n그런데 AI 활용에서 눈여겨볼 점은 오히려 그 반대입니다. 할 줄 아는 일이 많아질수록 그중에서 ‘정말 잘하는 한 가지’가 더욱 중요해진다는 것이죠.\n\n왜 그럴까요? AI를 활용하면 만들 수 있는 것이 거의 끝없이 늘어납니다. 마음에 들지 않는 초안은 다시 만들어 달라고 하면 그만이죠. 하지만 “무엇을 만들어야 하는가?”, “이 결과물은 좋은가?”, “어디서 멈추고 무엇을 덜어내야 하는가?”라는 질문에는 누가 답해야 할까요? AI가 대신 만들어 준다고 해서 이런 판단까지 대신해 주는 것은 아닙니다. 만들기가 쉬워질수록 무엇을 만들고 남길지를 판단하는 일은 사람에게 더 중요해지는 것이죠.\n\n앞선 사례에서 중요한 변화도 코드를 쓸 수 있게 된 것 자체에 있지는 않습니다. 오랫동안 디자인을 하며 쌓아 온 감각과 판단을 화면 안에만 머물게 하지 않고, 실제로 작동하는 결과물까지 이어 갈 수 있게 됐다는 점이죠. AI가 다른 직업인으로 바꾼 것이 아니라, 늘 해 오던 일을 더 멀리까지 펼칠 수 있게 해준 셈입니다.\n\n저는 여기에 이 이야기의 핵심이 있다고 생각합니다. 코드를 쓰는 손은 AI가 빌려줬지만, 그 손으로 무엇을 만들지 판단하는 눈은 이미 오랫동안 디자인을 하며 길러 둔 것이죠. 그렇기에 ‘AI를 잘 쓰게 됐다’는 말과 ‘실력이 늘었다’는 말을 같은 뜻으로 받아들여서는 안 됩니다. 할 수 있는 일의 범위가 넓어지는 것과 무엇을 해야 하는지 판단하는 능력이 깊어지는 것은 서로 다른 변화니까요. 판단하는 눈은 그대로인데 손이 닿는 범위만 넓어진다면, 더 많이, 더 빨리 만들 수는 있어도 더 잘 만든다고 말하기는 어렵겠죠.\n\n여러분은 어떻습니까? AI로 보고서 초안을 작성하고, 표를 정리하고, 메일 문장을 다듬고 있습니까? 그렇다면 AI의 도움으로 코드를 쓸 수 있게 된 것과 같은 변화를 경험하고 있는 겁니다. 반가운 일이지만 그것만으로 여러분의 실력이 늘었다고 보기는 어렵습니다. AI를 써 봤는데 생각만큼 효과가 크지 않다고 느꼈다면, 어쩌면 이 차이 때문일지도 모릅니다. 만들어 내는 양은 늘었지만 그중 무엇을 남겨야 하는지 판단하는 기준은 그대로였을 수 있으니까요.\n\n그렇다면 그 기준은 어디에서 생길까요? 한 직무에서 3~5년쯤 일하면 말로 모두 설명하기 어려운 그 사람만의 감각이 생긴다고 합니다. 흔히 ‘암묵지’라고 부르는 것이죠.\n\n그런데 어떤 일을 AI에 맡길수록 정작 그 일을 해내는 능력을 유지하고 키우기는 어려워질 수 있습니다. AI 없이 직접 자료를 조사하려면 12시간 넘게 걸릴 텐데, 그 일을 해낼 자신이 없다는 경험담도 있습니다. 기업의 AI 교육 현장에서도 자신이 가진 암묵지를 제대로 정리하지 못하는 사람이 상당수 있다고 하네요.\n\n이런 점들을 함께 놓고 보면 무엇이 중요할지 알 수 있습니다. 앞선 디자인 사례에서 AI를 활용해 할 수 있는 일의 범위를 넓힐 수 있었던 데는 그 전에 오랫동안 쌓아 둔 판단이 있었습니다. 그런 판단은 직접 만들어 보고, 그중에서 고르고, 버리는 경험을 거치며 자라는 것이죠. 그런데 이 과정을 통째로 AI에 맡겨 버리면 어떻게 될까요? 손이 닿는 범위는 넓어지겠지만, 무엇을 남겨야 하는지 판단하는 눈이 자랄 기회는 줄어들 겁니다. AI를 잘 쓰게 되는 속도와 여러분의 실력이 느는 속도가 어긋나는 이유가 여기에 있습니다.\n\nAI가 대신 만들어 주는 것이 많아질수록 사람의 실력은 무엇을 만들었느냐보다 그중 무엇을 골랐느냐에서 드러납니다. 다음에 AI가 결과물을 내놓으면 곧바로 사용하기 전에 한 가지를 해보기 바랍니다. 무엇을 버릴지 먼저 고르고, 그것을 왜 버리려는지 한 문장으로 적어 보세요.\n\n그 문장이 잘 써지지 않습니까? 그렇다면 다듬어야 할 것은 AI를 다루는 요령이 아니라 여러분의 판단 기준일 겁니다. 반대로 그 문장이 갈수록 또렷해진다면, 그때는 여러분의 실력이 늘고 있다고 말할 수 있겠죠. AI가 얼마나 많이 만들어 주는지보다 여러분이 무엇을 왜 버리는지에 주의를 기울이기 바랍니다.", "m": {"대비": 6, "나열": 0, "선언": 0, "번역투": 0, "분량": 1819}}, {"key": "t2-A-r4", "group": "C2", "label": "t2-A · A 확정본 절차 · (중간) astra 재작성", "desc": "기준 반영 전 단계", "title": "AI를 잘 쓰면 여러분의 실력도 늘어날까요?", "body": "아이디어가 떠올라도 “개발자가 없으면 만들 수 없는 일이야.”라며 접어 두던 한 프로덕트 디자인 디렉터가 있습니다. 그런데 요즘은 그런 아이디어를 직접 만들어 본다고 링크드인에 썼는데요, 자료를 조사하고 구조를 잡는 것부터 글과 이미지를 만들고 코드를 써서 실제로 작동시키는 것까지 한다고 합니다. 사업을 시작하고 AI를 본격적으로 활용하면서 생긴 변화라고 하네요.\n\n이 디자이너는 주니어 시절에 잘하는 것 하나를 깊게 파는 것이 중요하다고 믿었습니다. 화면을 잘 그리고 사용자의 문제를 해결하는 일만 해도 익숙해지기까지 오랜 시간이 필요했으니까요. 하지만 시니어가 되자 화면을 잘 만드는 것만으로는 충분하지 않았습니다. 사업 구조와 데이터를 알아야 했고, 개발자와 구현 범위를 협의해야 했으며, 브랜드도 챙겨야 했죠. 여기에 AI까지 등장하니 할 수 있는 일의 범위가 한층 넓어졌습니다. 처음에는 이 디자이너도 한 분야를 깊이 아는 것보다 여러 분야를 두루 다루는 쪽으로 디자이너의 일이 바뀌는 모양이라고 생각했답니다.\n\n그런데 AI를 쓰면 쓸수록 오히려 반대의 결론에 이르렀다고 합니다. 할 줄 아는 일이 많아질수록 그중에서 ‘정말 잘하는 한 가지’가 더욱 중요해지더라는 것이죠.\n\n왜 그럴까요? AI를 활용하면 만들 수 있는 것이 거의 끝없이 늘어납니다. 마음에 들지 않는 초안은 다시 만들어 달라고 하면 그만이죠. 하지만 “무엇을 만들어야 하는가?”, “이 결과물은 좋은가?”, “어디서 멈추고 무엇을 덜어내야 하는가?”라는 질문에 엇을 왜 버리는지 살펴보기 바랍니다.", "m": {"대비": 5, "나열": 0, "선언": 0, "번역투": 0, "분량": 1894}}, {"key": "t2-C-final", "group": "C2", "label": "t2-C · C 다른 각도 · 최종", "desc": "한 줄: AI에 맡긴 일은 조금씩 내 손에서 빠져나간다. AI 없이는 못 하게 된 일이 생겼다면, 무엇을 맡기고 무엇을 내 손에 남길지 정해야 한다. | 원문: Threads, 기업 AI 교육 강사, 2026-03-06 (18편 중 5~9편) / LinkedIn, 프로덕트 디자인 디렉터, 2026-09-12 | 재작성 참고: p752·p716", "title": "AI 없이도 그 일을 해낼 수 있습니까?", "body": "지금 누군가 AI 없이 직접 자료 조사를 해오라고 한다면 어떨까요? 얼마나 시간이 걸릴지, 그만큼 시간을 들이면 해낼 수 있을지 자신 있게 답할 수 있나요? AI에 깊이 의존하며 일하고 있다면 선뜻 답하기 어려울지도 모릅니다.\n\n“AI를 너무 많이 써서 그런 것 아니야?”라고 생각할지 모르겠습니다. 하지만 저는 AI에게 일을 많이 맡길수록 누구나 언젠가 마주할 수 있는 상황이라고 봅니다.\n\nAI의 도움이 코딩 실력 향상에 어떤 영향을 미치는지 다룬 앤트로픽의 글을 보며 생각해 볼 질문이 있습니다. AI 덕분에 일하는 속도가 빨라진 것은 분명합니다. 그렇다면 이것을 개인과 조직의 생산성이 높아졌다는 뜻으로 받아들여도 될까요? 문서와 코드를 빨리 만들어낸다고 해서 그것이 곧 성과가 되는지 따져봐야 한다는 겁니다.\n\n여기서 짚어볼 것이 ‘인지적 오프로딩(cognitive offloading)의 딜레마’입니다. 오프로딩은 짐을 내려놓는다는 뜻인데요, 여기서는 머리로 하던 일의 일부를 기계에 맡기는 것을 말합니다. 문제는 기계에 맡기는 부분이 늘어날수록 그 일을 스스로 해내는 능력을 유지하거나 키우기가 어려워진다는 데 있습니다. 코딩뿐만 아니라 다른 업무에도 해당하는 이야기죠.\n\n더 눈여겨봐야 할 것은 이런 변화가 좀처럼 눈에 띄지 않는다는 점입니다. AI에게 맡긴 일은 여전히 잘 진행됩니다. 오히려 더 빠르고 매끄럽게 끝나죠. 결과물이 잘 나오니 그 일을 해내던 자신의 능력이 약해지고 있는지 알아차리기 어렵습니다. AI 없이 직접 해보기 전까지는 말입니다.\n\n그렇다면 어떻게 해야 할까요? 일을 ‘적당히’ 나눠 맡기면 됩니다. 하지만 막상 실천하려고 하면 이 ‘적당히’가 가장 어렵습니다. 무엇을 AI에게 맡기고 무엇을 직접 해야 할지 결정하려면, 자신의 업무에서 진짜 자기 몫이 무엇인지부터 알아야 하니까요.\n\n여기에 또 하나의 문제가 있습니다. 조직에 AI를 도입하면 ‘암묵지(tacit knowledge)’의 문제를 만나게 된다는 것인데요, 암묵지는 몸으로 익힌 요령이나 오랜 경험에서 얻은 감각처럼 알고는 있지만 말이나 글로 설명하기 어려운 지식을 뜻합니다.\n\n한 가지 일을 3~5년 정도 하다 보면 누구에게나 설명하기 어려운 감각이 생긴다고 합니다. AI의 디자인과 코딩 능력이 아무리 좋아져도 오랫동안 다듬어진 디자이너의 눈이나 노련한 시니어 개발자의 집요한 최적화를 따라잡기는 어렵다는 것이죠. 물론 몇 년 뒤에도 그럴 것인지는 장담할 수 없습니다. 다만 지금은 AI에게 통째로 맡길 수 없는 판단이 남아 있다는 겁니다.\n\n저는 이 감각이 ‘적당히’의 기준을 정하는 실마리라고 생각합니다. 여러분에게도 그런 감각이 있을 겁니다. 어떻게 하는지 설명해 보라면 막막하지만, 실제로 일을 하다 보면 무엇이 문제인지 손이 먼저 알아채는 경우 말입니다. 바로 그 감각이 작동하는 부분을 여러분의 몫으로 남겨둬야 합니다. 그 부분까지 AI에게 맡긴다면 인지적 오프로딩의 딜레마는 여러분이 오래 쌓아온 감각에도 영향을 미치겠죠.\n\n물론 이렇게 나누는 일이 쉽지는 않습니다. AI 활용 교육 현장에서도 자신의 노하우를 제대로 정리해 둔 사람은 드물었다고 합니다. 당장 해야 할 일에 쫓기는 직원들에게 자신의 감각을 하나하나 글로 풀어놓을 여유가 있기는 어렵겠죠. 여기에 AI에게 어떤 순서와 흐름으로 일을 맡길지 설계하는 낯선 과제까지 주어지니 부담이 커지는 겁니다.\n\n반대로 이런 지식이 잘 정리돼 있으면 AI 도구 하나만으로도 생산성을 높일 수 있습니다. 여러분이 AI를 써봤는데도 효과가 뚜렷하지 않았다면, 도구가 부족해서가 아니라 자신의 업무를 충분히 들여다볼 시간이 부족했기 때문일지도 모릅니다.\n\n저는 노하우를 정리하는 과정이 곧 ‘무엇을 맡기고 무엇을 남길지’ 결정하는 과정이라고 봅니다. 자신의 노하우를 글로 옮겨보세요. 정리해서 AI에게 전달할 수 있는 부분이 있을 것이고, 여전히 여러분이 직접 판단해야 하는 부분도 드러날 겁니다.\n\n한 프로덕트 디자인 디렉터의 이야기도 같은 점을 보여줍니다. AI 덕분에 리서치와 글쓰기, 이미지 제작은 물론 실제로 작동하는 코드까지 직접 만들어보게 됐다고 합니다. 그런데 할 수 있는 일이 늘어날수록 자신의 중심이 어디에 있는지를 더 분명히 알아야 했다고 하네요. AI가 쏟아내는 결과물 중 무엇을 쓰고 무엇을 버릴지 결정할 기준은 결국 자신에게서 나와야 했기 때문입니다.\n\nAI 없이는 할 수 없게 된 일이 생겼다는 사실 자체를 실패라고 생각할 필요는 없습니다. 모든 일을 직접 할 수도 없고, 그럴 필요도 없으니까요. 문제는 여러분이 맡기겠다고 결정한 적도 없는데 어느새 스스로 해내기 어려워진 일이 있다는 것입니다. AI에게 일을 맡기는 것은 여러분의 선택이어야 합니다. 습관적으로 맡기다 보니 그렇게 된 것이어서는 곤란하겠죠.\n\n그 선택의 기준은 무엇이어야 할까요? 저는 “AI가 내놓은 결과가 틀렸을 때 내가 알아챌 수 있는가?”를 물어야 한다고 생각합니다. 틀린 부분을 알아챌 수 있다면 맡겨도 좋습니다. 하지만 자신 있게 답하기 어렵다면, 그 업무에는 여러분이 직접 붙들고 있어야 할 판단이 들어 있다는 뜻입니다.\n\n이번 주에 AI에게 맡기고 있는 일을 적어보기 바랍니다. 그리고 각각의 업무에 이렇게 물어보세요. “AI 없이도 지금 이 일을 해낼 수 있는가?” 만약 ‘아니요’라는 답이 나온다면 질문을 하나 더 던져야 합니다. “AI가 틀렸을 때 나는 그것을 가려낼 수 있는가?” 이 질문에도 답이 망설여진다면, 바로 그 일이 여러분이 다시 직접 해봐야 할 일입니다.\n\nAI에게 맡기면 일은 빨라집니다. 하지만 여러분의 실력으로 쌓이는 것은 직접 판단하고 수행하며 자기 몫으로 남겨둔 일입니다. 무엇을 남길지는 AI가 정해주지 않습니다. 여러분이 결정하기 바랍니다.", "m": {"대비": 2, "나열": 0, "선언": 0, "번역투": 0, "분량": 2139}}, {"key": "t2-C-r4", "group": "C2", "label": "t2-C · C 다른 각도 · (중간) astra 재작성", "desc": "기준 반영 전 단계", "title": "AI 없이도 그 일을 해낼 수 있습니까?", "body": "기업을 찾아다니며 직원들에게 AI 활용법을 가르치는 강사가 있습니다. 이 강사가 올해 3월 스레드에 올린 연재에는 눈길을 끄는 고백이 하나 등장하는데요, 지금 누군가 AI 없이 직접 자료 조사를 해오라고 하면 열두 시간은 넘게 걸릴 것 같다는 겁니다. 그만큼 시간을 들여도 해낼 수 있을지 장담하지 못하겠다고 하네요. AI에 깊이 의존하며 일하는 사람이라면 대개 공감할 것이라는 말도 덧붙였습니다.\n\n남에게 AI 쓰는 법을 가르치는 사람이 정작 AI 없이는 일을 해낼 자신이 없다고 말한 겁니다. 여러분은 이 고백을 어떻게 받아들이나요?\n\n“AI를 너무 많이 써서 그런 것 아니야?”라고 생각할지 모르겠습니다. 하지만 저는 AI에게 일을 많이 맡길수록 누구나 언젠가 마주할 수 있는 상황이라고 봅니다. 이 강사는 그 상황을 조금 먼저 들여다본 것이겠죠.\n\n강사는 AI의 도움이 코딩 실력 향상에 어떤 영향을 미치는지 다룬 앤트로픽의 글을 소개하며 질문을 던집니다. AI 덕분에 일하는 속도가 빨라진 것은 분명합니다. 그렇다면 이것을 개인과 조직의 생산성이 높아졌다는 뜻으로 받아들여도 될까요? 문서와 코드를 빨리 만들어낸다고 해서 그것이 곧 성과가 되는지 따져봐야 한다는 겁니다.\n\n강사가 그 글에서 전하는 답은 ‘인지적 오프로딩(cognitive offloading)의 딜레마’입니다. 오프로딩은 짐을 내려놓는다는 뜻인데요, 여기서는 머리로 하던 일의 일부를 기계에 맡기는 것을 말합니다. 문제는 기계에 맡기는 부분이 늘어날수록 그 일을 스스로 해내는 능력을 유지하거나 키우기가 어려워진다는 데 있습니다. 코딩뿐만 아니라 다른 업무에도 해당하는 이야기죠.\n\n더 눈여겨봐야 할 것은 이런 변화가 좀처럼 눈에 띄지 않는다는 점입니다. AI에게 맡긴 일은 여전히 잘 진행됩니다. 오히려 더 빠르고 매끄럽게 끝나죠. 결과물이 잘 나오니 그 일을 해내던 자신의 능력이 약해지고 있는지 알아차리기 어렵습니다. AI 없이 직접 해보기 전까지는 말입니다. 강사가 열두 시간이라는 숫자를 떠올린 것도 AI를 쓰지 못하는 상황을 가정해 봤기 때문이겠죠.\n\n그렇다면 어떻게 해야 할까요? 강사의 답은 간단합니다. 일을 ‘적당히’ 나눠 맡기면 된다는 겁니다. 하지만 막상 실천하려고 하면 이 ‘적당히’가 가장 어렵습니다. 무엇을 AI에게 맡기고 무엇을 직접 해야 할지 결정하려면, 자신의 업무에서 진짜 자기 몫이 무엇인지부터 알아야 하니까요.\n\n강사는 여기에 또 하나의 문제를 제기합니다. 조직에 AI를 도입하면 ‘암묵지(tacit knowledge)’의 문제를 반드시 만나게 된다는 것인데요, 암묵지는 몸으로 익힌 요령이나 오랜 경험에서 얻은 감각처럼 알고는 있지만 말이나 글로 설명하기 어려운 지식을 뜻합니다.\n\n강사에 따르면 한 가지 일을 3~5년 정도 하다 보면 누구에게나 설명하기 어려운 감각이 생긴다고 합니다. AI의 디자인과 코딩 능력이 아무리 좋아져도 오랫동안 다듬어진 디자이너의 눈이나 노련한 시니어 개발자의 집요한 최적화를 따라잡기는 어렵다는 것이죠. 물론 몇 년 뒤에도 그럴 것인지는 강사도 장담하지 않습니다. 다만 지금은 AI에게 통째로 맡길 수 없는 판단이 남아 있다는 겁니다.\n\n저는 이 감각이 ‘적당히’의 기준을 정하는 실마리라고 생각합니다. 여러분에게도 그런 감각이 있을 겁니다. 어떻게 하는지 설명해 보라면 막막하지만, 실제로 일을 하다 보면 무엇이 문제인지 손이 먼저 알아채는 경우 말입니다. 바로 그 감각이 작동하는 부분을 여러분의 몫으로 남겨둬야 합니다. 그 부분까지 AI에게 맡긴다면 인지적 오프로딩의 딜레마는 여러분이 오래 쌓아온 감각에도 영향을 미치겠죠.\n\n물론 이렇게 나누는 일이 쉽지는 않습니다. 강사가 현장에서 직원들에게 AI를 활용하도록 도우며 느낀 것도 생각보다 어렵고 부담이 갈수록 커진다는 점이었습니다. 수백 시간 넘게 강의하면서 교육생들과 이야기를 나눠봤지만, 자신의 노하우를 제대로 정리해 둔 사람은 드물었다고 합니다. 당장 해야 할 일에 쫓기는 직원들에게 자신의 감각을 하나하나 글로 풀어놓을 여유가 있기는 어렵겠죠. 여기에 AI에게 어떤 순서와 흐름으로 일을 맡길지 설계하는 낯선 과제까지 주어지니 부담이 커지는 겁니다.\n\n반대로 이런 지식이 잘 정리돼 있으면 AI 도구 하나만으로도 생산성을 높일 수 있다는 것이 강사의 말입니다. 여러분이 AI를 써봤는데도 효과가 뚜렷하지 않았다면, 도구가 부족해서가 아니라 자신의 업무를 충분히 들여다볼 시간이 부족했기 때문일지도 모릅니다.\n\n저는 노하우를 정리하는 과정이 곧 ‘무엇을 맡기고 무엇을 남길지’ 결정하는 과정이라고 봅니다. 자신의 노하우를 글로 옮겨보세요. 정리해서 AI에게 전달할 수 있는 부분이 있을 것이고, 여전히 여러분이 직접 판단해야 하는 부분도 드러날 겁니다.\n\n한 프로덕트 디자인 디렉터의 이야기도 같은 점을 보여줍니다. 이 디렉터는 AI 덕분에 리서치와 글쓰기, 이미지 제작은 물론 실제로 작동하는 코드까지 직접 만들어보게 됐다고 합니다. 그런데 할 수 있는 일이 늘어날수록 자신의 중심이 어디에 있는지를 더 분명히 알아야 했다고 하네요. AI가 쏟아내는 결과물 중 무엇을 쓰고 무엇을 버릴지 결정할 기준은 결국 자신에게서 나와야 했기 때문입니다.\n\nAI 없이는 할 수 없게 된 일이 생겼다는 사실 자체를 실패라고 생각할 필요는 없습니다. 모든 일을 직접 할 수도 없고, 그럴 필요도 없으니까요. 문제는 여러분이 맡기겠다고 결정한 적도 없는데 어느새 스스로 해내기 어려워진 일이 있다는 것입니다. AI에게 일을 맡기는 것은 여러분의 선택이어야 합니다. 습관적으로 맡기다 보니 그렇게 된 것이어서는 곤란하겠죠.\n\n그 선택의 기준은 무엇이어야 할까요? 저는 “AI가 내놓은 결과가 틀렸을 때 내가 알아챌 수 있는가?”를 물어야 한다고 생각합니다. 틀린 부분을 알아챌 수 있다면 맡겨도 좋습니다. 하지만 자신 있게 답하기 어렵다면, 그 업무에는 여러분이 직접 붙들고 있어야 할 판단이 들어 있다는 뜻입니다.\n\n이번 주에 AI에게 맡기고 있는 일을 적어보기 바랍니다. 그리고 각각의 업무에 이렇게 물어보세요. “AI 없이도 지금 이 일을 해낼 수 있는가?” 만약 ‘아니요’라는 답이 나온다면 질문을 하나 더 던져야 합니다. “AI가 틀렸을 때 나는 그것을 가려낼 수 있는가?” 이 질문에도 답이 망설여진다면, 바로 그 일이 여러분이 다시 직접 해봐야 할 일입니다.\n\nAI에게 맡기면 일은 빨라집니다. 하지만 여러분의 실력으로 쌓이는 것은 직접 판단하고 수행하며 자기 몫으로 남겨둔 일입니다. 무엇을 남길지는 AI가 정해주지 않습니다. 여러분이 결정하기 바랍니다.", "m": {"대비": 3, "나열": 0, "선언": 0, "번역투": 0, "분량": 2445}}, {"key": "t2-C-draft", "group": "C2", "label": "t2-C · (중간) Claude 초안", "desc": "한 줄: AI에 맡긴 일은 조금씩 내 손에서 빠져나간다. AI 없이는 못 하게 된 일이 생겼다면, 무엇을 맡기고 무엇을 내 손에 남길지 정해야 한다. | 원문: Threads, 기업 AI 교육 강사, 2026-03-06 (18편 중 5~9편) / LinkedIn, 프로덕트 디자인 디렉터, 2026-09-12", "title": "AI 없이도 그 일, 지금 할 수 있습니까", "body": "기업을 돌며 직원들에게 AI 쓰는 법을 가르치는 강사가 있습니다. 이 강사가 올해 3월 스레드에 올린 연재에 유난히 눈에 걸리는 고백이 하나 있었습니다. 지금 누가 AI를 빼고 자료 조사를 손수 해 오라고 하면 열두 시간은 넘게 걸릴 것 같고, 그나마도 해낼 수 있을지 장담을 못 하겠다는 겁니다. AI에 깊이 기대어 일하는 사람이라면 대개 공감할 거라는 말도 덧붙였죠.\n\n남에게 AI를 가르치는 사람이 정작 AI가 없으면 일이 안 된다고 털어놓은 셈입니다.\n\n이 고백을 AI를 지나치게 쓴 사람의 부작용쯤으로 넘기기는 쉽습니다. 하지만 저는 AI에 일을 많이 맡길수록 누구든 언젠가 마주칠 장면이라고 봅니다. 강사는 그 장면을 먼저 들여다봤을 뿐이죠.\n\n강사는 AI의 도움이 코딩 실력이 자라는 데 어떤 영향을 주는지 다룬 앤트로픽의 글을 소개하며 질문을 하나 꺼냅니다. 일하는 속도는 분명 빨라졌습니다. 그런데 그것을 개인과 조직의 생산성이 커졌다는 말로 바꿔 읽어도 될까요? 문서와 코드를 더 빨리 뽑아낸다고 그게 곧 성과가 되느냐는 물음이죠.\n\n강사가 전하는 그 글의 답은 '인지적 오프로딩(cognitive offloading)의 딜레마'입니다. 오프로딩은 짐을 내려놓는다는 뜻으로, 머리가 하던 일의 일부를 기계에 내려놓는 것을 말합니다. 그런데 기계에 넘긴 부분이 늘수록 그 부분을 스스로 해내는 힘은 붙잡아 두기도, 길러 내기도 어려워집니다. 코딩이든 다른 업무든 마찬가지입니다.\n\n더 눈여겨볼 점은 이 빠져나감이 아주 조용히 일어난다는 것입니다. 맡긴 일은 여전히 잘 굴러갑니다. 오히려 더 빠르고 매끄럽게 끝나죠. 그러니 그 일을 해내던 힘이 내 손을 떠났다는 걸 알아챌 계기가 없습니다. AI를 치워 보기 전까지는요. 강사가 열두 시간이라는 숫자를 떠올린 것도 AI 없이 해 보라는 상황을 가정해 봤기 때문입니다.\n\n그렇다면 어떻게 해야 할까요? 강사의 답은 의외로 간단합니다. 일을 적당히 나눠 맡기면 된다는 거죠. 어려운 건 이 '적당히'입니다. 무엇을 넘기고 무엇을 붙들지 가르려면 먼저 내 일 안에서 무엇이 진짜 내 몫인지 알아야 하니까요.\n\n강사는 여기에 하나를 덧붙입니다. AI를 조직에 들이면 '암묵지(tacit knowledge)'라는 문제가 반드시 따라온다는 겁니다. 몸으로 익힌 요령이나 오랜 경험에서 나온 감처럼, 머릿속엔 있는데 문장으로 옮기기 힘든 지식을 말하죠. 강사에 따르면 한 가지 일을 3~5년쯤 붙들고 있으면 저마다 설명하기 힘든 감각이 생깁니다. AI의 디자인·코딩 솜씨가 아무리 늘어도 오래 다듬은 디자이너의 눈이나 노련한 시니어 개발자의 집요한 최적화는 따라잡기 어렵다는 겁니다. 몇 년 뒤의 일은 강사도 장담하지 않습니다. 다만 지금은 AI에게 통째로 넘길 수 없는 판단이 남아 있다고 선을 긋습니다.\n\n저는 '적당히'를 가르는 실마리가 바로 이 감각에 있다고 봅니다. 여러분에게도 그런 감각이 있을 겁니다. 말로 풀어 보라면 막막한데 막상 일을 하다 보면 손이 먼저 알아채는 것들 말이죠. 내 손에 남겨야 할 것은 그 감각이 작동하는 부분입니다. 그 부분까지 AI에게 넘기면, 오프로딩의 딜레마는 정확히 그 감각을 겨누게 됩니다.\n\n물론 쉽지는 않습니다. 강사가 현장에서 직원들에게 AI를 쓰게 해 보며 느낀 것도 생각보다 힘들고 짐이 갈수록 무거워진다는 점이었습니다. 수백 시간 넘게 강의해 온 강사가 교육 중에 이야기를 나눠 보면, 자기 노하우를 제대로 정리해 둔 사람은 드물다고 합니다. 하루하루 일에 쫓기는데 그 감각을 낱낱이 글로 옮겨 둘 여유가 있을 리 없죠. 여기에 AI에게 일을 어떤 흐름으로 맡길지 설계하는 낯선 숙제까지 얹히니 짐은 오히려 커집니다. 반대로 이런 지식이 잘 정돈돼 있으면 AI 도구 하나만으로도 생산성이 오른다는 게 강사의 말입니다. AI를 써 봤는데 효과가 애매했다면, 도구가 모자랐다기보다 내 일을 들여다볼 틈이 모자랐던 것일지도 모릅니다. 그리고 저는 이 정리가 곧 무엇을 맡기고 무엇을 남길지 가르는 작업이라고 봅니다. 내 노하우를 꺼내 적다 보면 글로 옮겨 AI에게 건넬 수 있는 부분과 끝내 내 판단으로 남는 부분이 드러날 겁니다.\n\n한 프로덕트 디자인 디렉터의 이야기도 같은 곳을 가리킵니다. 이 디렉터는 AI 덕분에 리서치와 글, 이미지는 물론 실제로 돌아가는 코드까지 직접 만들어 보게 됐습니다. 그러면서 손이 닿는 범위가 넓어질수록 자기 중심이 어디인지가 더 또렷해야 했다고 말합니다. AI가 쏟아 내는 결과물 가운데 무엇이 쓸 만하고 무엇을 버릴지 가려 줄 기준은 결국 자기 안에서 나와야 했다는 겁니다.\n\n저는 AI 없이는 못 하게 된 일이 생겼다는 것 자체를 실패라고 보지 않습니다. 모든 일을 내 손으로 붙들 수도 없고, 그럴 필요도 없습니다. 문제는 내가 고른 적도 없는데 빠져나간 일이 있다는 것입니다. 맡기는 것은 선택이어야지 습관이어서는 안 됩니다.\n\n무엇을 기준으로 골라야 할까요? 저는 AI가 내놓은 결과가 틀렸을 때 내가 알아챌 수 있느냐를 봐야 한다고 생각합니다. 알아챌 수 있다면 맡겨도 좋습니다. 자신이 없다면 그 일 안에는 내 손에 남겨 두어야 할 판단이 들어 있다는 뜻입니다.\n\n이번 주에 AI에게 맡기고 있는 일을 한번 적어 보세요. 그리고 각각에 'AI 없이 지금도 이 일을 해낼 수 있는가?'를 물어보세요. '아니요'가 나온 일에는 하나를 더 물어보세요. 'AI가 틀렸을 때 나는 그걸 가려낼 수 있는가?' 여기서도 머뭇거려진다면 그곳이 다시 손을 대 봐야 할 자리입니다.\n\nAI에게 맡긴 일은 빨라지지만, 실력으로 쌓이는 건 내 손에 남긴 일입니다. 무엇을 남길지는 AI가 정해 주지 않습니다.", "m": {"대비": 2, "나열": 0, "선언": 0, "번역투": 0, "분량": 2064}}, {"key": "t3-A-final", "group": "C3", "label": "t3-A · A 확정본 절차 · 최종", "desc": "한 줄: AI 도구를 늘린다고 일이 줄지는 않는다. 일의 재료(데이터·기록·맥락)를 먼저 모아 두어야 도구가 일할 곳이 생긴다. | 원문: LinkedIn, AI 스타트업 AI 리드, 2026-10 / Threads, 중소 사업체 운영자, 2026-05-05 | 재작성 참고: p752·p716", "title": "AI 도구를 늘리기 전에 물어야 할 것", "body": "회의록을 요약해 주는 봇, 메일 초안을 써 주는 봇, 사내 문서를 찾아 답해 주는 봇. 여러분의 회사에 이런 AI 도구가 열 개쯤 생겼다고 해보세요. 직원들의 일은 얼마나 줄어들까요? 도구마다 일을 하나씩 맡기면 그만큼 여유가 생길 거라고 기대할 텐데요, 과연 그럴까요?\n\nAI 도구만 늘린다고 회사가 달라지지는 않습니다. 직원들이 화면에 띄워 놓아야 할 창만 열 개로 늘어날 뿐이죠. AI를 쓰지 말자는 뜻일까요? 그렇지 않습니다. 한 AI 스타트업에서는 도구를 하나씩 늘리는 대신, 도구들이 함께 사용할 바탕을 먼저 만들고 그 위에 모든 것을 연결했습니다.\n\n왜 공통의 바탕이 먼저 필요할까요? 새로 입사한 직원을 떠올려 보세요. 신입 사원이 회사의 사정을 익히려면 석 달쯤은 걸립니다. 어떤 일을 누가 맡고 있는지, 어느 회의에서 어떤 결정이 내려졌는지, 이 프로젝트가 저 브랜드와 왜 관련돼 있는지 등을 알아야 하니까요. 그런데 지금의 AI는 이 석 달을 보내지 못한 상태입니다. 질문을 받을 때마다 메신저 기록을 처음부터 다시 훑고, 하루가 지나면 전날 파악한 내용도 남아 있지 않다는 겁니다. 날마다 첫 출근을 하는 직원인 셈이죠.\n\n여러분도 AI에게 일을 맡기려다가 “이렇게 배경을 설명할 바에는 내가 하는 게 빠르겠네.”라고 생각한 적이 있을 겁니다. AI가 기대만큼 도움이 되지 않는 이유가 여기에 있는 건 아닐까요? AI의 능력이 부족해서라기보다 일의 맥락을 매번 처음부터 설명해야 하기 때문일 수 있다는 말입니다. 이런 상태에서 도구를 열 개로 늘리면 어떻게 될까요? 첫 출근을 한 직원이 열 명으로 늘어나는 것이겠죠.\n\n그래서 이 스타트업에서는 AI가 참고할 수 있는 ‘회사 지도’를 만들었습니다. 매일 새벽 4시, 누군가 질문하기도 전에 AI가 메신저 대화와 회의 녹음, 업무 문서, 개발 기록을 먼저 읽도록 했습니다. AI는 사람과 서비스, 업무마다 설명 페이지를 만들고, ‘이 일을 맡고 있다’, ‘이 건을 논의했다’ 등의 관계로 페이지들을 연결합니다. 질문이 들어오면 해당 페이지뿐만 아니라 지도에서 바로 옆에 연결된 정보까지 꺼내 답하는 것이죠. 신입 사원이 석 달 동안 머릿속에 그리는 지도를 AI가 매일 밤 새로 그리게 한 겁니다.\n\n여기까지 읽은 여러분은 “결국 자료를 많이 모아 놓으면 된다는 말이군.”이라고 생각할지도 모르겠습니다. 하지만 이 사례에서 더 눈여겨봐야 할 것은 자료를 모은 다음에 벌어진 일입니다.\n\n자료를 모아 보니 지도 위의 점에 해당하는 사람이나 브랜드 등의 항목이 2,927개였는데요, 그중 70퍼센트는 지도 사용자가 메신저나 회의, 문서에서 한 번도 접한 적 없는 다른 팀의 브랜드와 크리에이터였습니다. 회사의 정보라고 해서 모두 자기 일에 필요한 정보는 아니었던 것이죠. 그래서 직함을 기준으로 삼기보다 각자가 실제로 관여하는 일에 맞춰 지도를 그리기로 했습니다. 어떤 브랜드가 MD들의 대화에는 등장하지만 개발자들 사이에서는 언급되지 않는다면, 그 브랜드는 MD의 지도에만 나타나게 하는 식입니다. 물론 AI가 읽는 자료의 범위도 각자 열람 권한을 가진 것으로 한정했죠.\n\n자기 일에 필요한 문서를 고르는 과정이 처음부터 순조롭지는 않았습니다. 최근 올라온 업무 문서 400건을 키워드로 걸러 봤는데요, 다른 팀의 주간 회의록과 단가표가 줄줄이 섞여 들어왔습니다. 채널 이름에 ‘브랜드’나 ‘광고’라는 단어가 붙어 있다는 이유만으로 말이죠. 결국 ‘이 문서가 정말 내 일에 해당하는가?’만 판정하는 전용 모델을 따로 두었습니다. 이 모델은 제목만 보고도 업무 관련성을 가려냈고, 400건 가운데 남은 문서는 12건이었습니다.\n\n필요한 정보를 고르는 것과 함께 ‘잊는 방법’도 설계했습니다. 30일이 넘도록 다시 언급되지 않은 항목은 지도에서 지우도록 한 것이죠. 처음 5천 개를 넘었던 항목 가운데 57퍼센트가 한 번 등장한 후 다시는 나오지 않은 이름이었기 때문입니다. 다만 두 군데 이상에서 등장했거나, 다른 항목과 두 갈래 이상으로 연결됐거나, 설명이 달린 항목은 남겨 뒀습니다. 그렇게 해서 지금 이 사용자의 지도에는 838개의 항목이 남아 있습니다. 그런데 사용자가 손수 작성한 문서는 한 건도 없다고 합니다. 모두 AI가 평소의 대화와 회의, 문서를 읽고 정리한 결과죠.\n\n규모가 전혀 다른 사업체에서도 비슷한 이야기를 들을 수 있습니다. 한 중소 사업체에서는 거래처별 주문 내역과 단가, 납기를 웹앱에 데이터로 정리해 두고, 그 위에 메신저 봇 하나를 연결했습니다. 발주서 사진을 보내면 봇이 내용을 읽은 다음 “등록할까요?”라고 묻습니다. “응”이라고 답하면 끝이죠. 같은 봇이 부동산 임차인 정보와 개인 일정 알림까지 맡고 있다고 합니다. 여기서도 중요한 것은 순서입니다. 자동화를 하겠다며 장비부터 사들이기보다, 데이터가 먼저 정리돼 있어야 봇이 그 데이터를 대상으로 일을 할 수 있다는 것이죠.\n\n두 사례에서 일이 줄어든 이유는 무엇일까요? 발주 봇이 대단히 영리했기 때문이라고 답하기 전에, 주문 내역과 단가, 납기가 이미 한곳에 정리돼 있었다는 점을 봐야 합니다. 그 바탕이 있었기에 봇은 ‘등록’이라는 동작을 수행하면 됐던 것이죠. 회사 지도 역시 마찬가지입니다. AI가 새벽마다 읽을 대화와 회의 기록이 없었다면, 어떤 모델을 사용하더라도 지도를 그릴 수 없었을 겁니다.\n\n그렇다고 직원들에게 “앞으로 모든 자료를 빠짐없이 모아 두세요.”라고 요구하면 될까요? 모아 놓은 항목의 70퍼센트가 다른 사람의 일이었고, 한때는 절반 넘는 항목이 한 번 등장하고 사라진 이름이었다는 사실을 떠올려 보세요. 모든 것을 담아 놓기만 한 지도는 두꺼운 전화번호부에 가까울 겁니다. 자료를 모은다는 것은 자기 일에 필요한 것을 고르고, 더는 쓰이지 않는 것을 덜어 내는 과정까지 포함해야 합니다. 여러분이 3년 차 동료를 믿음직하게 여기는 이유도 그저 아는 것이 많아서만은 아니겠죠. 무엇이 중요하고 누구에게 물어야 하는지를 알고 있기 때문일 겁니다.\n\n물론 이런 지도를 그리는 시스템을 우리가 직접 만들기는 어렵습니다. 하지만 그 시스템이 읽을 재료는 우리가 매일 일하면서 남기는 기록에서 나옵니다. 여러분의 팀에서는 그 기록이 어디에 남고 있습니까? 중요한 결정이 통화 한 통이나 회의실에서 나눈 대화로 끝나 버리지는 않나요? 어디에도 적히지 않은 결정이라면 AI의 성능이 아무리 좋아져도 알아낼 방법이 없습니다.\n\n그렇기에 AI로 일을 줄이려는 여러분은 좋은 도구를 고르는 것에 앞서, 업무의 맥락을 도구가 읽을 수 있는 곳에 남기는 습관부터 갖춰야 합니다. 다음에 “이 AI 도구를 한번 써 볼까요?”라는 제안이 나오면 먼저 이렇게 물어보세요. “이 도구가 읽을 우리 팀의 기록은 지금 어디에 있습니까?” 이 질문에 바로 답할 수 없다면, 도구를 하나 더 도입하기 전에 해야 할 일이 있다는 뜻입니다. 우리 팀의 일이 어디에, 어떻게 기록되고 있는지부터 살펴보기 바랍니다.", "m": {"대비": 4, "나열": 0, "선언": 0, "번역투": 0, "분량": 2548}}, {"key": "t3-A-r4", "group": "C3", "label": "t3-A · A 확정본 절차 · (중간) astra 재작성", "desc": "기준 반영 전 단계", "title": "AI 도구를 늘리기 전에 물어야 할 것", "body": "회의록을 요약해 주는 봇, 메일 초안을 써 주는 봇, 사내 문서를 찾아 답해 주는 봇. 여러분의 회사에 이런 AI 도구가 열 개쯤 생겼다고 해보세요. 직원들의 일은 얼마나 줄어들까요? 도구마다 일을 하나씩 맡기면 그만큼 여유가 생길 거라고 기대할 텐데요, 과연 그럴까요?\n\n한 AI 스타트업의 AI 리드는 회사가 달라지지는 않을 거라고 단호하게 말합니다. 직원들이 화면에 띄워 놓아야 할 창만 열 개로 늘어날 뿐이라는 것이죠. AI를 쓰지 말자는 뜻일까요? 그렇지 않습니다. 이 리드 역시 AI를 활용했습니다. 다만 도구를 하나씩 늘리는 대신, 도구들이 함께 사용할 바탕을 먼저 만들고 그 위에 모든 것을 연결했죠.\n\n왜 공통의 바탕이 먼저 필요할까요? 새로 입사한 직원을 떠올려 보세요. 신입 사원이 회사의 사정을 익히려면 석 달쯤은 걸립니다. 어떤 일을 누가 맡고 있는지, 어느 회의에서 어떤 결정이 내려졌는지, 이 프로젝트가 저 브랜드와 왜 관련돼 있는지 등을 알아야 하니까요. 그런데 지금의 AI는 이 석 달을 보내지 못한 상태라고 이 리드는 말합니다. 질문을 받을 때마다 메신저 기록을 처음부터 다시 훑고, 하루가 지나면 전날 파악한 내용도 남아 있지 않다는 겁니다. 날마다 첫 출근을 하는 직원인 셈이죠.\n\n여러분도 AI에게 일을 맡기려다가 “이렇게 배경을 설명할 바에는 내가 하는 게 빠르겠네.”라고 생각한 적이 있을 겁니다. AI가 기대만큼 도움이 되지 않는 이유가 여기에 있는 건 아닐까요? AI의 능력이 부족해서라기보다 일의 맥락을 매번 처음부터 설명해야 하기 때문일 수 있다는 말입니다. 이런 상태에서 도구를 열 개로 늘리면 어떻게 될까요? 첫 출근을 한 직원이 열 명으로 늘어나는 것이겠죠.\n\n그래서 이 리드는 AI가 참고할 수 있는 ‘회사 지도’를 만들었습니다. 매일 새벽 4시, 누군가 질문하기도 전에 AI가 메신저 대화와 회의 녹음, 업무 문서, 개발 기록을 먼저 읽도록 했습니다. AI는 사람과 서비스, 업무마다 설명 페이지를 만들고, ‘이 일을 맡고 있다’, ‘이 건을 논의했다’ 등의 관계로 페이지들을 연결합니다. 질문이 들어오면 해당 페이지뿐만 아니라 지도에서 바로 옆에 연결된 정보까지 꺼내 답하는 것이죠. 신입 사원이 석 달 동안 머릿속에 그리는 지도를 AI가 매일 밤 새로 그리게 한 겁니다.\n\n여기까지 읽은 여러분은 “결국 자료를 많이 모아 놓으면 된다는 말이군.”이라고 생각할지도 모르겠습니다. 하지만 이 사례에서 더 눈여겨봐야 할 것은 자료를 모은 다음에 벌어진 일입니다.\n\n자료를 모아 보니 지도 위의 점에 해당하는 사람이나 브랜드 등의 항목이 2,927개였는데요, 그중 70퍼센트는 이 리드가 메신저나 회의, 문서에서 한 번도 접한 적 없는 다른 팀의 브랜드와 크리에이터였습니다. 회사의 정보라고 해서 모두 자기 일에 필요한 정보는 아니었던 것이죠. 그래서 이 리드는 직함을 기준으로 삼기보다 각자가 실제로 관여하는 일에 맞춰 지도를 그리기로 했습니다. 어떤 브랜드가 MD들의 대화에는 등장하지만 개발자들 사이에서는 언급되지 않는다면, 그 브랜드는 MD의 지도에만 나타나게 하는 식입니다. 물론 AI가 읽는 자료의 범위도 각자 열람 권한을 가진 것으로 한정했죠.\n\n자기 일에 필요한 문서를 고르는 과정이 처음부터 순조롭지는 않았습니다. 최근 올라온 업무 문서 400건을 키워드로 걸러 봤는데요, 다른 팀의 주간 회의록과 단가표가 줄줄이 섞여 들어왔습니다. 채널 이름에 ‘브랜드’나 ‘광고’라는 단어가 붙어 있다는 이유만으로 말이죠. 결국 이 리드는 ‘이 문서가 정말 내 일에 해당하는가?’만 판정하는 전용 모델을 따로 두었습니다. 이 모델은 제목만 보고도 업무 관련성을 가려냈고, 400건 가운데 남은 문서는 12건이었습니다.\n\n필요한 정보를 고르는 것과 함께 ‘잊는 방법’도 설계했습니다. 30일이 넘도록 다시 언급되지 않은 항목은 지도에서 지우도록 한 것이죠. 처음 5천 개를 넘었던 항목 가운데 57퍼센트가 한 번 등장한 후 다시는 나오지 않은 이름이었기 때문입니다. 다만 두 군데 이상에서 등장했거나, 다른 항목과 두 갈래 이상으로 연결됐거나, 설명이 달린 항목은 남겨 뒀습니다. 그렇게 해서 지금 이 리드의 지도에는 838개의 항목이 남아 있습니다. 그런데 이 가운데 그가 손수 작성한 문서는 한 건도 없다고 합니다. 모두 AI가 평소의 대화와 회의, 문서를 읽고 정리한 결과죠.\n\n규모가 전혀 다른 사업체에서도 비슷한 이야기를 들을 수 있습니다. 한 중소 사업체 운영자는 자동화를 하겠다며 장비부터 사들이지 말라고 조언합니다. 이 사업체는 거래처별 주문 내역과 단가, 납기를 웹앱에 데이터로 정리해 두고, 그 위에 메신저 봇 하나를 연결했습니다. 발주서 사진을 보내면 봇이 내용을 읽은 다음 “등록할까요?”라고 묻습니다. “응”이라고 답하면 끝이죠. 같은 봇이 부동산 임차인 정보와 개인 일정 알림까지 맡고 있다고 합니다. 이 운영자가 강조하는 것도 순서입니다. 데이터가 먼저 정리돼 있어야 봇이 그 데이터를 대상으로 일을 할 수 있다는 것이죠.\n\n두 사례에서 일이 줄어든 이유는 무엇일까요? 발주 봇이 대단히 영리했기 때문이라고 답하기 전에, 주문 내역과 단가, 납기가 이미 한곳에 정리돼 있었다는 점을 봐야 합니다. 그 바탕이 있었기에 봇은 ‘등록’이라는 동작을 수행하면 됐던 것이죠. 회사 지도 역시 마찬가지입니다. AI가 새벽마다 읽을 대화와 회의 기록이 없었다면, 어떤 모델을 사용하더라도 지도를 그릴 수 없었을 겁니다.\n\n그렇다고 직원들에게 “앞으로 모든 자료를 빠짐없이 모아 두세요.”라고 요구하면 될까요? 모아 놓은 항목의 70퍼센트가 다른 사람의 일이었고, 한때는 절반 넘는 항목이 한 번 등장하고 사라진 이름이었다는 사실을 떠올려 보세요. 모든 것을 담아 놓기만 한 지도는 두꺼운 전화번호부에 가까울 겁니다. 자료를 모은다는 것은 자기 일에 필요한 것을 고르고, 더는 쓰이지 않는 것을 덜어 내는 과정까지 포함해야 합니다. 여러분이 3년 차 동료를 믿음직하게 여기는 이유도 그저 아는 것이 많아서만은 아니겠죠. 무엇이 중요하고 누구에게 물어야 하는지를 알고 있기 때문일 겁니다.\n\n물론 이런 지도를 그리는 시스템을 우리가 직접 만들기는 어렵습니다. 하지만 그 시스템이 읽을 재료는 우리가 매일 일하면서 남기는 기록에서 나옵니다. 여러분의 팀에서는 그 기록이 어디에 남고 있습니까? 중요한 결정이 통화 한 통이나 회의실에서 나눈 대화로 끝나 버리지는 않나요? 어디에도 적히지 않은 결정이라면 AI의 성능이 아무리 좋아져도 알아낼 방법이 없습니다.\n\n그렇기에 AI로 일을 줄이려는 여러분은 좋은 도구를 고르는 것에 앞서, 업무의 맥락을 도구가 읽을 수 있는 곳에 남기는 습관부터 갖춰야 합니다. 다음에 “이 AI 도구를 한번 써 볼까요?”라는 제안이 나오면 먼저 이렇게 물어보세요. “이 도구가 읽을 우리 팀의 기록은 지금 어디에 있습니까?” 이 질문에 바로 답할 수 없다면, 도구를 하나 더 도입하기 전에 해야 할 일이 있다는 뜻입니다. 우리 팀의 일이 어디에, 어떻게 기록되고 있는지부터 살펴보기 바랍니다.", "m": {"대비": 3, "나열": 0, "선언": 0, "번역투": 0, "분량": 2594}}, {"key": "t3-A-draft", "group": "C3", "label": "t3-A · (중간) Claude 초안 — B도 이 초안 사용", "desc": "한 줄: AI 도구를 늘린다고 일이 줄지는 않는다. 일의 재료(데이터·기록·맥락)를 먼저 모아 두어야 도구가 일할 곳이 생긴다. | 원문: LinkedIn, AI 스타트업 AI 리드, 2026-10 / Threads, 중소 사업체 운영자, 2026-05-05", "title": "도구 열 개보다 지도 한 장", "body": "회의록을 요약해 주는 봇, 메일 초안을 대신 써 주는 봇, 사내 문서를 찾아 답해 주는 봇. 이런 AI 도구가 열 개쯤 생긴다면 여러분의 일은 얼마나 줄어들까요?\n\n한 AI 스타트업의 AI 리드는 이 질문에 단호하게 답합니다. 회사는 달라지지 않는다고요. 직원들 화면에 띄워 둘 창만 열 개로 불어날 뿐이라는 겁니다. AI를 멀리하자는 말은 아닙니다. 이 리드는 도구를 따로따로 늘리지 않았습니다. 공통의 바탕을 먼저 깔고 그 위에 모든 것을 이었죠.\n\n왜 도구를 늘려도 일이 줄지 않을까요? 이 리드는 신입 사원 이야기로 답을 대신합니다. 새로 온 사람은 석 달쯤 지나야 회사의 지형을 익힙니다. 일마다 누가 담당인지, 어떤 결정이 어느 회의에서 나왔는지, 이 프로젝트와 저 브랜드가 무슨 까닭으로 얽혀 있는지 같은 것들이죠. 그런데 지금의 AI는 이 석 달을 한 번도 보내지 못합니다. 무언가를 물을 때마다 메신저 기록을 맨 앞부터 다시 훑습니다. 하루만 지나면 전날 파악한 내용도 남아 있지 않습니다. 날마다 첫 출근을 하는 직원인 셈입니다.\n\n혹시 이런 경험은 없으신가요? AI에게 일을 맡기려고 배경을 설명하다가 차라리 내가 하는 편이 빠르겠다 싶었던 순간 말입니다. AI의 효과가 애매하게 느껴지는 건 AI가 둔해서라기보다 매번 맥락을 처음부터 들려줘야 하기 때문일지 모릅니다. 이대로 도구만 늘리면 첫날 직원이 열 명으로 불어날 뿐입니다.\n\n그래서 이 리드는 AI가 펼쳐 볼 '회사 지도'를 만들었습니다. 매일 새벽 4시, 아직 아무도 질문하지 않은 시간에 AI가 메신저 대화와 회의 녹음, 업무 문서, 개발 기록을 먼저 읽습니다. 그러고는 사람과 서비스와 업무 하나하나에 설명 페이지를 붙이고, '이 일을 맡고 있다', '이 건을 논의했다' 같은 관계로 페이지끼리 이어 둡니다. 질문이 오면 해당 페이지와 함께 지도에서 바로 옆에 붙은 정보까지 꺼내 답하죠. 신입이 석 달 동안 머릿속에 그리는 지도를 AI가 매일 밤 새로 그리는 겁니다.\n\n여기까지만 들으면 '자료를 최대한 많이 모으자'는 이야기 같습니다. 그런데 더 눈여겨볼 대목은 정반대 쪽에 있습니다.\n\n자료를 다 모아 보니 지도 위의 점, 즉 사람이나 브랜드 같은 항목이 2,927개였습니다. 그중 70%는 이 리드가 메신저에서도, 회의에서도, 문서에서도 마주친 적 없는 다른 팀의 브랜드와 크리에이터였습니다. 그래서 지도를 직함이 아니라 그 사람이 실제로 손대는 일에 맞춰 그리기로 했습니다. 어떤 브랜드가 MD들의 대화에는 오르내리지만 개발자들 사이에서는 언급되지 않는다면, 그 브랜드는 MD의 지도에만 나타나는 식입니다. 읽는 범위도 각자 열람 권한이 있는 자료로 한정했고요.\n\n문서를 고를 때는 실패도 겪었습니다. 최근 올라온 업무 문서 400건에서 자기 일에 맞는 것만 추리려고 처음엔 키워드로 걸렀습니다. 그러자 채널 이름에 '브랜드'나 '광고'라는 단어가 붙어 있었을 뿐인 다른 팀의 주간 회의록과 단가표가 줄줄이 섞여 들어왔습니다. 결국 '이게 정말 내 일인가'만 판정하는 전용 모델을 따로 두었습니다. 이 모델은 제목만 보고도 정말 이 리드의 일에 해당하는 문서를 가려냈습니다. 400건 중 남은 건 12건이었습니다.\n\n잊는 방법도 설계했습니다. 30일이 넘도록 다시 언급되지 않은 항목은 지도에서 지웠습니다. 처음 5천 개를 넘었던 항목 가운데 57%가 한 번 등장하고는 다시 나오지 않은 이름이었습니다. 다만 두 군데 이상에서 나왔거나, 다른 항목과 두 갈래 이상으로 이어졌거나, 설명이 달린 항목은 남겼습니다. 지금 이 리드의 지도에 있는 항목은 838개입니다. 눈에 띄는 건 이 가운데 이 리드가 손수 작성한 문서가 한 건도 없다는 점입니다. 모두 AI가 평소의 대화와 회의, 문서를 읽고 정리한 것이죠.\n\n규모가 전혀 다른 곳에서도 같은 이야기가 나옵니다. 한 중소 사업체 운영자는 자동화를 하겠다며 장비부터 사들이지 말라고 말합니다. 이 사업체는 거래처마다 주문 내역과 단가, 납기를 웹앱에 데이터로 정리해 두었고, 그 위에 메신저 봇 하나를 얹었습니다. 발주서 사진을 보내면 봇이 읽고 \"등록할까요?\" 하고 묻습니다. \"응\" 하면 끝이죠. 같은 봇이 부동산 임차인 정보와 개인 일정 알림까지 맡습니다. 이 운영자가 꼽는 핵심도 순서입니다. 데이터가 먼저 자리를 잡고 있어야 봇이 붙들고 일할 대상이 생긴다는 겁니다.\n\n자, 두 이야기를 나란히 놓으면 무엇이 보일까요? 발주 봇이 대단히 영리해서 일이 줄어든 게 아닙니다. 주문과 단가와 납기가 이미 한곳에 정리돼 있었기에 봇은 '등록'이라는 동작 하나만 하면 됐던 거죠. 회사 지도도 마찬가지입니다. AI가 새벽마다 읽을 대화와 회의 기록이 없었다면 어떤 모델도 지도를 그리지 못했을 겁니다.\n\n다만 재료를 모으라는 말을 '무엇이든 쌓아 두라'로 들어서는 안 됩니다. 모아 놓은 항목의 70%가 남의 일이었고, 한때는 항목의 절반 넘게가 한 번 나오고 사라진 이름이었다는 걸 떠올려 보세요. 전부 담은 지도는 지도라기보다 두꺼운 전화번호부에 가깝습니다. 재료를 모은다는 건 내 일에 맞는 것을 고르고 더는 쓰이지 않는 것을 덜어 내는 일까지 포함합니다. 3년 차 동료가 믿음직한 것도 아는 게 많아서라기보다 무엇이 중요하고 누구에게 물어야 하는지 알기 때문 아닐까요?\n\n지도를 그리는 시스템은 우리가 직접 만들기 어렵습니다. 하지만 그 재료는 우리가 매일 일하며 남기는 흔적에서 나옵니다. 문제는 그 흔적이 어디에 남느냐죠. 중요한 결정이 통화 한 통이나 회의실 대화로 끝나고 어디에도 적히지 않는다면, AI가 아무리 좋아져도 그 결정을 알 길이 없습니다.\n\nAI 시대에 일을 줄여 주는 힘은 좋은 도구를 고르는 안목에서 나오지 않습니다. 내 일의 맥락을 도구가 읽을 수 있는 자리에 남겨 두는 습관에서 나옵니다. 다음에 \"이 AI 도구 한번 써 볼까요?\"라는 말이 나오면 도구를 열기 전에 먼저 물어보세요. \"이 도구가 읽을 우리 팀의 기록은 지금 어디에 있지?\" 바로 답하지 못한다면 도구를 하나 더 들이기 전에 할 일이 따로 있다는 뜻입니다.", "m": {"대비": 5, "나열": 0, "선언": 0, "번역투": 0, "분량": 2212}}, {"key": "t3-B-final", "group": "C3", "label": "t3-B · B 문체 참고 바꿈 · 최종", "desc": "한 줄: AI 도구를 늘린다고 일이 줄지는 않는다. 일의 재료(데이터·기록·맥락)를 먼저 모아 두어야 도구가 일할 곳이 생긴다. | 원문: LinkedIn, AI 스타트업 AI 리드, 2026-10 / Threads, 중소 사업체 운영자, 2026-05-05 | 재작성 참고: p724·p669", "title": "도구 열 개보다 지도 한 장", "body": "회의록을 요약하는 봇, 메일 초안을 작성하는 봇, 사내 문서를 찾아 답해 주는 봇. 혹시 여러분은 이런 AI 도구가 열 개쯤 생기면 직원들의 일이 크게 줄어들 것이라 기대하지는 않나요? 도구마다 하나씩 일을 맡기면 회사도 달라질 거라 생각하면서 말입니다.\n\n하지만 도구만 늘린다고 회사가 달라지지는 않습니다. 직원들의 화면에 띄워 놓아야 할 창만 열 개로 늘어날 뿐이죠. 그렇다고 AI를 멀리하자는 뜻은 아닙니다. 한 AI 스타트업에서는 도구를 개별적으로 늘리는 대신 공통의 바탕을 마련하고 그 위에 모든 것을 연결하는 방법을 택했습니다.\n\n왜 도구가 많아져도 일은 줄어들지 않을까요? 신입 사원을 떠올려 보면 이해하기 쉽습니다. 새로 입사한 직원이 회사의 지형을 익히려면 석 달 정도가 걸립니다. 어떤 일을 누가 담당하는지, 어떤 결정이 어느 회의에서 나왔는지, 이 프로젝트와 저 브랜드가 왜 연결돼 있는지 등을 알아가는 시간이죠. 그런데 지금의 AI는 이 석 달을 한 번도 보내지 못합니다. 질문을 받을 때마다 메신저 기록을 처음부터 다시 훑고, 하루가 지나면 전날 파악한 내용조차 남아 있지 않으니까요. 날마다 첫 출근을 하는 직원인 셈입니다.\n\n여러분도 AI에게 일을 맡기려다가 배경을 설명하는 데 지쳐서 “차라리 내가 하고 말지”라고 생각한 적이 있지 않나요? AI의 효과가 기대에 못 미치는 이유는 AI가 둔해서라기보다 매번 일의 맥락을 처음부터 알려줘야 하기 때문일지 모릅니다. 이런 상태에서 도구를 열 개로 늘려 봤자 첫 출근을 한 직원이 열 명 생기는 것과 다를 바 없겠죠.\n\n그래서 이 스타트업에서는 AI가 참고할 수 있는 ‘회사 지도’를 만들었습니다. 매일 새벽 4시, 아직 아무도 질문을 던지지 않은 시간에 AI가 메신저 대화, 회의 녹음, 업무 문서, 개발 기록을 먼저 읽도록 한 것이죠. AI는 사람과 서비스, 업무마다 설명 페이지를 만들고, ‘이 일을 맡고 있다’거나 ‘이 건을 논의했다’는 관계로 페이지들을 연결합니다. 그러고는 질문이 들어오면 해당 페이지뿐만 아니라 지도에서 바로 옆에 연결된 정보까지 찾아 답합니다. 신입 사원이 석 달 동안 머릿속에 그리는 지도를 AI가 매일 밤 새로 그리는 겁니다.\n\n여기까지 읽으면 “결국 자료를 최대한 많이 모으라는 말이군”이라고 생각할지 모르겠습니다. 하지만 더 눈여겨봐야 할 대목은 따로 있습니다. 무엇을 담을 것인가만큼 무엇을 빼야 하는가가 중요했다는 점입니다.\n\n자료를 모아 보니 지도 위의 점에 해당하는 사람이나 브랜드 등의 항목이 2,927개였습니다. 그런데 한 사용자의 업무를 기준으로 보니, 그중 70%는 메신저에서도, 회의에서도, 문서에서도 마주친 적이 없는 다른 팀의 브랜드와 크리에이터였습니다. 회사에 관한 정보라고 해서 모두 자신의 일에 필요한 정보는 아니었던 것이죠.\n\n그래서 직함이 아니라 각자가 실제로 관여하는 일을 기준으로 지도를 그리기로 했습니다. 어떤 브랜드가 MD들의 대화에는 자주 등장하지만 개발자들 사이에서는 언급되지 않는다면, 그 브랜드는 MD의 지도에만 나타나도록 하는 식입니다. 물론 AI가 읽는 자료의 범위도 각자 열람 권한을 가진 것으로 한정했습니다.\n\n필요한 문서를 고르는 과정이 처음부터 순조로웠던 것은 아닙니다. 최근 올라온 업무 문서 400건 중 해당 사용자의 일과 관련된 것만 추리려고 키워드로 걸러 봤습니다. 하지만 채널 이름에 ‘브랜드’나 ‘광고’라는 단어가 있다는 이유만으로 다른 팀의 주간 회의록과 단가표가 줄줄이 섞여 들어왔죠. 결국 ‘이 문서가 정말 내 일에 해당하는가’만 판단하는 전용 모델을 따로 두었습니다. 이 모델은 제목만으로도 관련 문서를 가려냈는데요, 400건 중 남은 것은 12건이었습니다.\n\n게다가 AI가 무엇을 기억할지뿐만 아니라 어떻게 잊을지도 설계했습니다. 30일이 지나도록 다시 언급되지 않은 항목은 지도에서 지우도록 한 것이죠. 처음에는 항목이 5천 개를 넘었는데, 그중 57%가 단 한 번 등장하고 다시는 나오지 않은 이름이었기 때문입니다. 다만 두 군데 이상에서 등장했거나, 다른 항목과 두 갈래 이상으로 연결됐거나, 설명이 붙어 있는 항목은 남겼습니다.\n\n이렇게 정리된 지도에 지금 남아 있는 항목은 838개입니다. 여기서 눈여겨볼 점은 이 가운데 사용자가 손수 작성한 문서가 한 건도 없다는 사실입니다. 모두 AI가 평소의 대화와 회의, 문서를 읽고 정리한 결과라고 합니다.\n\n규모가 전혀 다른 사업체에서도 같은 흐름을 볼 수 있습니다. 한 중소 사업체에서는 거래처별 주문 내역과 단가, 납기를 웹앱에 데이터로 정리해 두고, 그 위에 메신저 봇 하나를 연결했습니다. 발주서 사진을 보내면 봇이 내용을 읽은 다음 “등록할까요?”라고 묻습니다. “응”이라고 답하면 끝이죠. 같은 봇이 부동산 임차인 정보와 개인 일정 알림까지 맡고 있습니다.\n\n여기서도 중요한 것은 순서입니다. 데이터가 먼저 정리돼 있어야 봇이 붙들고 일할 대상이 생긴다는 겁니다. 자동화 도구부터 마련하면 일이 저절로 정리될 것이라는 기대와는 순서가 반대죠.\n\n자, 두 사례를 나란히 놓으면 무엇이 보이나요? 발주 봇이 대단히 영리해서 일이 줄어든 것은 아닙니다. 주문과 단가, 납기가 이미 한곳에 정리돼 있었기에 봇은 ‘등록’이라는 동작을 수행하면 됐던 겁니다. 회사 지도도 마찬가지입니다. AI가 새벽마다 읽을 대화와 회의 기록이 없었다면, 어떤 모델을 가져다 놓아도 지도를 그릴 수 없었겠죠.\n\n그렇다고 ‘재료를 모으라’는 말을 ‘무엇이든 쌓아 두라’는 뜻으로 받아들여서는 곤란합니다. 모아 놓은 항목의 70%가 다른 사람의 일이었고, 한때는 절반이 넘는 항목이 한 번 등장한 뒤 사라진 이름이었다는 사실을 떠올려 보기 바랍니다. 모든 것을 담은 지도는 두꺼운 전화번호부에 가까울 뿐입니다. 내 일에 맞는 정보를 고르고, 더는 쓰이지 않는 정보를 덜어 내는 것까지가 재료를 모으는 일에 포함돼야 합니다. 3년 차 동료가 믿음직한 이유도 단순히 아는 것이 많아서일까요? 무엇이 중요하고 누구에게 물어야 하는지를 알기 때문 아닐까요?\n\n물론 이 었던 것이죠.\n\n그래서 이 리드는 직함이 아니라 각자가 실제로 관여하는 일을 기준으로 지도를 그리기로 했습니다. 어떤 브랜드가 MD들의 대화에는 자주 등장하지만 개발자들 사이에서는 언급되지 않는다면, 그 브랜드는 MD의 지도에만 나타나도록 하는 식입니다. 물론 AI가 읽는 자료의 범위도 각자 열람 권한을 가진 것으로 한정했습니다.\n\n필요한 문서를 고르는 과정이 처음부터 순조로웠던 것은 아닙니다. 이 리드는 최근 올라온 업무 문서 400건 중 자신의 일과 관련된 것만 추리려고 키워드로 걸러 봤습니다. 하지만 채널 이름에 ‘브랜드’나 ‘광고’라는 단어가 있다는 이유만으로 다른 팀의 주간 회의록과 단가표가 줄줄이 섞여 들어왔죠. 결국 ‘이 문서가 정말 내 일에 해당하는가’만 판단하는 전용 모델을 따로 두었습니다. 이 모델은 제목만으로도 관련 문서를 가려냈는데요, 400건 중 남은 것은 12건이었습니다.\n\n게다가 이 리드는 AI가 무엇을 기억할지뿐만 아니라 어떻게 잊을지도 설계했습니다. 30일이 지나도록 다시 언급되지 않은 항목은 지도에서 지우도록 한 것이죠. 처음에는 항목이 5천 개를 넘었는데, 그중 57%가 단 한 번 등장하고 다시는 나오지 않은 이름이었기 때문입니다. 다만 두 군데 이상에서 등장했거나, 다른 항목과 두 갈래 이상으로 연결됐거나, 설명이 붙어 있는 항목은 남겼습니다.\n\n지금 이 리드의 지도에 있는 항목은 838개입니다. 여기서 눈여겨볼 점은 이 가운데 이 리드가 손수 작성한 문서가 한 건도 없다는 사실입니다. 모두 AI가 평소의 대화와 회의, 문서를 읽고 정리한 결과라고 합니다.\n\n규모가 전혀 다른 사업체에서도 같은 이야기가 나옵니다. 한 중소 사업체 운영자는 자동화를 하겠다며 장비부터 사들이지 말라고 조언합니다. 이 사업체는 거래처별 주문 내역과 단가, 납기를 웹앱에 데이터로 정리해 두고, 그 위에 메신저 봇 하나를 연결했습니다. 발주서 사진을 보내면 봇이 내용을 읽은 다음 “등록할까요?”라고 묻습니다. “응”이라고 답하면 끝이죠. 같은 봇이 부동산 임차인 정보와 개인 일정 알림까지 맡고 있습니다.\n\n이 운영자가 강조하는 것도 순서입니다. 데이터가 먼저 정리돼 있어야 봇이 붙들고 일할 대상이 생긴다는 겁니다. 자동화 도구부터 마련하면 일이 저절로 정리될 것이라는 기대와는 순서가 반대죠.\n\n자, 두 사례를 나란히 놓으면 무엇이 보이나요? 발주 봇이 대단히 영리해서 일이 줄어든 것은 아닙니다. 주문과 단가, 납기가 이미 한곳에 정리돼 있었기에 봇은 ‘등록’이라는 동작을 수행하면 됐던 겁니다. 회사 지도도 마찬가지입니다. AI가 새벽마다 읽을 대화와 회의 기록이 없었다면, 어떤 모델을 가져다 놓아도 지도를 그릴 수 없었겠죠.\n\n그렇다고 ‘재료를 모으라’는 말을 ‘무엇이든 쌓아 두라’는 뜻으로 받아들여서는 곤란합니다. 모아 놓은 항목의 70%가 다른 사람의 일이었고, 한때는 절반이 넘는 항목이 한 번 등장한 뒤 사라진 이름이었다는 사실을 떠올려 보기 바랍니다. 모든 것을 담은 지도는 두꺼운 전화번호부에 가까울 뿐입니다. 내 일에 맞는 정보를 고르고, 더는 쓰이지 않는 정보를 덜어 내는 것까지가 재료를 모으는 일에 포함돼야 합니다. 3년 차 동료가 믿음직한 이유도 단순히 아는 것이 많아서일까요? 무엇이 중요하고 누구에게 물어야 하는지를 알기 때문 아닐까요?\n\n물론 이런 지도를 그리는 시스템을 우리가 직접 만들기는 어렵습니다. 하지만 지도의 재료는 우리가 매일 일하면서 남기는 흔적에서 나옵니다. 문제는 그 흔적이 어디에 남아 있느냐는 것이죠. 중요한 결정이 통화 한 통이나 회의실 대화로 끝나고 어디에도 기록되지 않는다면, AI가 아무리 좋아져도 그 결정을 알 도리는 없습니다.\n\nAI 시대에 일을 줄이는 힘은 좋은 도구를 고르는 안목에서 나오지 않습니다. 자신의 일에 관한 맥락을 도구가 읽을 수 있는 곳에 남기는 습관에서 나옵니다. 다음에 누군가 “이 AI 도구 한번 써 볼까요?”라고 말하면, 도구를 열기 전에 이렇게 물어보기 바랍니다. “이 도구가 읽을 우리 팀의 기록은 지금 어디에 있죠?” 바로 답할 수 없다면 도구를 하나 더 도입하기 전에 해야 할 일이 있다는 뜻입니다.", "m": {"대비": 6, "나열": 0, "선언": 0, "번역투": 0, "분량": 2567}}, {"key": "t3-C-final", "group": "C3", "label": "t3-C · C 다른 각도 · 최종", "desc": "한 줄: 자동화를 몇 개 만들었는지보다, 팀원이 하루에 열어야 하는 창과 도구가 줄었는지를 봐야 한다. 도구가 늘면 그 도구를 오가는 일도 같이 는다. | 원문: LinkedIn, AI 스타트업 AI 리드, 2026-10 / Threads, 중소 사업체 운영자, 2026-05-05 | 재작성 참고: p752·p716", "title": "AI 도구를 늘리기 전에, 열어야 할 창부터 세어 보세요", "body": "여러분도 AI를 써 봤지만 효과가 기대에 미치지 못한다고 느낀 적이 있을 겁니다. 도구 하나하나는 분명히 빠른데, 하루 일을 마칠 무렵이면 정작 줄어든 일은 별로 없다고 말이죠. 회의록을 요약하는 봇, 메일 초안을 작성하는 봇, 문서에 관한 질문에 답하는 봇을 늘려도 일하는 방식은 그대로일 수 있습니다. 사용하는 직원에게는 들어가 봐야 할 프로그램 목록이 길어질 뿐이기 때문입니다.\n\n우리는 흔히 자동화를 몇 개 만들었는지로 AI 도입의 성과를 평가하는데요, 도구가 생기면 그 도구 때문에 해야 할 일도 생깁니다. 프로그램에 들어가고, 결과를 다른 곳에 옮겨 붙이고, 무엇을 어디에 두었는지 기억해야 하죠. 도구가 늘어날수록 도구 사이를 오가는 수고도 커집니다. 하지만 자동화의 개수만 세면 이런 비용은 드러나지 않습니다.\n\n한 AI 스타트업에서는 봇을 더 만드는 대신, 모든 기능을 연결해서 배포하고 관리할 수 있는 공통의 틀을 직접 만들었습니다. 그 위에 올린 기능 가운데 여러분이 눈여겨볼 것이 있는데요, 바로 AI가 업무를 이해하도록 돕는 ‘지도’입니다.\n\n새로 입사한 직원이 회사 일을 익히는 데는 시간이 걸립니다. 어떤 일은 누구에게 물어야 하는지, 지금의 결정은 어떤 회의를 거쳐 나왔는지, 서로 다른 프로젝트와 브랜드가 어떤 사연으로 연결돼 있는지 등을 알아야 하니까요. 몸으로 익히려면 석 달쯤 걸리는 것들입니다. 그런데 이 사례에서 AI는 날마다 처음 출근하는 신입사원과 같았습니다. 하루 전에 알아낸 것도 기억하지 못하고, 질문을 받을 때마다 메신저 기록을 처음부터 다시 훑는다는 것이죠. 그래서 이런 AI에게 미리 읽어 둘 지도를 만들어 준 것입니다.\n\n이 AI의 하루는 새벽 4시에 시작됩니다. 사내 메신저, 회의 녹음, 업무 문서, 개발 코드 저장소를 먼저 읽습니다. 그런 다음 사람 한 명, 서비스 하나, 업무 하나마다 소개 페이지를 만들고, 누가 무엇을 논의하고 맡고 사용하는지를 서로 연결해 둡니다. 질문을 받으면 관련 페이지를 먼저 찾는데요, 그 페이지와 직접 연결된 주변 페이지까지 함께 살펴보고 답하는 방식입니다.\n\n제가 특히 주목한 것은 지도에서 ‘무엇을 뺄 것인가’까지 꼼꼼하게 설계했다는 점입니다. 처음에 회사 전체를 담았더니 지도는 남의 일로 가득해졌습니다. 지도에 모인 점의 70퍼센트가 다른 팀이 다루는 브랜드와 크리에이터였다고 합니다. 정작 지도 사용자가 참여하는 대화나 회의, 문서에서는 한 번도 접하지 못한 이름들이었죠.\n\n그래서 지도의 주인을 회사 전체가 아니라 개인으로 정했습니다. 어떤 이름을 지도에 넣을지는 그 사람의 직함이 아니라 실제로 관여하는 업무를 기준으로 판단하도록 했죠. 물론 자료를 읽는 범위는 본인에게 열람 권한이 있는 것으로 한정했습니다.\n\n문서도 많이 넣는다고 좋은 것은 아니었습니다. 업무 문서 도구에 최근 쌓인 400개 페이지 중 이 사용자의 지도에 들어가는 것은 업무와 관련된 12개뿐인데요, 처음에는 이를 키워드로 구분하려다가 실패했다고 합니다. 채널명에 ‘브랜드’나 ‘광고’라는 단어가 들어 있다는 이유만으로 다른 팀의 주간 회의록과 단가표까지 따라 들어왔기 때문입니다. 결국 관련성을 판정하는 모델을 따로 두었습니다. 이 모델은 제목 한 줄만으로도 다른 팀의 회의록과 사용자의 업무 문서를 구분해 냈다고 하네요.\n\nAI가 무엇을 잊어야 하는지도 정했습니다. 30일 동안 다시 등장하지 않는 점은 지우고, 여러 근거가 있는 점은 남기는 식입니다. 처음에는 점이 5천 개를 넘었는데, 그중 57퍼센트가 단 한 번 등장하고 만 이름이었다고 합니다. 한 번 읽었다는 이유로 모든 이름을 계속 기억하게 할 필요는 없는 것이죠.\n\n이렇게 지도를 다듬으니 AI는 사용자가 지금 어떤 일을 하는지 알고, 아침마다 그 일과 관련된 소식을 추려 보내게 됐습니다. 소식을 고르는 데도 앞서 말한 판정 모델을 사용하는데요, 비용은 한 사람당 하루 5원 정도라고 합니다. 개인이 별도로 손볼 필요도 없습니다. 공통의 틀이 갖춰지면 지도는 사용자마다 저절로 커 가는 구조입니다.\n\n여기서 여러분은 무엇에 주목해야 할까요? 저는 ‘여러 곳을 돌아다니는 수고를 누가 부담하는가’를 살펴봐야 한다고 생각합니다. 봇이 여러 개 있으면 사람이 필요한 도구를 찾아다녀야 합니다. 요약하려고 이 창을 열고, 문서를 찾으려고 저 창을 열고, 결과를 가져다가 또 다른 창에 붙여 넣어야 하죠. 이 구조에서는 AI가 새벽에 여러 곳을 먼저 돌아다닙니다. 그리고 사용자가 지금 하는 일에 필요한 것을 추려 아침에 건네줍니다.\n\n물론 이 구조를 도입한 후 팀원이 하루에 여는 창이 몇 개 줄었는지까지 제시되지는 않았습니다. 다만 무엇을 줄이려는 설계인지는 분명합니다. 사람이 찾아가야 할 곳을 늘리기보다 필요한 정보가 사람에게 오는 경로를 하나로 모으려는 것이죠. 그 경로가 관련 없는 정보로 막히지 않도록, 무엇을 빼야 할지도 함께 고민하면서 말입니다.\n\n한 중소 사업체의 사례에서도 비슷한 생각을 읽을 수 있습니다. 이곳에서는 먼저 거래처별 주문 내역과 단가, 납기를 웹 프로그램 하나에 정리했습니다. 메신저 봇을 붙인 것은 그다음이었죠. 발주서 사진을 보내면 봇이 내용을 읽고 등록할지를 묻습니다. 한마디로 답하면 일이 끝납니다. 임차인 정보와 개인 일정 알림도 같은 봇이 처리하고요.\n\n이 순서를 거꾸로 해서는 안 됩니다. 자료가 한곳에 모여 있지 않으면 봇이 활용할 바탕이 없기 때문입니다. 앞서 소개한 AI 스타트업과 이 사업체는 규모도 분야도 다릅니다. 하지만 사용자가 들어가는 입구를 하나로 두고, 그 뒤에서 여러 일이 이어지도록 했다는 점에서는 같은 방향을 바라보고 있습니다.\n\n그렇기에 AI 도입의 성과를 묻는 질문도 바꿔야 합니다. “자동화를 몇 개 만들었습니까?”에서 “팀원이 하루에 열어야 할 창이 얼마나 줄었습니까?”로 말입니다. AI를 도입했는데도 효과가 애매했다면, 혹시 직원들이 오가야 할 곳만 늘어난 것은 아닌지 살펴봐야 합니다.\n\n다음에 새로운 AI 도구를 들이자는 제안이 나오면 기능을 따지기에 앞서 이렇게 물어보기 바랍니다. “이 도구를 쓰면 우리 팀이 하루에 여는 창이 줄어듭니까, 늘어납니까?” 창이 하나 더 늘어난다면, 그 도구가 대신 닫아 줄 창은 무엇인지부터 찾아보기 바랍니다.", "m": {"대비": 3, "나열": 0, "선언": 0, "번역투": 0, "분량": 2302}}, {"key": "t3-C-r4", "group": "C3", "label": "t3-C · C 다른 각도 · (중간) astra 재작성", "desc": "기준 반영 전 단계", "title": "AI 도구를 늘리기 전에, 열어야 할 창부터 세어 보세요", "body": "한 AI 스타트업에서 AI 업무를 이끄는 리드가 최근 SNS에 흥미로운 글을 올렸습니다. 회의록을 요약하는 봇, 메일 초안을 작성하는 봇, 문서에 관한 질문에 답하는 봇을 아무리 늘려도 회사는 그대로라는 것입니다. 왜 그럴까요? 사용하는 직원에게는 들어가 봐야 할 프로그램 목록이 길어질 뿐이기 때문입니다.\n\n여러분도 AI를 써 봤지만 효과가 기대에 미치지 못한다고 느낀 적이 있을 겁니다. 도구 하나하나는 분명히 빠른데, 하루 일을 마칠 무렵이면 정작 줄어든 일은 별로 없다고 n\n그렇다고 AI로 시간을 벌 수 없다는 말은 아닙니다. 작은 마케팅 회사를 운영하는 한 대표가 링크드인에 올린 글을 보죠. 이 대표가 올해 AI로 한 일 가운데 가장 쓸모 있었던 건 글쓰기와 상관이 없었습니다. 콘텐츠를 쓰는 일은 여전히 몇 시간씩 붙들고 있어야 한다는군요. 대신 매주 꽤 많은 시간을 잡아먹던 자잘한 반복 업무를 AI에 맡겼습니다. 세 군데 메일함으로 들어오는 문의를 읽고 분류하고 요약해 답장 초안까지 써 두는 일, 새로 달린 구글 리뷰에 답글 초안을 만드는 일, 기록해 둔 작업 시간을 청구서 초안으로 바꾸는 일 같은 것들입니다. 리뷰 답글은 대표가 문구를 승인하기 전에는 게시되지 않습니다. 이렇게 갖춰 두는 데도 시간이 좀 들었다고 합니다.\n\n이 대표는 삶이 통째로 바뀌진 않았다고 솔직하게 털어놓습니다. 해변에 앉아 하루 두 시간만 일하는 처지는 아니라면서요. 다만 돌려받은 시간을 사업의 다른 영역에 쓸 수 있게 됐다고 합니다.\n\n강사가 수업에서 권하는 길도 이와 닮았습니다. 자동화를 무작정 늘리기보다 어디까지 AI에 맡길 수 있는지 먼저 따져 보고, 최소한의 자동화로 효과가 가장 잘 나는 곳부터 찾자는 겁니다.\n\n그렇다면 이 대표와 사내 AI 선도자들은 무엇이 달랐을까요? 둘 다 AI 덕에 일이 빨라졌다는 점은 같습니다. 차이는 아낀 시간이 어디로 갔느냐입니다. 이 대표의 시간은 사업의 다른 일로 갔습니다. 높아지는 기대에 지쳐 간 선도자들의 시간은 그 기대가 고스란히 가져간 셈이고요. 물론 대표는 자기 시간의 주인이 자기 자신입니다. 조직에 속한 우리는 사정이 다르죠.\n\n퇴근을 늦추는 것은 AI가 아닙니다. 아낀 시간의 쓰임을 정하지 않은 채 다음 일을 받아 드는 습관이 퇴근을 늦춥니다. 주인이 정해지지 않은 빈 시간은 가장 먼저 들어온 요청이 차지하기 마련이니까요. 그 빈 시간을 노리는 손이 많은 조직에서는 더욱 그렇습니다. 그래서 아낀 시간을 어디에 쓸지는 일을 시작하기 전에, 그리고 팀이 함께 정해 두어야 합니다.\n\nAI에 일을 맡기기 전에 한 가지만 먼저 적어 보세요. 이걸로 아낀 시간을 어디에 쓸 것인가. 미뤄 둔 고민이어도 좋고 동료의 결과물을 함께 살피는 일이어도 좋습니다. 제시간에 퇴근하는 것도 물론 훌륭한 답입니다. 그리고 AI가 낸 결과를 확인하는 시간도 엄연히 일로 셈해야 합니다.\n\n리더라면 한 가지를 더 해 주시기 바랍니다. AI를 잘 쓰는 팀원에게 일을 하나 더 얹기 전에, 그 사람이 아낀 시간이 지금 어디로 가고 있는지 먼저 물어보세요. 팀원마다 AI로 일하는 속도가 다르다면 일을 나누는 방식도 다시 이야기해야 합니다. 빨리 끝낸 사람에게 돌아가는 것이 다음 일뿐이라면, AI를 가장 잘 쓰는 사람부터 지쳐 떠날 테니까요.\n\nAI가 돌려준 시간에는 이름표가 붙어 있지 않습니다. 이름표를 붙이는 건 우리 몫입니다.", "m": {"대비": 3, "나열": 0, "선언": 0, "번역투": 0, "분량": 2073}}, {"key": "A-im-not-ai", "group": "A", "label": "1단계 · im-not-ai", "desc": "처음부터 쓰고 im-not-ai humanize-korean로 다듬음", "title": "왜 AI를 쓰는데 더 퇴근 시간이 빨라지지 않을까요?", "body": "직원이 원하기만 하면 AI 사용료를 회사가 전부 대 주는 곳이 있습니다. 도구도 마음대로 골라 쓸 수 있고 2주에 한 번은 외부 강사가 와서 AI 교육을 하죠. AI를 익히기에 이만한 환경도 드물 겁니다. 이 회사에 강의를 다니는 강사가 올해 3월 Threads에 현장 이야기를 18편에 걸쳐 풀어놓았는데요, 내용은 기대와 조금 달랐습니다. 강사가 보기에 AI를 잘 다루는 사람이 서너 사람 몫을 해낸다고 느껴지는 경우는 흔하다고 합니다. 그런데 그만큼 사람의 한계도 더 빨리 드러난다는 겁니다.\n\n강사가 현장 실무자들과 나눈 이야기도 비슷합니다. 사내 'AI 프론티어'로 뽑힌 뒤 업무 기대치가 계속 올라가 번아웃을 겪거나 아예 회사를 떠난 사람이 적지 않다고 하죠. 강사가 경력직 이직을 도왔던 한 사람도 일이 너무 많고 기대치가 높다는 하소연을 자주 했다고 합니다. 그만둬도 되겠느냐는 물음에 강사는 우선 버텨 내라고 답했고요.\n\n자, AI는 일을 덜어 주는 도구라는데 왜 잘 쓰는 사람이 먼저 지칠까요? 강사가 인용한 앤트로픽의 글에 실마리가 있습니다. 일하는 속도가 빨라진 것이 정말로 조직과 개인의 생산성이 오른 것과 같으냐는 질문이죠. 속도는 분명히 빨라졌습니다. 문제는 그렇게 생긴 여유가 어디로 새어 나가느냐입니다. 강사의 이야기에서 세 갈래를 읽을 수 있습니다.\n\n첫째, 빨라진 속도가 곧 새 기준이 됩니다. 일을 빨리 끝낸 사람에게는 다음 일이 오기 마련입니다. 강사는 임원이 직접 AI로 뽑아 본 결과물을 내밀며 왜 이만큼 해 오지 못하느냐고 묻는 경우도 있다고 전합니다. AI가 기대치를 끌어올리는 셈이죠.\n\n둘째, 확인하는 수고는 줄지 않습니다. AI는 정답을 찍어 내는 기계가 아닙니다. 같은 질문에도 답이 그때그때 달라지죠. 그런데 그럴듯한 답을 받으면 사람은 기계를 믿고 넘어가고 싶어집니다. 이른바 '자동화 편향'입니다. 그러니 직접 만들던 수고가 사라진 자리에 AI의 결과를 의심하고 검증하는 수고가 들어섭니다. 일이 줄었다기보다 다른 종류의 일로 갈아탄 셈이죠. 강사는 이 부담이 쌓이면 번아웃으로 이어진다고 말합니다. 머릿속 연료라는 뜻의 '바이오토큰'이 바닥났다는 농담이 요즘 오가는 것도 그래서일 겁니다.\n\n셋째, 잘 쓰는 요령은 남에게 쉽게 넘어가지 않습니다. 한 직무를 3~5년쯤 하면 말이나 글로 다 옮기기 어려운 나만의 감각이 생깁니다. 이것을 '암묵지'라고 부릅니다. AI를 다루는 요령도 마찬가지입니다. 일을 고르게 나누면 될 것 같지만 그 감각이 정리돼 있지 않으니 결국 '할 줄 아는 사람'에게 일이 돌아갑니다. 강사가 교육에서 만난 사람들도 자기 암묵지를 제대로 정리하지 못한 경우가 많았다고 합니다. 당연한 일입니다. 지금 일만으로도 바쁜데 노하우를 정리할 짬이 어디 있겠습니까. 여기에 AI로 일하는 흐름을 새로 짜는 일까지 얹히면 부담은 오히려 커집니다.\n\n그렇다면 아낀 시간을 온전히 돌려받는 사람은 없을까요? 작은 마케팅 회사를 운영하는 한 대표가 LinkedIn에 올린 글이 참고가 됩니다. 이 대표는 매주 조금씩 시간을 갉아먹던 잔일들을 AI에 넘겼습니다. 메일함 세 곳에 쌓이는 문의를 나누고 요약해 답장 초안을 써 두게 했고 업무 시간 기록은 청구서 초안으로 옮겨지게 했죠. 고객 리뷰 답글도 AI가 초안을 잡지만 이 대표가 문구를 확인해 허락하기 전에는 한 줄도 공개되지 않습니다. 정작 콘텐츠를 쓰는 일은 아직 손이 많이 가서 고객 업무와 함께 감당할 수 있게 줄일 방법을 찾는 중이라고 하고요. 처음에 이 체계를 갖추느라 품이 들었고 생활이 극적으로 달라지지도 않았답니다. 그래도 되찾은 시간을 회사의 다른 일에 돌리고 있다고 합니다.\n\n이 사례에서는 자동화 목록보다 눈여겨볼 것이 있습니다. 이 대표는 AI가 만든 초안을 그대로 내보내지 않고 마지막 확인을 자기 몫으로 남겨 두었습니다. 시간이 생기면 어디에 써야 할지도 알고 있었던 셈이죠. 콘텐츠 쓰는 시간과 고객 일 사이에서 균형을 잡고 싶다고 했으니까요.\n\n여기서 제 생각을 분명히 말씀드리겠습니다. AI가 아껴 준 시간은 저절로 내 것이 되지 않습니다. 쓸 곳을 정해 두지 않은 시간은 오래 비어 있지 않거든요. 다음 요청과 더 높아진 기대, 검증해야 할 AI의 결과물이 그 자리를 금세 채웁니다. AI를 잘 쓰는 사람일수록 이 일은 더 빨리 일어나고요. 퇴근 시간이 그대로인 이유는 AI가 부족해서가 아닙니다. 아낀 시간을 어디에 쓸지 먼저 정하지 않았기 때문입니다.\n\n강사가 권하는 순서도 같은 방향을 가리킵니다. 덮어놓고 자동화부터 하기보다 AI에게 어느 선까지 맡길 수 있는지부터 가려 보자는 겁니다. 자동화는 최소한으로 하되 가장 잘 되는 곳부터 찾고, 맡겨도 위험이 낮다고 판단된 일에 사람이 중간에 확인하는 장치를 여러 겹 둔 뒤 적
