<script id="md" type="text/plain"># handoff — mentor-lab 칼럼 작업실 (2026-10-11 기준)

이 문서 하나로 다음 사람(또는 다음 세션)이 이어받을 수 있게 정리했다. 최신 커밋 `0486c74` 기준.

## 1. 한눈에

- **무엇:** SK E&amp;S 기업문화AX팀(김산결M·이소민M) 사내 뉴스레터 칼럼을, 멘토(팀스파르타) 방식으로 만드는 실험 저장소 `skens/mentor-lab/`(git, 브랜치 master · GitHub `mynsoi/newsletter_upgrade`의 `mentor-lab` 브랜치). 팀 저장소 `newsletter_upgrade/`와는 따로 간다 — 팀 방식(문체 지침·루브릭·증거 게이트)은 쓰지 않는다.
- **작업실(웹앱):** http://100.73.64.64:8771 (Tailscale, Mac에서도) · 이 PC에서는 http://localhost:8771. 데스크톱 전용, 비밀번호 없음(멘토 결정).
- **흐름:** 서재(aside 수집) → **주제 지도**(원문 카드 → 같은 주장 묶기 → Claude 거르기 → 쓸 만한 주제엔 제목 후보) → 주제 고르기(미리 뽑은 제목 후보가 바로 뜸) → 제목 고르기 → 과정 1·2·3(Claude 초안 → astra 재작성 → astra 기준 반영, **공백 제외 1,500자 이하**) → [1,500자 넘으면 줄이기 · 절반] → 과정 4~(멘토 피드백, astra) → 그림(머리 1 + **본문 2**, astra 설명 + gti) → 확정.
- **최근 결과:** 작업실 화면에서 주제 고르기부터 확정까지 눌러 만든 시험 칼럼 3편 → 멘토 &quot;글이 아예 맘에 안듬&quot; → **지우고 되돌림**(git `0486c74`에 남음). 새 방식의 글쓰기는 아직 멘토 기준을 못 넘었다(8·11번).
- **이번 개편 근거:** http://100.73.64.64:8771/docs/2026-10-11-주제-거르기.html (Claude가 원문 59편을 거른 결과 — 멘토 &quot;괜찮네&quot; → &quot;이방식으로 진행&quot;).

## 2. 사용자와 일하는 방식 (꼭 지킬 것)

멘토의 관점은 &quot;결과 → 과정 → 결과 업그레이드&quot;. 아래는 멘토가 직접 정했거나 지적한 것들.

**결과를 보여 줄 때 (2026-10-10~11 여러 번 강하게 지적)**
- **한국어로만** 말한다(&quot;한국어로 말하라고&quot;).
- **결과는 HTML 링크로** — md 경로나 채팅 표만 주지 않는다(&quot;md 말고 좀 보여달라니까 html로 열어서 mac에서 볼수있게&quot;). `docs/&lt;날짜&gt;-&lt;이름&gt;.html`(Sparta 토큰, 라이트)로 만들고 작업실 주소 `/docs/…`로 준다. 내용을 바꾸면 **새 파일 이름**으로(같은 주소는 Mac 브라우저가 예전 판을 보여 줬다). 헤드리스 브라우저로 열어 캡처해 보고 나서 링크를 준다.
- **읽기 쉽게** — 맨 위 한 줄 요약표, 카드는 짧게, 긴 설명은 접기(&quot;가독성있게좀 보여줘라&quot;).
- **보여 주기 전에 내가 먼저 점검** — 원문과 대조(숫자·고유명사), 같은 틀로 쏠림(질문형 등), 일반론(&quot;AI를 잘 쓰려면 ~해야 한다&quot;), 번역체, 멘토 기준(`criteria.md`). 걸리면 고치거나 그대로 밝힌다.
- **생각 없이 돌리지 않기** — 같은 변수(프롬프트 규칙)만 계속 바꾸지 않는다. 좋은 예가 한 모양뿐이면 그 모양으로 쏠린다(질문형 두 개만 줬더니 다 질문형). 방향을 멋대로 바꾸지 않는다(주제별 제목을 주기로 해 놓고 제목을 빼 버렸다가 &quot;뭐하자는거야&quot;).

**글과 주제**
- **원문 그대로:** 요약본·발췌로 쓰지 않는다. 글은 언제나 원문 전체로.
- **멘토 피드백은 받은 그대로** 파일로 넘긴다. 해석·재작성 금지.
- **제목은 astra만** — Claude가 지은 제목은 &quot;AI slop&quot;. 후보를 보여 줄 때도 astra 것을 그대로, 내가 고르거나 예시 제목을 짓지 않는다.
- **회사에서 일하는 직원 기준** — 원문은 프리랜서·개인 사례여도 직원에게 통하면 쓴다(&quot;굳이 회사의 사례 원문을 가져올 필요 없이&quot;). 걸러 내지 않고, 글에서 회사 이야기로 옮긴다. 직원의 부서·업무 장면을 지어내지 않는다.
- **대상 독자를 골라 가며** — 팀장급·사수급·신입사원·전 직원.
- **좋은 업무 인사이트** — 인사이트는 원문 글쓴이의 주장과 사례에 이미 있다. 그걸 요령·관점으로 다시 쓰면 흐려진다. 쓸모를 가르는 건 **거르기**다.
- **&quot;(끝)&quot;은 뺀다**(경영일기 필자의 맺음 표시).
- **글은 1,500자 이하, 본문에 설명을 돕는 그림 2개**(2026-10-11).

**그 밖**
- **gti(그림)는 무조건 gpt-6-astra** — 전역 npm `gti`는 기본 gpt-5.4라 400. god-tibo-imagen 스킬 스크립트로 부른다.
- **화면:** 데스크톱만, wow 디자인(참고 사이트 = 컴포넌트를 실제로 설치해 쓰는 곳), UI 사이사이 설명 문구 금지, 임의 개수 상한 금지, 판은 &quot;과정 1·2·3&quot;, 주제도 AI가 내고 멘토는 고르기만.
- **실험판은 목록에 섞지 않는다**(briefs의 `&quot;experiment&quot;: true`).
- **리포트 디자인**은 `newsletter_upgrade/.herdr-web-ui/design-20261009-192345-8f64450b.md`(Sparta). claude.ai Artifact는 절대 쓰지 않는다(전역 지시).
- **팀 저장소(`newsletter_upgrade/`)에 커밋·푸시는 먼저 묻는다.** mentor-lab은 이 작업의 저장소라 커밋해 왔다. 보고·커밋은 한국어.

## 3. 칼럼 만드는 기준 방식

`scripts/column_pipeline.py` (설정: `briefs/&lt;글&gt;.json` — thesis·sources·title·target·length·r4_refs)

| 과정 | 누가 | 하는 일 |
|---|---|---|
| 과정 1 초안 | Claude (`claude -p --model opus`, 빈 폴더) | 원문 전체 + 경영일기 3편(p747·p724·p740) 문체 참고 · 대상 독자 한 줄 · 지킬 것 3개(원문 문장 옮기지 않기 · 없는 사실 지어내지 않기 · 원문 속 사람의 사정을 일반화하지 말고 회사 장면으로 옮기기) · 공백 제외 1,500자 이하 · 제목 고정 |
| 과정 2 재작성 | astra (`codex exec -m gpt-6-astra`) | &quot;경영일기 필자(유정식)가 직접 썼다면&quot; — 참고 2편 기본 p724·p669, 1,500자 이하 |
| 과정 3 기준 반영 | astra | `briefs/standing-feedback.md`(멘토 피드백 원문)를 반영, 1,500자 이하 |
| (1,500자) | astra | 과정 3 뒤에도 넘으면 1,500자 이하로 줄인 과정을 더함(`fit`, 기본 모드만) |
| (절반) | astra | 설정 `&quot;length&quot;: &quot;half&quot;`면 과정 3 뒤 절반 분량으로 줄인 과정을 더함(`--shorten`) |
| 과정 4~ 피드백 | astra | 작업실 입력창의 피드백을 파일 그대로 넘겨 반영(`--revise`) |

- 대상 독자: 설정 `target`(전 직원 기본 · 팀장급 · 사수급 · 신입사원) — 주제 판정의 audience에서 들어오고, 글 화면 위쪽 줄에서 바꾼다. 설명 문구는 `column_pipeline.TARGETS`.
- 확정 칼럼: `columns/2026-10-08-ai-퇴근시간.md`(멘토 기준 글). 2026-10-11 시험 칼럼 3편은 멘토가 &quot;아예 맘에 안 듬&quot; → 지움.
- 그림: `scripts/image_candidates.py` — 머리 그림 후보(1536×1024, 3:2) / `--inline` 본문 그림 **2개**(설명을 돕는 그림, astra가 문단 번호로 자리 지정, 16:9). 확정 때 고른 본문 그림을 그 문단 뒤에 넣는다.

## 4. 주제 지도 (2026-10-11 개편)

- **흐름:** `python3 -I scripts/wiki.py --ingest` — ① 카드(astra, 원문마다 동시에): 있었던 일 · 글쓴이가 하는 말 ② 묶기(astra 한 번): 글쓴이의 주장이 **같은** 원문끼리만 ③ 거르기(Claude 한 번): 쓸 만함·보통·뺌 + 있었던 일 한 줄 + 왜 쓸모 + 대상 독자 ④ 제목 후보(astra, 쓸 만함 주제마다 동시에, 제목 단계 그대로). 수집이 끝나면 저절로 돈다. 원문 2편 넣기에 67초(임시 복사본 시험).
- **구조:** `wiki/cards.json`(원문 카드) · `wiki/주제/&lt;중심 원문&gt;.md`(머리말 title=있었던 일 한 줄 · verdict · audience · center · status · used_in / 본문 왜 쓸모 · 이 글이 말할 것 · 제목 후보 · 원문 표 · 글쓴이가 하는 말) · `wiki/판정예시.md`(거르기의 기준 — 멘토가 괜찮다고 한 판정 + 멘토가 바꾼 판정) · `index.md` · `log.md` · 규칙 문서 `wiki/AGENTS.md`.
- **명령:** `--ingest` · `--refilter`(판정 예시로 전체 다시 거르기) · `--claim &lt;페이지&gt;`(고르자마자 글 설정 + 제목 후보를 제목 탭에, LLM 없음) · `--verdict &lt;페이지&gt; &lt;판정&gt;`(멘토 판정 → 예시에 쌓임, 쓸 만함으로 올리면 제목 후보) · `--written` · `--status`.
- **AI는 답만:** astra·Claude는 읽기 전용으로 답만 하고 위키 파일은 스크립트가 쓴다. 원문 속 지시문은 따르지 않게 하고, 결과에 비밀값·로컬 경로·긴 토큰처럼 보이는 게 있으면 버린다(`LEAK` — 이름 목록은 보조, 실제 방어는 읽기 전용 실행 · HTML escape · Tailscale 안 화면).
- **현재:** 원문 59편 카드, 주제 47 — 쓸 수 있음(쓸 만함 13 · 보통 9 · 뺌 20) + 쓴 글 5. 넣기·거르기·판정·고르기·확정마다 `wiki/`만 git에 자동 커밋.
- **내 주제로 쓰기(2026-10-11, 멘토 &quot;내가 직접 문서랑 주제를 주고, 인사이트를 골라서 글을 생성하게도&quot;):** `python3 -I scripts/my_topic.py --new &lt;주제 파일&gt; [--target …] [--doc &lt;파일&gt; …]` — ① 후보(Claude, 카드 59편 전부·판정 무관 — 원문 속 사람이 한 일이 주제를 보여 주는가, 반대편 포함) ② 고르기(Claude, 후보 원문 통째: 중심 1 + 받침 0~2, 맡는 몫·가져올 사실, 나머지는 뺀 이유) → `briefs/m-&lt;시각&gt;.json`(thesis = 멘토 말 그대로, `roles`, `from_mine`) + 제목 후보(astra) → 작업실 글 목록 제목 탭. 초안은 `from_mine`이면 &quot;말할 것은 멘토가 정했고 원문은 사례&quot;로 지시(`column_pipeline.mine_lines`, 기존 경로 지시문은 그대로 — 설정 5개로 같음 확인). 문서는 `sources/mine/&lt;글&gt;/NN.md`(pdf는 pdftotext, docx·hwp는 LibreOffice — hwp는 미시험), 그 글자는 Claude·astra로 나간다. 주제 지도(wiki/)는 건드리지 않는다. 바꿔 끼우기 `--brief &lt;글&gt; &lt;원문 키…&gt;`, 결과 페이지 `--page &lt;글&gt; &lt;이름&gt; [점검 메모]`. **작업실은 대화가 글을 끌고 간다**(멘토 2026-10-11 &quot;그 글에 있는 채팅이 계속해서 글 작성까지 흐름을 끌고 간다 … 실제로 그렇게 되어야&quot;): 메인 = 들어올 때마다 빈 채팅(요청 + 문서 첨부·끌어놓기, 대상 독자) → 보내면 그 글 화면(`app/src/views/Flow.tsx`). 왼쪽 목록 = 대화(글 + 고르는 중인 대화). 글 화면 = 왼쪽 대화 타임라인(요청 → 고른 원문 → [이 원문으로] → 제목 후보 회차 → ✓제목 → [쓰기] → 과정 1·2·3 → 피드백 → 과정 4… → 그림 → 확정) + 오른쪽 &#x27;지금 글&#x27;(최신 과정 본문·글자 수). 입력창 하나, 단계가 보낸 말의 갈 곳을 정한다: 원문 단계 = 대화 전체로 다시 고르기(`--more`, 앞 차례 `picks-N.json`, 대화 `turns.jsonl`) · 제목 = astra 제목 회차(`--message`) · 과정 3 뒤 = 피드백(`--revise`) · 작업 중 = 막힘. 단계 넘기기는 카드 버튼으로만. 드롭다운의 &#x27;진행자&#x27;는 비상구. 오른쪽 &#x27;지금 글&#x27;에서 과정을 골라 **편집**(저장하면 &#x27;멘토&#x27; 과정으로 쌓임 — `edit`) · **여기서 이어 쓰기**(앞 과정을 그대로 다음 과정으로 올려 피드백이 거기서 이어짐 — `base`) · **이 과정으로 확정**. 본문이 다 별로면 **처음부터 다시 쓰기**(같은 대화 안에서, 지금까지 과정은 `runs/columns/&lt;글&gt;.try-N/`으로 접어 두고 쓰기 전 단계로 — `restart`, 두 번 눌러야). 예전 탭 화면(제목/과정/그림/확정, `Article.tsx`)은 2026-10-11 지움(멘토 승인, 계획 `docs/2026-10-11-화면정리-계획.html`) — 주소 `#/a/&lt;글&gt;/&lt;탭&gt;`은 대화 화면으로 열림. 거기에만 있던 것은 대화 화면으로 옮김: 오른쪽 &#x27;지금 글&#x27;의 **본문·비교·미리보기**(미리보기에서 그 과정으로 확정), 오른쪽 위 **대상 독자·기본/절반**(쓴 뒤 절반 = 최신 과정을 줄인 과정 추가, 기준 글에도), 마지막 제목 카드의 **다시 뽑기**, 그림 카드의 **문단 N** 칩·지난 회차 접기, 기준 글 편집. 조각(본문·진행자 창·본문 그림 자리)은 `app/src/views/parts.tsx`. 서버 `retry`(새 글로 다시 쓰기) 지움. 삭제 = 휴지통 버튼 두 번 → `trash/&lt;글&gt;-&lt;시각&gt;/`로 옮김(gitignore, 도는 작업 있으면 거절, 확정 기준 글은 버튼 없음, 주제 지도 글이면 used_in 되돌림). 서버 동작: `mine` · `mine-more` · `mine-ok` · `mine-swap` · `delete`. 화면 시험: 요청 → 이어서 한 말 → 이 원문으로 → 제목 회차 → 제목 → 쓰기(5분) → 피드백 → 과정 4 → 삭제를 실제로 눌러 통과(시험 글은 휴지통까지 지움). 첫 시연: 자기평가 주제 → linkedin/29 + threads/27, 6분 → `docs/2026-10-11-내주제-자기평가.html`. 글쓰기(과정 1·2·3)는 11-1 때문에 안 돌림.
- **왜 바꿨나:** 10/10 채택한 LLM 위키(astra가 원문을 한 편씩 읽어 비슷한 논지를 합침)는 주제가 &quot;~부터&quot;, &quot;~하자&quot; 교육 자료식 권고로 뭉개지고 원문의 날카로운 말이 사라졌다(멘토 &quot;좋은 업무 인사이트가 나오지를 않는거같은데&quot;). 시험한 길: &#x27;이 글만의 것&#x27; 위키(수수께끼 제목) → 제목 금지 목록(질문형·번역체) → 경영일기 목소리 → 모델 비교(astra·sol·luna, 차이 작음) → 제목 없는 카드(&quot;있었던 일 + 글쓴이가 하는 말&quot;, &quot;훨씬 낫다&quot;) → 직원 인사이트 다시 쓰기(요령형으로 수렴, 2회차도 흐림) → **Claude 거르기**(&quot;괜찮네&quot;). 기록 `wiki-eval/run_*.py`, `docs/2026-10-11-*.html`, 옮기기 `wiki-eval/migrate_wiki_20261011.py`. 예전 위키는 git 기록에(`c3c2f1f` 이전).

## 5. 작업실 웹앱

- **실행:** `cd mentor-lab/app &amp;&amp; npm run build` → `cd .. &amp;&amp; python3 -I scripts/studio_server.py 8771`. Windows: `setup-windows.cmd` → `start-windows.cmd`(README). 서버가 버튼을 기존 명령(`column_pipeline.py`·`wiki.py`·`image_candidates.py`·`collect.py`)에 잇기만 한다. 작업 기록 `runs/studio/`.
- **화면:**
  - 서재 — 원문 카드(Threads·LinkedIn·경영일기), 입력창 + &quot;aside 수집&quot;(비우면 자동), 수집 기록 줄.
  - 주제 — 탭 **쓸 만함 · 보통 · 뺌 · 쓴 글**(개수). 카드 앞면 = 있었던 일 한 줄 · 왜 쓸모 · 대상 독자 칩 · 사이트. 펼치면 제목 후보 8개(두 줄) · 글쓴이가 하는 말 · 원문(누르면 원문 서랍) · **판정 바꾸기**(쓸 만함/보통/뺌 → `wiki-verdict` 작업). &quot;이 주제로&quot; → 글 설정을 그 자리에서 만들고 제목 탭으로(후보가 이미 떠 있음, 없으면 제목 단계가 돈다). 위쪽 &quot;다시 거르기&quot;(`wiki-lint` → `--refilter`) · &quot;넣기 N&quot;.
  - 메인 — 새 채팅 입력창 + 아래 글 카드. 글을 누르면 대화 화면(4절), 위쪽 &#x27;제목·과정·그림·확정&#x27;은 예전 자세히 화면.
  - 글 — 대화 화면(`app/src/views/Flow.tsx`, 4절): 왼쪽 대화 타임라인 + 입력창 하나, 오른쪽 &#x27;지금 글&#x27;(독자·분량 · 본문/비교/미리보기 · 편집 · 여기서 이어 쓰기 · 확정). 위쪽 **삭제**(두 번), 메인 카드에도 삭제(마우스를 올리면). 확정 기준 글은 삭제 없음·입력창은 진행자만.
  - 진행 중 카드 · 전체 로그 창 · 라이트/다크.
- **보안:** localhost와 Tailscale 주소에만 붙음(LAN 차단), Host·Origin 확인, POST는 JSON만, 글 이름·경로·주제 페이지(`wiki/주제/*.md`) 검사.
- 리포트도 이 서버에서: `/docs/…`(그림은 `/img/&lt;경로&gt;?w=`), `/wiki-eval/report/…`.

## 6. 수집 (aside)

- `scripts/collect.py &quot;&lt;요청&gt;&quot;` — aside UltraBrowse로 주소만 받고, 글마다 REPL 스냅샷 → 파서로 원문 그대로 저장(`sources/originals/&lt;사이트&gt;/NN.md`). 개수 상한 없음, 이미 있는 주소는 건너뜀. 요청이 비면 자동(Threads·LinkedIn, &quot;반응 많은 글 먼저&quot; — 회사 글로 좁히는 건 멘토가 원치 않음).
- Threads는 끝까지 내려가며 여러 장 찍고 &quot;답글 보기&quot;를 펼친다. LinkedIn 날짜는 직함에서 떼어 냄. 경영일기는 `column_pipeline.py --fetch-infuture &lt;번호&gt;`.
- 수집이 끝나면 주제 지도 넣기가 저절로 이어진다.

## 7. 운영 주의 (겪은 것)

- **작업실 서버는 돌고 있는 작업이 없을 때만 재시작**(`curl -s localhost:8771/api/jobs`의 running). 화면 코드만 바꿨으면 `npm run build`만.
- **astra 터널이 자주 끊긴다** — opencodex 프록시 127.0.0.1:10100 · 허브 127.0.0.1:37369, 끊기면 503 &quot;link tunnel unavailable&quot;(10/10~11 밤에 서너 번). 멘토가 다시 붙여야 한다. 넣기·카드·제목·그림이 다 astra라 끊기면 빈 결과 — `wiki.py`·`run_*`는 비면 한 번 더 부른다. 시험 요청 `curl -s -m 20 http://127.0.0.1:10100/v1/responses -H &#x27;content-type: application/json&#x27; -d &#x27;{&quot;model&quot;:&quot;gpt-6-astra&quot;,&quot;input&quot;:&quot;hi&quot;}&#x27;` → `{&quot;detail&quot;:&quot;Input must be a list&quot;}`면 붙어 있는 것.
- 프롬프트는 **표준입력으로**(인자로 넘기면 128KB 한도). codex는 `&lt; /dev/null` 없이 부르면 stdin에서 멈춘다.
- **화면에서 눌러 시험**: `python3 wiki-eval/ui_e2e.py &lt;캡처 폴더&gt;` — 대화 화면을 헤드리스 브라우저로. 기본은 모델 없이(쓴 글의 과정 1·2·3을 복사한 시험 글 `zz-ui-&lt;시각&gt;`: 예전 주소 → 대화 화면 · 독자/분량 · 비교 · 미리보기 · 여기서 이어 쓰기 · 편집 저장 · 처음부터 다시 쓰기 · 삭제·휴지통 비우기, 30초), `--models`(절반·제목 회차·다시 뽑기, astra 2분), `--full &quot;&lt;요청&gt;&quot;`(메인 채팅부터 피드백·삭제까지, 20분). 시험 글은 스스로 지운다. 버튼 이름은 `exact=True`로 — 본문에 &#x27;비교&#x27;·&#x27;편집&#x27; 같은 낱말이 있어 카드까지 잡힌다. README 캡처는 `python3 docs/readme/capture.py`(지운 글은 건너뜀).
- **도식(README):** `docs/how-it-works/{flow,architecture}.json`을 archify(`~/.claude/skills/archify`, `validate`/`deliver architecture … --quality showcase`)로 만들고, README 그림은 `docs/2026-10-10-동작-원리.html`을 거쳐(Sparta 색을 입힘) 헤드리스 브라우저로 svg를 캡처한다. 상자 부제를 길게 쓰면 showcase 검증(desktop-readability)에 걸린다.
- 그림 비율: 머리 3:2(허용 0.2), 본문 16:9.
- **Windows:** 파이썬은 `-X utf8`, 경로는 `as_posix()`, `codex.cmd`는 `shutil.which`. codex 샌드박스는 리눅스에서만 확인됨.
- 8770(`view/` 예전 비교 화면)은 0.0.0.0에 열려 있다(작업실 8771과 달리 LAN 차단 없음) — 필요 없으면 끄기.

## 8. 알려진 문제·아직 확인 못 한 것

- **새 방식으로 쓴 시험 칼럼 3편 — 멘토 &quot;글이 아예 맘에 안듬&quot;** → 지우고 되돌림(`criteria.md` 17). 무엇이 별로였는지 아직 모른다 — 다음에 쓸 때 먼저 물어볼 것. 그 글들에 새로 들어간 것: 지킬 것 3(회사 장면으로 옮겨 쓰기 — 글마다 &quot;월요일 아침, …&quot; 같은 가정 장면으로 열고 &quot;~해 보세요&quot;로 맺는 모양), 대상 독자 한 줄, 1,500자 이하, 제목 astra 후보 1번(셋 다 질문형). 비교 기준은 멘토가 만족한 `columns/2026-10-08-ai-퇴근시간.md`(R4 방식).
- 멘토 기준 갱신: 출처 이름은 간단히 넣어도 된다(`criteria.md` 16, 예: 토스 사례). &quot;~가 아니라 ~&quot; 말투(기준 1)를 standing-feedback에 넣을지는 답을 못 받았다 — 넣지 않았다.
- **화면에서 아직 안 눌러 본 것:** 판정 바꾸기, 다시 거르기, 수집 뒤 자동 넣기(넣기는 CLI·임시 복사본에서만). 판정 바꾸기는 실제 위키로 시험하지 말 것 — `판정예시.md`에 지어낸 &quot;(멘토)&quot; 판정이 쌓인다(임시 복사본에서).
- 1,500자 줄이기(`fit`)는 한 번도 안 돌았다(시험 3편이 처음부터 1,019·1,068·1,149자).
- 거르기 Claude가 한 번에 주제 전부를 본다 — 주제가 수백 개면 나눠야 한다. `--refilter`는 47개에서 미시험.
- 묶기는 이번 59편을 Claude 판정의 묶음으로 옮겼다(astra 묶기 결과와 일부 다름 — linkedin/21+threads/17, linkedin/15+linkedin/01을 Claude가 합침).
