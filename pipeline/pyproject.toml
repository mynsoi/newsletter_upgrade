[project]
name = "ai-culture-insights"
version = "0.1.0"
description = "AI 시대 일하는 방식 인사이트 콘텐츠 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "psycopg[binary]>=3.2",
    "pypdf>=4.0",
    "cryptography>=3.1",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# 발행 도구(web/) 전용 — make publish-ui · make site. 설치: pip install --group web
web = ["flask>=3.0", "markdown>=3.5", "pillow>=10.0", "html2image>=2.0"]
