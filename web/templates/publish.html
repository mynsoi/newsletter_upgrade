<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아티클 발행 도구</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #0B6E4F;
  --accent-soft: #DCEFE7;
  --accent-ink: #fff;
  --canvas: #F7F8FA;
  --surface: #FFFFFF;
  --ink: #101114;
  --ink-secondary: #3D4148;
  --ink-muted: #6E7278;
  --line: #DFE1E5;
  --r-card: 16px;
  --r-chip: 999px;
  --danger: #D32F2F;
  --kr: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  --en: "Archivo", var(--kr);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--kr);
  background: var(--canvas);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  padding: 32px 24px 80px;
}

.container { max-width: 960px; margin: 0 auto; }

h1 {
  font-size: 28px; font-weight: 800; letter-spacing: -0.03em;
  margin-bottom: 8px;
}
.subtitle { font-size: 14px; color: var(--ink-muted); margin-bottom: 32px; }

/* --- 업로드 영역 --- */
.upload-zone {
  border: 2px dashed var(--line);
  border-radius: var(--r-card);
  padding: 48px 24px;
  text-align: center;
  background: var(--surface);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.upload-zone p { font-size: 15px; color: var(--ink-muted); }
.upload-zone .label {
  font-size: 16px; font-weight: 700; color: var(--accent);
  margin-bottom: 6px;
}
#file-input { display: none; }

/* --- 파싱 결과 미리보기 --- */
.parsed { display: none; margin-top: 32px; }
.parsed.show { display: block; }

.card {
  background: var(--surface);
  border-radius: var(--r-card);
  padding: 24px;
  margin-bottom: 20px;
  border: 1px solid var(--line);
}
.card-label {
  font-family: var(--en);
  font-size: 11px; font-weight: 700;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 12px;
}
.card h2 {
  font-size: 22px; font-weight: 800;
  letter-spacing: -0.02em; word-break: keep-all;
  margin-bottom: 8px;
}
.card .meta { font-size: 13px; color: var(--ink-muted); }

/* --- 이미지 섹션 --- */
.image-section { margin-bottom: 28px; }
.image-section-title {
  font-size: 15px; font-weight: 700; margin-bottom: 12px;
  word-break: keep-all;
}
.image-candidates {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 8px;
}
.image-candidate {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  border: 3px solid transparent;
  transition: border-color 0.15s;
}
.image-candidate.selected {
  border-color: var(--accent);
}
.image-candidate img {
  width: 100%;
  aspect-ratio: 16 / 9;
  object-fit: cover;
  display: block;
}
.image-candidate.hero-candidate img {
  aspect-ratio: 16 / 7;
}
.image-candidate .style-label {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 4px 8px;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 11px; font-weight: 600;
  text-align: center;
}
.image-candidate .check {
  display: none;
  position: absolute;
  top: 8px;
  right: 8px;
  width: 24px; height: 24px;
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 50%;
  font-size: 14px;
  line-height: 24px;
  text-align: center;
}
.image-candidate.selected .check {
  display: block;
}

/* --- 이미지 배치 에디터 --- */
.layout-editor {
  margin-top: 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  background: var(--canvas);
}
.layout-editor-label {
  font-size: 12px; font-weight: 700; color: var(--accent);
  letter-spacing: 0.05em; text-transform: uppercase;
  margin-bottom: 10px;
}
.layout-para {
  font-size: 13px; line-height: 1.7;
  color: var(--ink-secondary);
  padding: 6px 0;
}
.layout-drop-zone {
  position: relative;
  height: 8px;
  margin: 2px 0;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.2s;
}
.layout-drop-zone::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 2px;
  background: var(--line);
  border-radius: 1px;
  transform: translateY(-50%);
  transition: all 0.2s;
}
.layout-drop-zone:hover {
  height: 40px;
  background: var(--accent-soft);
}
.layout-drop-zone:hover::before {
  height: 3px;
  background: var(--accent);
}
.layout-drop-zone:hover::after {
  content: "여기에 이미지 배치";
  position: absolute;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  font-size: 11px; font-weight: 600;
  color: var(--accent);
  white-space: nowrap;
}
.layout-drop-zone.active {
  height: auto;
  padding: 6px 0;
  background: var(--accent-soft);
  cursor: default;
}
.layout-drop-zone.active::before { display: none; }
.layout-drop-zone.active::after { display: none; }
.layout-drop-zone.active:hover { background: var(--accent-soft); }
.layout-placed-img {
  width: 100%;
  max-width: 320px;
  border-radius: 8px;
  display: block;
  margin: 4px auto;
}
.layout-move-hint {
  text-align: center;
  font-size: 11px;
  color: var(--ink-muted);
  margin-top: 4px;
}

/* --- 프롬프트 아코디언 --- */
.prompt-toggle {
  font-size: 12px; font-weight: 600; color: var(--accent);
  background: none; border: none; cursor: pointer;
  padding: 4px 0;
}
.prompt-toggle::after { content: " ▸"; font-size: 10px; }
.prompt-toggle.open::after { content: " ▾"; }
.prompt-edit-area {
  display: none; margin-top: 8px;
}
.prompt-edit-area.show { display: flex; gap: 8px; }
.prompt-edit-area textarea {
  flex: 1;
  font-family: var(--kr);
  font-size: 13px;
  line-height: 1.6;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  resize: vertical;
  min-height: 60px;
  color: var(--ink);
}
.prompt-edit-area textarea:focus {
  outline: none;
  border-color: var(--accent);
}

/* --- 버튼 --- */
.btn {
  font-family: var(--kr);
  font-size: 13px; font-weight: 600;
  border: none; border-radius: var(--r-chip);
  padding: 8px 16px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-outline {
  background: transparent; color: var(--accent);
  border: 1px solid var(--accent);
}
.btn-sm { font-size: 12px; padding: 6px 12px; }
.btn-lg { font-size: 15px; padding: 12px 28px; }

/* --- 진행 상태 --- */
.status-bar {
  display: none;
  margin-top: 16px;
  padding: 16px 20px;
  background: var(--surface);
  border-radius: var(--r-card);
  border: 1px solid var(--line);
}
.status-bar.show { display: block; }
.status-text { font-size: 14px; color: var(--ink-secondary); }
.progress {
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  margin-top: 10px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  width: 0%;
  transition: width 0.4s ease;
}

/* --- 최종 발행 --- */
.publish-actions {
  display: none;
  margin-top: 24px;
  padding: 24px;
  background: var(--surface);
  border-radius: var(--r-card);
  border: 1px solid var(--accent);
  text-align: center;
}
.publish-actions.show { display: block; }
.publish-actions p {
  font-size: 14px; color: var(--ink-secondary);
  margin-bottom: 16px;
}

/* --- 태그 편집 --- */
.tag-editor { margin-top: 12px; }
.tag-chips {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-bottom: 8px;
}
.tag-chip {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 600;
  padding: 5px 10px;
  border-radius: var(--r-chip);
  background: var(--accent-soft);
  color: var(--accent);
}
.tag-chip .remove-tag {
  cursor: pointer; font-size: 14px; line-height: 1;
  opacity: 0.6;
}
.tag-chip .remove-tag:hover { opacity: 1; }
.tag-add-row {
  display: flex; gap: 6px; align-items: center;
}
.tag-add-row input {
  font-family: var(--kr); font-size: 13px;
  border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; width: 140px; color: var(--ink);
}
.tag-add-row input:focus {
  outline: none; border-color: var(--accent);
}

/* --- 호수 입력 --- */
.issue-input-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 10px;
}
.issue-input-row label {
  font-size: 13px; font-weight: 600; color: var(--ink-secondary);
}
.issue-input-row input {
  font-family: var(--kr); font-size: 13px;
  border: 1px solid var(--line); border-radius: 8px;
  padding: 6px 10px; width: 60px; text-align: center; color: var(--ink);
}
.issue-input-row input:focus {
  outline: none; border-color: var(--accent);
}

/* --- API 키 설정 --- */
.api-key-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 20px;
  background: var(--surface);
  border-radius: var(--r-card);
  border: 1px solid var(--line);
  margin-bottom: 20px;
}
.api-key-bar label {
  font-size: 13px; font-weight: 600; color: var(--ink-secondary);
  white-space: nowrap;
}
.api-key-bar input {
  flex: 1;
  font-family: var(--en); font-size: 13px;
  border: 1px solid var(--line); border-radius: 8px;
  padding: 7px 12px; color: var(--ink);
}
.api-key-bar input:focus {
  outline: none; border-color: var(--accent);
}
.api-key-status {
  font-size: 12px; font-weight: 600; white-space: nowrap;
}
.api-key-status.saved { color: var(--accent); }
.api-key-status.empty { color: var(--ink-muted); }

/* --- 에러 --- */
.error {
  background: #FDE8E8;
  color: var(--danger);
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 13px;
  margin-top: 12px;
  display: none;
}
.error.show { display: block; }

/* --- 반응형 --- */
@media (max-width: 640px) {
  body { padding: 20px 16px 60px; }
  .image-candidates { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <h1>아티클 발행 도구</h1>
  <p class="subtitle">.md 파일을 업로드하면 이미지를 생성하고 웹 페이지로 변환합니다.</p>

  <div class="api-key-bar">
    <label>OpenAI API Key</label>
    <input type="password" id="api-key-input" placeholder="sk-proj-..."
           oninput="saveApiKey()">
    <button class="btn btn-outline btn-sm" onclick="toggleKeyVisibility()" id="key-toggle-btn">보기</button>
    <span class="api-key-status empty" id="api-key-status">미설정</span>
  </div>

  <div class="upload-zone" id="upload-zone">
    <p class="label">.md 파일을 드래그하거나 클릭해서 업로드</p>
    <p>마크다운 아티클 파일을 선택하세요</p>
    <input type="file" id="file-input" accept=".md">
  </div>

  <div class="error" id="error"></div>

  <div class="parsed" id="parsed">
    <div class="card">
      <div class="card-label">Article Preview</div>
      <h2 id="article-title"></h2>
      <p class="meta">
        <span id="article-slug"></span> · <span id="article-date"></span>
        · 소제목 <span id="section-count"></span>개
      </p>
      <div class="issue-input-row">
        <label>호수</label>
        <input type="number" id="issue-number" min="1" placeholder="#">
      </div>
      <div class="tag-editor">
        <div class="card-label" style="margin-top:12px">태그</div>
        <div class="tag-chips" id="tag-chips"></div>
        <div class="tag-add-row">
          <input type="text" id="tag-input" placeholder="태그 추가…"
                 onkeydown="if(event.key==='Enter'){addTag();event.preventDefault();}">
          <button class="btn btn-outline btn-sm" onclick="addTag()">추가</button>
        </div>
      </div>
    </div>

    <div id="image-sections"></div>

    <div class="status-bar" id="status-bar">
      <div class="status-text" id="status-text">이미지 생성 중...</div>
      <div class="progress"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div style="margin-top: 20px; text-align: center;">
      <button class="btn btn-primary btn-lg" id="generate-btn" onclick="generateImages()">
        이미지 생성 시작
      </button>
    </div>

    <div class="publish-actions" id="publish-actions">
      <p>모든 이미지를 선택했습니다. HTML 페이지를 생성할 수 있습니다.</p>
      <button class="btn btn-primary btn-lg" onclick="publishArticle()">
        HTML 페이지 생성
      </button>
    </div>

    <div class="card" id="email-section" style="display:none;margin-top:24px;">
      <div class="card-label">이메일 파일 생성</div>
      <p style="font-size:14px;color:var(--ink-muted);margin-bottom:16px;">
        발행된 아티클을 .eml 파일로 다운로드합니다. VDI Outlook에서 열어 발송하세요.
      </p>
      <div style="margin-bottom:12px;">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">수신자 (쉼표로 구분)</label>
        <input type="text" id="email-to" placeholder="user1@sk.com, user2@sk.com"
          style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:var(--kr);">
      </div>
      <div style="margin-bottom:16px;">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:4px;">참조 CC (선택)</label>
        <input type="text" id="email-cc" placeholder="cc1@sk.com"
          style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:var(--kr);">
      </div>
      <button class="btn btn-primary" onclick="sendEmail()">.eml 파일 다운로드</button>
      <span id="email-status" style="font-size:13px;color:var(--ink-muted);margin-left:12px;"></span>
    </div>
  </div>
</div>

<script>
let articleData = null;
let selectedImages = {};
let imagePositions = {};
let skippedSections = {};
let currentTags = [];
let publishedSlug = '';

// --- API 키 관리 ---
function loadApiKey() {
  try {
    const key = localStorage.getItem('openai_api_key') || '';
    document.getElementById('api-key-input').value = key;
    updateKeyStatus(key);
  } catch (e) {}
}

function saveApiKey() {
  const key = document.getElementById('api-key-input').value.trim();
  try { localStorage.setItem('openai_api_key', key); } catch (e) {}
  updateKeyStatus(key);
}

function updateKeyStatus(key) {
  const status = document.getElementById('api-key-status');
  if (key && key.startsWith('sk-')) {
    status.textContent = '저장됨';
    status.className = 'api-key-status saved';
  } else {
    status.textContent = key ? '형식 확인' : '미설정 (플레이스홀더 모드)';
    status.className = 'api-key-status empty';
  }
}

function toggleKeyVisibility() {
  const input = document.getElementById('api-key-input');
  const btn = document.getElementById('key-toggle-btn');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '숨기기';
  } else {
    input.type = 'password';
    btn.textContent = '보기';
  }
}

function getApiKeyHeaders() {
  const key = document.getElementById('api-key-input').value.trim();
  const headers = { 'Content-Type': 'application/json' };
  if (key) headers['X-OpenAI-Key'] = key;
  return headers;
}

loadApiKey();

// --- 파일 업로드 ---
const zone = document.getElementById('upload-zone');
const fileInput = document.getElementById('file-input');

zone.addEventListener('click', () => fileInput.click());
zone.addEventListener('dragover', e => {
  e.preventDefault();
  zone.classList.add('dragover');
});
zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
zone.addEventListener('drop', e => {
  e.preventDefault();
  zone.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

function handleFile(file) {
  if (!file.name.endsWith('.md')) {
    showError('.md 파일만 업로드할 수 있습니다.');
    return;
  }
  const formData = new FormData();
  formData.append('file', file);

  fetch('/api/parse', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      if (data.error) { showError(data.error); return; }
      articleData = data;
      selectedImages = {};
      skippedSections = {};
      renderParsed(data);
    })
    .catch(err => showError('파일 파싱 실패: ' + err.message));
}

function renderParsed(data) {
  document.getElementById('article-title').textContent = data.title;
  document.getElementById('article-slug').textContent = data.slug;
  document.getElementById('article-date').textContent = data.pub_date;
  document.getElementById('section-count').textContent = data.sections.length;
  document.getElementById('parsed').classList.add('show');
  document.getElementById('publish-actions').classList.remove('show');
  document.getElementById('generate-btn').style.display = '';
  document.getElementById('generate-btn').disabled = false;

  currentTags = data.tags || [];
  renderTags();

  const container = document.getElementById('image-sections');
  container.innerHTML = '';

  imagePositions = {};

  // 히어로 섹션
  const heroSection = createImageSection('hero', '히어로 이미지', data.title, '', true);
  container.appendChild(heroSection);

  // 소제목별 섹션
  data.sections.forEach((sec, i) => {
    const key = 'section-' + i;
    imagePositions[key] = 0;
    const section = createImageSection(key, sec.heading, sec.heading, sec.body, false);
    container.appendChild(section);
  });
}

function createImageSection(key, label, heading, body, isHero) {
  const div = document.createElement('div');
  div.className = 'card image-section';
  div.dataset.key = key;
  div.dataset.heading = heading;
  div.dataset.body = body || '';

  var skipCheckbox = isHero ? '' :
    '<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-muted);cursor:pointer">' +
      '<input type="checkbox" class="skip-checkbox" data-key="' + key + '" onchange="toggleSkipSection(\'' + key + '\')">' +
      ' 이미지 없이 진행' +
    '</label>';

  div.innerHTML =
    '<div class="card-label">' + label + '</div>' +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap">' +
      '<button class="btn btn-primary btn-sm section-gen-btn" onclick="generateSingleSection(\'' + key + '\')">이미지 생성</button>' +
      '<span style="font-size:12px;color:var(--ink-muted)">~30초 · ~$0.21</span>' +
      skipCheckbox +
    '</div>' +
    '<div class="image-candidates" id="candidates-' + key + '"></div>' +
    (isHero ? '' : '<div class="layout-editor" id="layout-' + key + '" style="display:none"></div>') +
    '<button class="prompt-toggle" onclick="togglePrompt(this)">프롬프트 편집</button>' +
    '<div class="prompt-edit-area" id="prompt-' + key + '">' +
      '<textarea placeholder="비워 두면 본문 내용 기반으로 자동 생성됩니다"></textarea>' +
      '<button class="btn btn-outline btn-sm" onclick="regenerateImages(\'' + key + '\')">재생성</button>' +
    '</div>';

  return div;
}

function showLayoutEditor(key) {
  const editor = document.getElementById('layout-' + key);
  if (!editor) return;

  const sectionIdx = parseInt(key.split('-')[1]);
  const sec = articleData.sections[sectionIdx];
  if (!sec) return;

  const paragraphs = sec.body.split(/\n\n+/).filter(p => p.trim());
  const imgUrl = selectedImages[key];

  let html = '<div class="layout-editor-label">이미지 배치 (클릭하여 위치 선택)</div>';

  for (let i = 0; i <= paragraphs.length; i++) {
    const isActive = imagePositions[key] === i;
    html += '<div class="layout-drop-zone' + (isActive ? ' active' : '') + '" '
          + 'onclick="placeImageAt(\'' + key + '\', ' + i + ')">';
    if (isActive && imgUrl) {
      html += '<img class="layout-placed-img" src="' + imgUrl + '" alt="배치된 이미지">';
      html += '<div class="layout-move-hint">다른 위치를 클릭하면 이동합니다</div>';
    }
    html += '</div>';

    if (i < paragraphs.length) {
      html += '<div class="layout-para">' + paragraphs[i].replace(/\n/g, ' ') + '</div>';
    }
  }

  editor.innerHTML = html;
  editor.style.display = 'block';
}

function placeImageAt(key, paragraphIndex) {
  imagePositions[key] = paragraphIndex;
  showLayoutEditor(key);
}

function togglePrompt(btn) {
  btn.classList.toggle('open');
  const area = btn.nextElementSibling;
  area.classList.toggle('show');
}

// --- 이미지 생성 ---
async function generateImages() {
  const btn = document.getElementById('generate-btn');
  btn.disabled = true;
  btn.textContent = '전체 생성 중...';
  const statusBar = document.getElementById('status-bar');
  statusBar.classList.add('show');

  const sections = ['hero'];
  articleData.sections.forEach((_, i) => sections.push('section-' + i));

  for (let idx = 0; idx < sections.length; idx++) {
    const key = sections[idx];
    if (skippedSections[key]) continue;
    const pct = Math.round(((idx) / sections.length) * 100);
    const sectionName = key === 'hero' ? '히어로' : articleData.sections[parseInt(key.split('-')[1])].heading;
    document.getElementById('status-text').textContent =
      '전체 생성 중... (' + (idx + 1) + '/' + sections.length + ') — ' + sectionName;
    document.getElementById('progress-fill').style.width = pct + '%';
    await generateSingleSection(key);
  }

  document.getElementById('progress-fill').style.width = '100%';
  document.getElementById('status-text').textContent = '전체 생성 완료! 각 섹션에서 이미지를 선택해 주세요.';
  btn.style.display = 'none';
}

async function generateSingleSection(key) {
  const sectionDiv = document.querySelector('.image-section[data-key="' + key + '"]');
  const heading = sectionDiv ? sectionDiv.dataset.heading : '';
  const body = sectionDiv ? sectionDiv.dataset.body : '';
  const promptArea = document.getElementById('prompt-' + key);
  const promptOverride = promptArea ? promptArea.querySelector('textarea').value.trim() : '';
  const isHero = key === 'hero';

  const genBtn = sectionDiv.querySelector('.section-gen-btn');
  if (genBtn) { genBtn.disabled = true; genBtn.textContent = '생성 중...'; }

  const statusBar = document.getElementById('status-bar');
  statusBar.classList.add('show');
  const sectionName = isHero ? '히어로' : heading;
  document.getElementById('status-text').textContent =
    sectionName + ' — 3가지 스타일 병렬 생성 중 (~30초, ~$0.15)';

  try {
    const resp = await fetch('/api/generate-images', {
      method: 'POST',
      headers: getApiKeyHeaders(),
      body: JSON.stringify({ heading, body, prompt: promptOverride, is_hero: isHero, key, section_index: isHero ? -1 : parseInt(key.split('-')[1]) })
    });
    const data = await resp.json();
    if (data.error) { showError(data.error); if (genBtn) { genBtn.disabled = false; genBtn.textContent = '이미지 생성'; } return; }
    renderCandidates(key, data.images, isHero, data.labels);
    document.getElementById('status-text').textContent = sectionName + ' 생성 완료!';
    if (genBtn) genBtn.style.display = 'none';
  } catch (err) {
    showError('생성 실패 (' + key + '): ' + err.message);
    if (genBtn) { genBtn.disabled = false; genBtn.textContent = '이미지 생성'; }
  }
}

async function regenerateImages(key) {
  const sectionDiv = document.querySelector('.image-section[data-key="' + key + '"]');
  const heading = sectionDiv ? sectionDiv.dataset.heading : '';
  const body = sectionDiv ? sectionDiv.dataset.body : '';
  const promptArea = document.getElementById('prompt-' + key);
  const promptOverride = promptArea.querySelector('textarea').value.trim();
  const isHero = key === 'hero';

  const statusBar = document.getElementById('status-bar');
  statusBar.classList.add('show');
  document.getElementById('status-text').textContent = (isHero ? '히어로' : heading) + ' 재생성 중... (~40초)';

  try {
    const resp = await fetch('/api/generate-images', {
      method: 'POST',
      headers: getApiKeyHeaders(),
      body: JSON.stringify({ heading, body, prompt: promptOverride, is_hero: isHero, key, section_index: isHero ? -1 : parseInt(key.split('-')[1]) })
    });
    const data = await resp.json();
    if (data.error) { showError(data.error); return; }
    renderCandidates(key, data.images, isHero, data.labels);
    delete selectedImages[key];
    checkAllSelected();
    document.getElementById('status-text').textContent = '재생성 완료!';
  } catch (err) {
    showError('재생성 실패: ' + err.message);
  }
}

function renderCandidates(key, images, isHero, labels) {
  const container = document.getElementById('candidates-' + key);
  container.innerHTML = '';
  images.forEach((url, i) => {
    const div = document.createElement('div');
    div.className = 'image-candidate' + (isHero ? ' hero-candidate' : '');
    const labelTag = labels && labels[i]
      ? '<div class="style-label">' + labels[i] + '</div>'
      : '';
    div.innerHTML = '<img src="' + url + '" alt="후보 ' + (i + 1) + '">' + labelTag + '<div class="check">✓</div>';
    div.addEventListener('click', () => selectCandidate(key, div, url));
    container.appendChild(div);
  });
}

function selectCandidate(key, el, url) {
  const parent = el.parentElement;
  if (el.classList.contains('selected')) {
    el.classList.remove('selected');
    delete selectedImages[key];
    var editor = document.getElementById('layout-' + key);
    if (editor) editor.style.display = 'none';
  } else {
    parent.querySelectorAll('.image-candidate').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedImages[key] = url;
    if (key !== 'hero') {
      if (imagePositions[key] === undefined) imagePositions[key] = 0;
      showLayoutEditor(key);
    }
  }
  checkAllSelected();
}

function toggleSkipSection(key) {
  var cb = document.querySelector('.skip-checkbox[data-key="' + key + '"]');
  var sectionDiv = document.querySelector('.image-section[data-key="' + key + '"]');
  if (cb && cb.checked) {
    skippedSections[key] = true;
    delete selectedImages[key];
    sectionDiv.querySelectorAll('.section-gen-btn, .image-candidates, .layout-editor, .prompt-toggle, .prompt-edit-area').forEach(function(el) {
      el.style.opacity = '0.3';
      el.style.pointerEvents = 'none';
    });
  } else {
    delete skippedSections[key];
    sectionDiv.querySelectorAll('.section-gen-btn, .image-candidates, .layout-editor, .prompt-toggle, .prompt-edit-area').forEach(function(el) {
      el.style.opacity = '';
      el.style.pointerEvents = '';
    });
  }
  checkAllSelected();
}

function checkAllSelected() {
  var heroReady = selectedImages['hero'];
  var anySectionReady = false;
  articleData.sections.forEach(function(_, i) {
    var k = 'section-' + i;
    if (selectedImages[k] || skippedSections[k]) anySectionReady = true;
  });
  var actions = document.getElementById('publish-actions');
  if (heroReady && anySectionReady) {
    actions.classList.add('show');
  } else {
    actions.classList.remove('show');
  }
}

// --- 발행 ---
function publishArticle() {
  fetch('/api/publish', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      article: Object.assign({}, articleData, {
        tags: currentTags,
        issue_number: document.getElementById('issue-number').value || '',
        image_positions: imagePositions
      }),
      selected_images: selectedImages
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) { showError(data.error); return; }
    window.open(data.preview_url, '_blank');
    document.getElementById('status-text').textContent =
      '발행 완료! 파일: ' + data.output_path;
    publishedSlug = articleData.slug;
    document.getElementById('email-section').style.display = 'block';
  })
  .catch(err => showError('발행 실패: ' + err.message));
}

// --- 태그 관리 ---
function renderTags() {
  const container = document.getElementById('tag-chips');
  container.innerHTML = '';
  currentTags.forEach((tag, i) => {
    const chip = document.createElement('span');
    chip.className = 'tag-chip';
    chip.innerHTML = tag + ' <span class="remove-tag" onclick="removeTag(' + i + ')">×</span>';
    container.appendChild(chip);
  });
}

function addTag() {
  const input = document.getElementById('tag-input');
  const val = input.value.trim();
  if (val && !currentTags.includes(val)) {
    currentTags.push(val);
    renderTags();
  }
  input.value = '';
}

function removeTag(idx) {
  currentTags.splice(idx, 1);
  renderTags();
}

function sendEmail() {
  var toInput = document.getElementById('email-to').value.trim();
  if (!toInput) { showError('수신자를 입력해 주세요.'); return; }
  var recipients = toInput.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
  var ccInput = document.getElementById('email-cc').value.trim();
  var cc = ccInput ? ccInput.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];

  var statusEl = document.getElementById('email-status');
  statusEl.textContent = '.eml 생성 중...';

  fetch('/api/send-email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ slug: publishedSlug, recipients: recipients, cc: cc })
  })
  .then(function(r) {
    if (!r.ok) { return r.json().then(function(d) { throw new Error(d.error || '생성 실패'); }); }
    return r.blob();
  })
  .then(function(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'newsletter.eml';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    statusEl.textContent = '다운로드 완료! VDI Outlook에서 열어 발송하세요.';
  })
  .catch(function(err) { showError('이메일 생성 실패: ' + err.message); statusEl.textContent = ''; });
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 6000);
}
</script>
