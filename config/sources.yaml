#   추가 = 두 담당자 합의 + validate(PC·Actions) 통과 + 1개월 시험(trial_until)
#   제거 = 월간 성과 리뷰에서 6개월 무인용 시 퇴출 후보
#   장애 = 수리 → 뉴스레터 전환 → 제외 3단 사다리
