# 소스 카탈로그 — α 트랙 후보 등재 (2026-08-27)
# status: candidate = α4 확정 회의 전 후보. 현행 소스는 status 없음.
# 신규 소스의 verified는 false로 두고 GitHub Actions validate로 확정한다.
# 조선·중앙·동아는 섹션 피드만 등재(규칙 5). 중앙일보는 섹션 피드 미발견으로 등재 보류.
