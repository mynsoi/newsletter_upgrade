#   추가 = 두 담당자 합의 + validate(PC·Actions) 통과 + 1개월 시험(trial_until)
#   제거 = 월간 성과 리뷰에서 6개월 무인용 시 퇴출 후보
#   장애 = 수리 → 뉴스레터 전환 → 제외 3단 사다리
#
# 결정 로그:
#   2026-08-31 α4 확정: 51건 active(신규 41건 시험 중), 3건 excluded, 중앙일보 미등재(섹션 피드 부재)
#   2026-09-02 뉴스레터 경로 폐기 — 4건 제외(SSRN·a16z·인살롱·슈퍼브AI), html 7·browse 8 재배정, active 47
#   2026-09-04 C1(구독 계약) 폐기 — 현 계정(HBR Korea·DBR)+건별로 운영, LinkedIn 제외, HR Insight 보류. active 47
#   2026-09-04 유료 소스 약관 검토 생략 결정 — 건별 소량·내부 한정 원칙으로 운영
